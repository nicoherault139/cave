// ===================== v2.15 : apogée par table de garde sourcée =====================
// La table (inao.json → d) donne, par appellation et par type de vin, le « potentiel de garde » publié :
// Guide Hachette des Vins (source principale), Vins Vignes Vignerons (compléments). Chaque appellation INAO porte gk (clé de la table).
// Lecture : « X à Y ans » = de millésime+X à millésime+Y ; « Y ans » ou « jusqu'à Y ans » = de millésime à millésime+Y ;
// « à boire jeune » = millésime à millésime+1 ; « X ans et plus » = dès millésime+X, fin non précisée. Rien n'est calculé sans valeur publiée.
var GARDE=null;
var STYLES=[['','—'],['sec','Sec'],['moelleux','Moelleux / liquoreux'],['vdn','Vin doux naturel / de liqueur'],['jaune','Vin jaune'],['paille','Vin de paille']];
var FORMATS=[['','75 cl (standard)'],['37.5','Demi-bouteille 37,5 cl'],['50','50 cl'],['150','Magnum 1,5 L'],['300','3 L et plus']];
var GSLOT={R:'Rouge',B:'Blanc',P:'Rosé',E:'Effervescent',M:'Moelleux / liquoreux / VDN',J:'Vin jaune',S:'Vin de paille'};
var GSRC={H:'Guide Hachette des Vins',V:'Vins Vignes Vignerons',U:'votre table'};
var ALS_CEP=[[/riesling/,'alsace-riesling'],[/gewurz/,'alsace-gewurztraminer'],[/pinot gris|tokay/,'alsace-pinot-gris'],[/muscat/,'alsace-muscat'],[/sylvaner/,'alsace-sylvaner'],[/pinot blanc|klevner|auxerrois/,'alsace-pinot-blanc-ou-klevner'],[/chasselas|gutedel/,'alsace-chasselas-ou-gutedel'],[/edelzwicker/,'alsace-edelzwicker'],[/pinot noir/,'alsace-pinot-noir']];
function lsJSON(k,def){ try{ var v=JSON.parse(localStorage.getItem(k)||'null'); return v==null? def : v; }catch(e){ return def; } }
function gOver(){ return lsJSON('cave-garde-over',{}); }
function magnumBonus(){ var n=parseInt(lsJSON('cave-magnum-bonus',0),10); return n>0? n : 0; }
function gardeKey(r){
  var app=String(r.appellation||''); if(!app || !INAO) return null;
  var e=inaoFind(app);
  if(e && e.gk) return e.gk;
  var a=noAcc(app);
  if(/^alsace/.test(a) && !/grand cru/.test(a)){
    if(r.couleur==='Rouge'||r.couleur==='Rosé') return 'alsace-pinot-noir';
    var c=noAcc([r.cepages,r.cuvee].join(' '));
    for(var i=0;i<ALS_CEP.length;i++) if(ALS_CEP[i][0].test(c)) return ALS_CEP[i][1];
  }
  return null;
}
function gardeSlots(r){
  var st=r.style||'';
  if(r.couleur==='Rouge') return st==='vdn'? ['M','R'] : ['R'];
  if(r.couleur==='Rosé') return st==='vdn'? ['M','P'] : ['P'];
  if(r.couleur==='Effervescent') return ['E','B'];
  if(st==='moelleux'||st==='vdn') return ['M','B'];
  if(st==='jaune') return ['J','B']; if(st==='paille') return ['S','B'];
  return ['B','M'];
}
function gardeEntry(key,slot){
  var o=gOver()[key]; if(o && o[slot]) return {a:o[slot][0],b:o[slot][1],k:'user',s:'U',raw:'modifié par vous',n:null};
  var g=GARDE&&GARDE[key]; if(!g||!g[slot]) return null; var x=g[slot];
  return {a:x[0],b:x[1],k:x[2],s:x[3],raw:x[4],n:x[5]};
}
// Fenêtre calculée pour une fiche, ou null si la table n'a pas de valeur publiée
function apoRule(r){
  var key=gardeKey(r); if(!key) return null;
  var m=parseInt(r.millesime,10); if(!m||m<1900||m>2100) return null;
  var sl=gardeSlots(r), e=null, slot=null;
  for(var i=0;i<sl.length;i++){ e=gardeEntry(key,sl[i]); if(e && e.a!=null){ slot=sl[i]; break; } e=null; }
  if(!e) return null;
  var d=m+e.a, f=(e.b==null)? null : m+e.b;
  if(f!=null && (r.format==='150'||r.format==='300')) f+=magnumBonus();
  return { v: f==null? 'dès '+d : (d===f? String(d) : d+' – '+f), key:key, slot:slot, e:e };
}
function apoRuleTxt(x){
  if(!x) return '';

  }).catch(function(err){
    if(tok!==S.aiTok) return;
    aiState((S.aiMsg? esc(S.aiMsg)+'<br>' : '')+'🔮 Compléments indisponibles ('+esc(aiNetMsg(err))+')'); S.aiMsg='';
  });
}

/* ===== v2.10 : prompts allégés par intention, zéro IA quand le local est sûr, relais Gemini ⇄ Mistral ===== */
var COUL_TXT=COULEURS.join('|');
// Consignes courtes, une par intention
function buildSysAjout(){ return [
 'Dictée (transcription automatique, fautes possibles) d’un vin qui entre en cave. JSON seul : {"intention":"ajout|reassort","fiche":{},"refId":null,"qte":null}.',
 'fiche : n’inclure que les champs dits parmi domaine, cuvee, appellation, couleur ('+COUL_TXT+'), millesime, cepages, qte, zone ('+ZONES.map(function(z){ return z.nom; }).join('|')+')'+(maxEt()? ', etagere (1-'+maxEt()+')' : '')+', apogee ("AAAA – AAAA"), prix, note. Rien n’est deviné.',
 'Corrige l’orthographe des noms ; garde « Domaine », « Château », « Clos » s’ils sont dits ; cuvée sans le mot « cuvée » ; nombres en chiffres.',
 'Si le vin est l’une des fiches listées (même domaine, appellation, millésime) : intention reassort, refId et qte.'
].join('\n'); }
var SYS_AJOUT=buildSysAjout();
var SYS_MOUV=[
 'Dictée d’une sortie ou d’un ajout de bouteilles pour une fiche de cave. JSON seul : {"intention":"sortie|reassort|ajout","refId":null,"qte":1,"message":""}.',
 'refId = id de la fiche listée concernée ; aucune ne correspond : refId null (intention ajout s’il s’agit d’un nouveau vin) ; hésitation : refId null et une question courte dans message.'
].join('\n');
var SYS_RECH=[
 'Question sur une cave à vin. Échantillon de fiches fourni (id|vin|appellation|millésime|couleur|stock|apogée). JSON seul : {"resultats":[ids],"message":"réponse courte en français"}.',
 'resultats : ids de l’échantillon qui répondent, les plus pertinents d’abord.'
].join('\n');
function refShort(r){ return [r.id,nomVin(r),r.appellation,r.millesime].join('|'); }
// Compatibilité (bouton « Tester » des réglages)
function aiSystem(){ return SYS_AJOUT; }
function aiUser(text){ return promptAjout(text).usr; }
function promptAjout(text){
  var c=rankRefs(text,false).filter(function(x){ return x.sc>=3; }).slice(0,4);
  return { sys:SYS_AJOUT, usr:(c.length? 'Fiches proches (id|vin|appellation|millésime) :\n'+c.map(function(x){ return refShort(x.r); }).join('\n')+'\n' : '')+'Dictée : « '+text+' »', ids:c.map(function(x){ return x.r.id+':'+x.r.qte; }).join(',') };
}
function promptMouv(text,stockOnly){
  var c=rankRefs(text,stockOnly).slice(0,6);
  return { sys:SYS_MOUV, usr:'Fiches (id|vin|appellation|millésime|stock) :\n'+(c.map(function(x){ return refShort(x.r)+'|x'+x.r.qte; }).join('\n')||'(aucune)')+'\nDictée : « '+text+' »', ids:c.map(function(x){ return x.r.id+':'+x.r.qte; }).join(',') };
}
function promptRech(text){
  var stock=S.refs.filter(function(r){ return r.qte>0; }), pick=[], seen={};
  function add(r){ if(r && !seen[r.id] && pick.length<25){ seen[r.id]=1; pick.push(r); } }
  rankRefs(text,true).slice(0,8).forEach(function(x){ add(x.r); });
  COULEURS.forEach(function(c){ stock.filter(function(r){ return r.couleur===c; }).sort(function(a,b){ return (inWindow(b)?1:0)-(inWindow(a)?1:0); }).slice(0,5).forEach(add); });
  return { sys:SYS_RECH, usr:'Année : '+new Date().getFullYear()+'\nÉchantillon :\n'+(pick.map(function(r){ return [r.id,nomVin(r),r.appellation,r.millesime,r.couleur,'x'+r.qte,r.apogee||''].join('|'); }).join('\n')||'(cave vide)')+'\nQuestion : « '+text+' »' };
}
// Appel par intention (avec mémoire, sauf recherche)
function aiAsk(kind,text,stockOnly){
  var p= kind==='ajout'? promptAjout(text) : kind==='recherche'? promptRech(text) : promptMouv(text,stockOnly);
  var key= kind==='recherche'? null : kind+'|'+noAcc(text)+'|'+(p.ids||'');
  return cachedAI(key,p.sys,p.usr);
}
function aiCall(text,screen){ return aiAsk(screen==='cave'||screen==='recherche'? 'recherche' : 'ajout', text); }

/* --- Relais : si le service choisi est saturé ou à court de quota, l'autre prend le relais (si sa clé est enregistrée) --- */
function aiProvidersOrder(){ var p=aiProvider(); if(p==='none') return []; var o=[p]; ['gemini','mistral'].forEach(function(q){ if(q!==p && aiKey(q)) o.push(q); }); return o; }
function aiRetryable(e){ return !e || e.name==='TypeError' || e.status==='timeout' || e.status===429 || e.status>=500 || /quota|satur|overload|unavailable/i.test(e.message||''); }
function aiCallRaw(sys,usr,only){
  var list= only? [only] : aiProvidersOrder();
  if(!list.length) return Promise.reject(new Error('Assistant IA non configuré'));
  var i=0, lastErr=null, log=[];
  function next(){
    if(i>=list.length){ var e=lastErr||new Error('IA indisponible'); e.log=log; throw e; }
    var p=list[i];
    return aiCallProvider(p,sys,usr).then(function(r){ lsSet('ai_last',p); return r; }).catch(function(e){
      lastErr=e; log=log.concat(e.log||[(p==='gemini'?'Gemini':'Mistral')+' → '+aiNetMsg(e)]);
      if(i+1<list.length && aiRetryable(e)){ i++; AI_PROGRESS && AI_PROGRESS('Relais vers '+(list[i]==='gemini'?'Gemini':'Mistral')+'…'); return next(); }
      e.log=log; throw e;
    });
  }
  return next();
}

/* --- Zéro IA quand l'analyse locale est sûre --- */
function refsSure(t,stockOnly){
  var l=rankRefs(t,stockOnly); if(!l.length) return null;
  if(l[0].sc>=4 && (!l[1] || l[0].sc-l[1].sc>=2)) return l[0].r;
  return null;
}
function knownDomains(){
  var seen={}, out=[];
  (typeof DOMS_REF==='string'? DOMS_REF.split('|') : []).concat(S.refs.map(function(r){ return r.domaine; })).forEach(function(d){ if(d && !seen[d]){ seen[d]=1; out.push(d); } });
  return out;
}
// Domaine dicté rapproché des domaines connus (ta cave + liste de référence) — badge 📚
function domAssist(){
  var d=getField('domaine'); if(!d || S.userEdited.domaine || S.prov.domaine!=='dicte') return;
  var q=inaoNorm(d), qc=coreName(d); if(qc.length<4) return;
  var best=null;
  knownDomains().forEach(function(k){ var w=inaoNorm(k), wc=coreName(k); if(wc.length<4) return; var sc= (w===q||wc===qc)? 1.01 : simil(qc,wc); if(qc.length>=6 && wc.indexOf(qc)===0) sc=Math.max(sc,0.86); if(!best||sc>best.sc) best={n:k,sc:sc}; });
  if(best && best.sc>=0.82 && best.sc<1.01 && best.n!==d){ S.provOld.domaine=d; setField('domaine',best.n); S.prov.domaine='inao'; renderProv(); }
}
function localComplete(){ return !!(getField('domaine') && getField('appellation') && inaoFind(getField('appellation')) && getField('millesime')); }
// Même vin déjà en cave → proposition de réassort, sans IA
function localReassortHint(){
  var dom=inaoNorm(getField('domaine')), app=inaoNorm(getField('appellation')), mil=getField('millesime'), cuv=inaoNorm(getField('cuvee'));
  if(!dom || !mil) return false;
  var hit=S.refs.find(function(r){ return inaoNorm(r.domaine)===dom && String(r.millesime)===String(mil) && (!app || inaoNorm(r.appellation)===app) && inaoNorm(r.cuvee||'')===cuv; });
  if(!hit) return false;
  var q=parseInt(getField('qte'),10)||1;
  suggest('📚 Déjà en cave : <b>'+esc(nomVin(hit)+' '+hit.millesime)+'</b> (×'+hit.qte+')','Réassort +'+q,function(){ restock(hit.id,q); });
  return true;
}
// Recherche « combien… » : 100 % locale
function localCount(t){
  var x=noAcc(t).replace(/[’'?,;.!]/g,' ');
  var words=x.split(/\s+/).filter(function(w){ return w.length>=3 && QSTOP.indexOf(w)<0 && !/^(combien|reste|restent|ai|avons|bouteilles?|encore|cave|dans|il|me|nous|en|de|du|des|quel|quelle)$/.test(w); });
  var list=S.refs.filter(function(r){ return r.qte>0 && words.length && matchQ(words.join(' '),[r.domaine,r.cuvee||'',r.appellation,r.region,r.millesime,r.couleur,r.cepages]); });
  var tot=list.reduce(function(a,r){ return a+r.qte; },0);
  aiResults({ resultats:list.map(function(r){ return r.id; }), message: list.length? 'Il vous reste '+tot+' bouteille'+(tot>1?'s':'')+' ('+list.length+' référence'+(list.length>1?'s':'')+').' : 'Aucune bouteille en stock ne correspond.' }, t);
}

function doExport(){
  var blob=new Blob([JSON.stringify({version:APPV,zones:ZONES,refs:S.refs},null,1)],{type:'application/json'});
  var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='cave-export-'+new Date().toISOString().slice(0,10)+'.json'; a.click();
  toast('Copie exportée');
}
function doImport(input){
  var f=input.files[0]; if(!f) return;
  f.text().then(function(t){ var d=JSON.parse(t); if(d && !Array.isArray(d) && Array.isArray(d.refs)){ if(d.zones&&d.zones.length){ ZONES=d.zones; zonesSave(); } d=d.refs; } if(Array.isArray(d)){ S.refs=d; zonesAdopt(); save(); toast('Import réussi · '+d.length+' références'); } else toast('Fichier invalide'); }).catch(function(){ toast('Fichier invalide'); });
}

function isStandalone(){ return window.navigator.standalone===true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches); }
if(isStandalone()) document.documentElement.classList.add('standalone');
// Clavier iPhone : on remonte le panneau du bas au-dessus du clavier et on masque la barre d'onglets
if(window.visualViewport){
  var kbSync=function(){ var vv=window.visualViewport; var off=Math.max(0, Math.round(window.innerHeight - vv.height - vv.offsetTop));
    document.documentElement.style.setProperty('--kb', off+'px'); document.documentElement.classList.toggle('kbopen', off>80); };
  visualViewport.addEventListener('resize',kbSync); visualViewport.addEventListener('scroll',kbSync);
}
localLoad();
zonesInit(); zonesAdopt(); applyZones();
inaoLoad();
document.getElementById('overlay').onclick=closeDrawer;
document.getElementById('voicebar').onclick=function(){ if(VOICE) VOICE.stop(); };
document.getElementById('fab-mic').onclick=voiceAssistant;
window.addEventListener('resize',setHH);
document.getElementById('fileinput').onchange=function(){ doImport(this); };
if(!OD.token) odStatus('off','OneDrive non connecté');
odHandleCode();
odRestore();
if(OD.token && !location.search) odPull().then(render);
render();
if(needOnboarding() && !location.search) onbShow();
if('serviceWorker' in navigator && location.protocol==='https:'){
  navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(function(reg){ try{ reg.update(); }catch(e){} }).catch(function(){});
  // une nouvelle version vient d'être installée → rechargement automatique une seule fois
  var swReloaded=false, hadCtl=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange',function(){ if(swReloaded||!hadCtl||location.search) return; swReloaded=true; location.reload(); });
}
