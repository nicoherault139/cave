<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cave — Nicolas</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="./icon.svg">
<meta name="theme-color" content="#faf8f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1916" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cave">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600&family=Archivo:wght@400;600&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf8f3;--card:#fffdf8;--ink:#2b2620;--muted:#8a8073;--line:#e8e2d5;--acc:#b3542f;--gold:#9a7d2c;--green:#4c7a4c;--red:#a8402e;--shadow:0 10px 30px rgba(60,45,30,.08)}
@media(prefers-color-scheme:dark){:root{--bg:#1c1916;--card:#26221d;--ink:#efe9dd;--muted:#a09786;--line:#3a342c;--shadow:0 10px 30px rgba(0,0,0,.35)}}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
button,.chip,.card,#tabbar,.nav{-webkit-user-select:none;user-select:none;touch-action:manipulation}
input,textarea,select{touch-action:manipulation}
body{font-family:Archivo,system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex}
h1,h2,h3,.serif{font-family:Fraunces,Georgia,serif}
.mono{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
#app{display:flex;width:100%;min-height:100vh}
aside{width:250px;flex:0 0 250px;border-right:1px solid var(--line);padding:20px 16px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand h1{font-size:26px;line-height:1}
.brand small{color:var(--muted);font-size:12px}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;text-align:left;font-size:14.5px;color:var(--ink)}
.nav button:hover{background:var(--card)}
.nav button.on{background:var(--acc);color:#fff}
.badge{margin-left:auto;background:var(--red);color:#fff;border-radius:99px;font-size:11px;padding:1px 7px}
.gauges{display:flex;flex-direction:column;gap:10px;font-size:12.5px}
.gbar{height:7px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:4px}
.gfill{height:100%;background:var(--acc);border-radius:99px}
.gauge.garage .gfill{background:var(--gold)}
.store{margin-top:auto;font-size:12.5px;border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:8px}
.dot{display:inline-block;width:9px;height:9px;border-radius:99px;margin-right:6px;vertical-align:middle}
.dot.ok{background:var(--green)}.dot.err{background:var(--red)}.dot.off{background:var(--muted)}
.linkbtn{color:var(--acc);text-decoration:underline;font-size:12.5px;text-align:left}
main{flex:1;padding:28px 34px;max-width:1100px}
.viewhead{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:22px;flex-wrap:wrap}
.viewhead h2{font-size:32px}
.eyebrow{color:var(--acc);font-size:12px;text-transform:uppercase;letter-spacing:.12em;font-weight:600}
.btn{background:var(--acc);color:#fff;border-radius:12px;padding:11px 18px;font-weight:600;font-size:14.5px;display:inline-flex;align-items:center;gap:8px}
.btn.sec{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:9px}
.btn.danger{background:var(--red)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:24px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.tile b{font-size:26px;display:block;font-family:"IBM Plex Mono",monospace}
.tile span{color:var(--muted);font-size:12.5px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow);margin-bottom:20px}
.panel h3{font-size:17px;margin-bottom:12px}
.searchbar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
input[type=text],input[type=search],input[type=password],input[type=number],select,textarea{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;color:var(--ink);font:inherit}
.searchbar input[type=text],.searchbar input[type=search]{flex:1;min-width:200px;-webkit-appearance:none;appearance:none}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.chip{border:1px solid var(--line);border-radius:99px;padding:5px 13px;font-size:12.5px;background:var(--card)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);cursor:pointer}
.card:hover{border-color:var(--acc)}
.card .eyebrow{margin-bottom:4px}
.card h4{font-family:Fraunces,serif;font-size:16.5px;margin-bottom:2px}
.card .meta{color:var(--muted);font-size:12.5px;margin-bottom:10px}
.tagrow{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:11px;border-radius:99px;padding:2px 9px;background:var(--bg);border:1px solid var(--line);color:var(--muted)}
.tag.q{background:var(--acc);color:#fff;border-color:var(--acc)}
.tag.dead{background:var(--muted);color:#fff;border-color:var(--muted)}
.tag.alert{background:var(--red);color:#fff;border-color:var(--red)}
form .row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
form .full{grid-column:1/-1}
label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px}
input,select,textarea{width:100%}
.formfoot{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.banner{background:var(--bg);border:1px solid var(--gold);border-radius:12px;padding:11px 14px;font-size:13px;margin-bottom:16px}
.alert-item{display:flex;justify-content:space-between;gap:10px;padding:11px 4px;border-bottom:1px solid var(--line);font-size:14px;align-items:center}
.alert-item:last-child{border:none}
.sev{font-size:11px;border-radius:99px;padding:2px 9px;white-space:nowrap}
.sev.warn{background:#f3e3c8;color:#8a6414}.sev.crit{background:#f0d3cc;color:var(--red)}
#drawer{position:fixed;top:0;right:-440px;width:min(420px,100vw);height:100vh;background:var(--card);border-left:1px solid var(--line);transition:right .25s;z-index:50;overflow-y:auto;padding:26px;box-shadow:var(--shadow)}
#drawer.open{right:0}
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:.25s;z-index:40}
#overlay.open{opacity:1;pointer-events:auto}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
.fact b{display:block;font-size:14.5px}
.fact span{font-size:11.5px;color:var(--muted)}
.apobar{height:10px;background:var(--line);border-radius:99px;position:relative;margin:8px 0 4px}
.apobar .range{position:absolute;top:0;height:100%;background:var(--gold);border-radius:99px}
.apobar .now{position:absolute;top:-4px;width:4px;height:18px;background:var(--acc);border-radius:2px}
.chatbox{display:flex;flex-direction:column;gap:12px;max-width:720px}
.msg{padding:11px 15px;border-radius:14px;font-size:14.5px;max-width:85%;white-space:pre-wrap}
.msg.me{background:var(--acc);color:#fff;align-self:flex-end}
.msg.bot{background:var(--card);border:1px solid var(--line);align-self:flex-start}
.msg.bot b{font-family:Fraunces,serif}
.chatin{display:flex;gap:8px;margin-top:10px;max-width:720px}
.chatin input{flex:1}
.empty{color:var(--muted);text-align:center;padding:40px 0;font-size:14px;grid-column:1/-1}
.hint{color:var(--muted);font-size:12.5px}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 18px;font-size:13.5px;opacity:0;transition:.3s;z-index:99;pointer-events:none;max-width:90vw}
#toast.show{opacity:1}
/* --- v2.2 : éléments communs --- */
.dhead{display:flex;justify-content:flex-end;align-items:center;margin:-10px -8px 4px;position:relative;min-height:36px}
.dclose{width:40px;height:40px;border-radius:99px;font-size:18px;color:var(--muted)}
.grab{display:none}
#voicebar{position:fixed;top:calc(10px + env(safe-area-inset-top));left:50%;transform:translate(-50%,-160%);z-index:98;background:var(--ink);color:var(--bg);border-radius:16px;padding:10px 14px;display:flex;align-items:center;gap:10px;width:min(560px,calc(100vw - 24px));font-size:14px;transition:transform .25s;cursor:pointer;box-shadow:var(--shadow)}
#voicebar.show{transform:translate(-50%,0)}
.vdot{width:12px;height:12px;border-radius:99px;background:#e0543a;flex:none;animation:pulse 1.1s infinite}
.vtxt{flex:1;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.vstop{font-weight:600;font-size:13px;border:1px solid currentColor;border-radius:99px;padding:4px 10px;flex:none}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
#tabbar,.mhead,.only-m{display:none}
.ai-guess{border-color:var(--gold)!important;background:rgba(154,125,44,.09)!important}
.guess{color:var(--gold);font-weight:600;font-size:11.5px}
.spin{width:16px;height:16px;border-radius:99px;border:2px solid currentColor;border-right-color:transparent;flex:none;animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
#voicebar.busy{cursor:default}
.mhead .micbtn{background:var(--acc);color:#fff;font-size:18px}
.stepper{display:flex;align-items:center;justify-content:center;gap:18px;margin:18px 0}
.stepper button{width:52px;height:52px;border-radius:99px;border:1px solid var(--line);font-size:24px;background:var(--bg)}
.stepper b{font-size:34px;min-width:60px;text-align:center}
@media(max-width:820px){
body{display:block}
#app{flex-direction:column}
aside{position:sticky;top:0;z-index:30;width:100%;flex:none;height:auto;flex-direction:row;align-items:center;justify-content:space-between;gap:10px;border-right:none;border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:var(--bg);overflow:visible}
aside .nav,aside .gauges,aside .store{display:none}
.brand{display:flex;align-items:baseline;gap:8px}
.brand h1{font-size:23px}
.mhead{display:flex;align-items:center;gap:6px}
.mhead .dot{margin:0}
.mhead button{width:42px;height:42px;border-radius:99px;font-size:20px;display:flex;align-items:center;justify-content:center}
.only-m{display:block}
.hide-m{display:none!important}
main{padding:16px 16px calc(90px + env(safe-area-inset-bottom));max-width:none}
#tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:35;background:var(--card);border-top:1px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
#tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;color:var(--muted);min-height:54px;position:relative}
#tabbar .ic{font-size:19px;line-height:1;height:24px;display:flex;align-items:center}
#tabbar button.on{color:var(--acc);font-weight:600}
#tabbar .tb-add .ic{background:var(--acc);color:#fff;border-radius:12px;width:44px;height:30px;justify-content:center;font-size:20px}
#tabbar .badge{position:absolute;top:4px;left:calc(50% + 6px);margin:0}
input[type=text],input[type=search],input[type=password],input[type=number],select,textarea{font-size:16px;padding:11px 12px}
.viewhead{margin-bottom:14px;align-items:center}
.viewhead h2{font-size:26px}
.vh-actions{display:flex;gap:8px;width:100%}
.vh-actions .btn{flex:1;justify-content:center}
.btn{min-height:44px}
.searchbar{flex-wrap:nowrap}
.searchbar input[type=text],.searchbar input[type=search]{min-width:0}
.searchbar .btn{flex:none;width:48px;justify-content:center;padding:0}
.chips{flex-wrap:nowrap;overflow-x:auto;margin:0 -16px 14px;padding:0 16px 2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{padding:8px 14px;font-size:13.5px;white-space:nowrap;flex:none}
.tiles{grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.tile{padding:12px 14px}
.tile b{font-size:22px}
.panel{padding:14px;border-radius:14px}
.grid{grid-template-columns:1fr;gap:10px}
.card{padding:12px 14px;display:grid;grid-template-columns:1fr auto;column-gap:10px}
.card .eyebrow,.card h4,.card .meta,.card .tagrow{grid-column:1}
.card .qbig{grid-column:2;grid-row:1/span 4;align-self:center;font-size:22px;color:var(--acc);font-family:"IBM Plex Mono",monospace}
.card .tag.q{display:none}
.card .meta{margin-bottom:8px}
.alert-item{padding:12px 2px}
form .row{grid-template-columns:1fr;gap:12px;margin-bottom:12px}
.formfoot .btn{flex:1;justify-content:center}
#drawer{top:auto;bottom:0;left:0;right:0;width:100%;height:auto;max-height:88vh;max-height:88dvh;border-left:none;border-top:1px solid var(--line);border-radius:20px 20px 0 0;transform:translateY(105%);transition:transform .28s;padding:10px 18px calc(24px + env(safe-area-inset-bottom))}
#drawer.open{transform:none}
.grab{display:block;position:absolute;left:50%;top:6px;transform:translateX(-50%);width:40px;height:5px;border-radius:99px;background:var(--line)}
.dhead{margin:-4px -8px 0}
.facts{gap:10px}
.chatbox .msg{max-width:92%}
.chatin .btn{flex:none}
#toast{bottom:auto;top:calc(66px + env(safe-area-inset-top))}
#drawer .formfoot{flex-wrap:wrap}
#d-out{flex-basis:100%}
#drawer .btn.danger{background:transparent;color:var(--red);border:1px solid var(--red)}
body.noscroll{overflow:hidden}
#drawer{bottom:var(--kb,0px);max-height:calc(88dvh - var(--kb,0px))}
html.kbopen #tabbar{display:none}
html.kbopen main{padding-bottom:24px}
html.standalone aside{padding-top:calc(12px + env(safe-area-inset-top))}
html.standalone .brand small{display:none}
}
@media(min-width:821px){ .card .qbig{display:none} }
</style>
</head>
<body>
<div id="app"><aside>
 <div class="brand"><h1>Cave</h1><small>Nicolas · v2.4.2</small></div>
 <div class="mhead"><span id="msync" class="dot off" title="Synchronisation"></span><button id="btn-voice" class="micbtn" aria-label="Parler à la cave">🎤</button><button id="btn-menu" aria-label="Réglages et occupation">⚙︎</button></div>
 <button class="btn hide-m" id="btn-voice-d">🎤 Parler à la cave</button>
 <nav class="nav" id="nav"></nav>
 <div class="gauges" id="gauges"></div>
 <div class="store" id="store">
  <div id="syncstatus"></div>
  <button class="linkbtn" id="btn-export">Exporter une copie (.json)</button>
  <button class="linkbtn" id="btn-import">Importer un fichier .json</button>
  <button class="btn sm" id="btn-settings-d" style="justify-content:center">⚙︎ Réglages (assistant IA, dictée)</button>
  <button class="linkbtn" id="btn-cfg">Réglages OneDrive…</button>
 </div>
</aside>
<main id="main"></main>
<nav id="tabbar"></nav>
<div id="voicebar" role="button" aria-label="Arrêter l’écoute"></div>
<div id="overlay"></div>
<div id="drawer"></div>
<div id="toast"></div>
<input type="file" id="fileinput" accept=".json,application/json" hidden></div>
<script>
var S = { refs: [], view: 'dash', search: '', filter: 'Tous', editId: null, chat: [], dict: '' };
var REGIONS = ['Bourgogne','Rhône','Loire','Beaujolais','Alsace','Bordeaux','Provence','Champagne','Languedoc','Sud-Ouest','Jura','Savoie','Autre'];
var COULEURS = ['Rouge','Blanc','Rosé','Effervescent'];

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function id(){ return 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function toast(m){ var t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(function(){ t.classList.remove('show'); },2800); }
function val(fid){ return document.getElementById(fid).value.trim(); }
function set$(fid,v){ var el=document.getElementById(fid); if(!el||v===null||v===undefined||v==='') return;
  if(el.tagName==='SELECT'){ for(var i=0;i<el.options.length;i++){ if(el.options[i].text.toLowerCase().indexOf(String(v).toLowerCase())>=0){ el.selectedIndex=i; break; } } }
  else el.value=v; }

function apYears(r){
  var m = /(\d{4})\s*(?:[–\-—]|a|à|jusqu|to)?\s*(\d{4})?/.exec(String(r.apogee||''));
  if(!m) return null;
  var d = parseInt(m[1],10), f = m[2] ? parseInt(m[2],10) : d;
  if(f < d) f = d; return { d:d, f:f };
}
function inWindow(r){ var a=apYears(r); if(!a) return false; var y=new Date().getFullYear(); return y>=a.d && y<=a.f; }
function soonWindow(r){ var a=apYears(r); if(!a) return false; var y=new Date().getFullYear(); return a.d>y && a.d-y<=2; }
function isLongGarde(r){ var a=apYears(r); if(!a) return false; var y=new Date().getFullYear(); return (a.f-a.d>8) || (a.f-y>5); }

function seuilBas(qi){ qi=qi||0; if(qi<=2) return 0; if(qi<=5) return 1; return 2; }
function alertsFor(r){
  var out=[];
  if(r.qte<=0) return out;
  if(inWindow(r)) out.push({sev:'ok',txt:'Apogée en cours ('+r.apogee+') — à boire'});
  else if(soonWindow(r)) out.push({sev:'warn',txt:'Apogée proche ('+r.apogee+')'});
  if(r.zone==='garage' && isLongGarde(r)) out.push({sev:'crit',txt:'Vin de garde stocké au garage'});
  if(r.qte<=seuilBas(r.qteInit)) out.push({sev:'warn',txt:'Stock bas ('+r.qte+' restante'+(r.qte>1?'s':'')+')'});
  return out;
}
function allAlerts(){ var out=[]; S.refs.forEach(function(r){ alertsFor(r).forEach(function(a){ if(a.sev!=='ok') out.push({ref:r,a:a}); }); }); return out; }
function alertCount(){ return allAlerts().length; }
function current(){ return S.refs.filter(function(r){ return r.qte>0; }); }
function qsum(l){ return l.reduce(function(a,r){ return a+Math.max(0,r.qte); },0); }

var LSKEY='cave-nicolas-v2';
function localSave(){ localStorage.setItem(LSKEY, JSON.stringify(S.refs)); }
function localLoad(){ try{ S.refs = JSON.parse(localStorage.getItem(LSKEY)||'[]'); }catch(e){ S.refs=[]; } }

function csvCell(v){ v=String(v==null?'':v); return /[";\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; }
function toCSV(){
  var head=['domaine','region','appellation','couleur','millesime','cepages','qte','qteInit','zone','etagere','apogee','prix','note','dateEntree','lots'];
  var lines=[head.join(';')];
  S.refs.forEach(function(r){
    var lots=(r.lots||[]).map(function(l){ return l.qte+'@'+l.date; }).join(',');
    lines.push([r.domaine,r.region,r.appellation,r.couleur,r.millesime,r.cepages,r.qte,r.qteInit,r.zone,r.etagere||'',r.apogee||'',r.prix||'',r.note||'',r.dateEntree||'',lots].map(csvCell).join(';'));
  });
  return lines.join('\n');
}
function parseCSV(text){
  var rows=[], row=[], cell='', q=false;
  for(var i=0;i<text.length;i++){ var c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){ cell+='"'; i++; } else q=false; } else cell+=c; }
    else if(c==='"') q=true;
    else if(c===';'){ row.push(cell); cell=''; }
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; row.push(cell); if(row.some(function(x){return x!=='';})) rows.push(row); row=[]; cell=''; }
    else cell+=c;
  }
  row.push(cell); if(row.some(function(x){return x!=='';})) rows.push(row);
  if(rows.length<2) return [];
  var head=rows[0].map(function(h){ return h.trim().toLowerCase(); });
  function get(rw,n){ var i2=head.indexOf(n); return i2>=0?(rw[i2]||'').trim():''; }
  var map={}, order=[];
  rows.slice(1).forEach(function(rw){
    var dom=get(rw,'domaine'); if(!dom) return;

    var o=map[key];
    if(!o){ o={ id:id(), domaine:dom, region:get(rw,'region')||'Autre', appellation:get(rw,'appellation'), couleur:get(rw,'couleur')||'Rouge', millesime:get(rw,'millesime'), cepages:get(rw,'cepages'), qte:parseInt(get(rw,'qte'),10)||0, qteInit:parseInt(get(rw,'qteInit'),10)||0, zone:(get(rw,'zone')==='garage'?'garage':'frigo'), etagere:get(rw,'etagere')?parseInt(get(rw,'etagere'),10):null, apogee:get(rw,'apogee'), prix:get(rw,'prix')?(parseFloat(get(rw,'prix').replace(',','.'))||null):null, note:get(rw,'note'), dateEntree:get(rw,'dateEntree'), lots:lots }; map[key]=o; order.push(key); }
    else { o.qte+=parseInt(get(rw,'qte'),10)||0; o.qteInit+=parseInt(get(rw,'qteInit'),10)||0; if(lots.length) o.lots=o.lots.concat(lots); }
  });
  return order.map(function(k){ return map[k]; });

var OD = { token: sessionStorage.getItem('od_token')||'', lastSnap: localStorage.getItem('od_snap')||'', clientId: localStorage.getItem('od_client')||'', tenant: localStorage.getItem('od_tenant')||'organizations' };
var FILE_PATH='/Cave/cave-data.csv';
var GRAPH='https://graph.microsoft.com/v1.0';
var TENANT=OD.tenant||'organizations';
function graphRaw(method,path,body,mime){
  return fetch(GRAPH+path,{ method:method, headers:Object.assign({'Authorization':'Bearer '+OD.token}, body?{'Content-Type':(mime||'text/plain')}:{}), body:body||undefined });
}
// Jeton expiré (appli restée ouverte plus d'une heure) → renouvellement silencieux puis nouvel essai
function graph(method,path,body,mime){
  return graphRaw(method,path,body,mime).then(function(r){
    if(r.status!==401) return r;
    return odRefresh().then(function(ok){ return ok? graphRaw(method,path,body,mime) : r; });
  });
}
function odRefresh(){
  var rt=localStorage.getItem('od_refresh');
  if(!rt || !OD.clientId) return Promise.resolve(false);
  return odToken('client_id='+encodeURIComponent(OD.clientId)+'&grant_type=refresh_token&refresh_token='+encodeURIComponent(rt)+'&scope='+encodeURIComponent('Files.ReadWrite User.Read offline_access'))
    .then(function(t){ if(t.access_token){ OD.token=t.access_token; sessionStorage.setItem('od_token',OD.token); if(t.refresh_token) localStorage.setItem('od_refresh',t.refresh_token); return true; } return false; })
    .catch(function(){ return false; });
}

function odEnsureFolder(){ return graph('POST','/me/drive/root/children', JSON.stringify({name:'Cave',folder:{}}), 'application/json').then(function(){},function(){}); }
function odPull(){

  .catch(function(){ odStatus('err','Échec de mise à jour OneDrive'); });

function b64url(a){ return btoa(String.fromCharCode.apply(null,a)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function odConnect(){
  if(!OD.clientId){ toast('Renseignez votre Client ID (Réglages OneDrive)'); openCfg(); return; }
  localStorage.setItem('od_client',OD.clientId); localStorage.setItem('od_tenant',TENANT);
  var v=b64url(crypto.getRandomValues(new Uint8Array(32)));
  sessionStorage.setItem('pkce',v); localStorage.setItem('od_pkce',v);
  // Appli écran d'accueil : la connexion se fait dans une fenêtre ouverte par l'appli, pour que le jeton revienne bien dans l'appli (et pas dans Safari)
  var pop=null;
  if(isStandalone()){ try{ pop=window.open('about:blank','odlogin'); }catch(e){ pop=null; } }
  crypto.subtle.digest('SHA-256', new TextEncoder().encode(v)).then(function(h){
    var ch=b64url(new Uint8Array(h));
    var redir=location.origin+location.pathname;
    var url='https://login.microsoftonline.com/'+TENANT+'/oauth2/v2.0/authorize?response_type=code&client_id='+encodeURIComponent(OD.clientId)+'&redirect_uri='+encodeURIComponent(redir)+'&scope='+encodeURIComponent('Files.ReadWrite User.Read offline_access')+'&code_challenge='+ch+'&code_challenge_method=S256&state='+(pop?'popup':'page');
    if(pop){ pop.location.href=url; toast('Connectez-vous dans la fenêtre Microsoft, elle se fermera ensuite'); }
    else location.href=url;
  });
}
function odToken(body){
  return fetch('https://login.microsoftonline.com/'+TENANT+'/oauth2/v2.0/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:body})
    .then(function(r){ return r.json(); });
}
function odHandleCode(){
  var p=new URLSearchParams(location.search);
  var code=p.get('code'); if(!code) return false;
  var v=sessionStorage.getItem('pkce')||localStorage.getItem('od_pkce'); var st=p.get('state');
  history.replaceState(null,'',location.pathname);
  var redir=location.origin+location.pathname;
  odToken('client_id='+encodeURIComponent(OD.clientId)+'&grant_type=authorization_code&code='+encodeURIComponent(code)+'&redirect_uri='+encodeURIComponent(redir)+'&code_verifier='+encodeURIComponent(v))
  .then(function(t){
    localStorage.removeItem('od_pkce');
    if(t.access_token){
      OD.token=t.access_token; sessionStorage.setItem('od_token',OD.token); if(t.refresh_token) localStorage.setItem('od_refresh',t.refresh_token);
      if(st==='popup' && window.opener){ try{ window.opener.postMessage({cave:'od-ok'}, location.origin); }catch(e){} setTimeout(function(){ window.close(); },300); }
      odPull().then(render);
    }
    else toast('Connexion OneDrive refusée — vérifiez le Client ID et le type de compte');
  });
  return true;
}
function odRestore(force){
  if(OD.token && !force) return;
  odRefresh().then(function(ok){ if(ok) odPull().then(render); });
}
// Retour de la fenêtre de connexion (appli écran d'accueil)
window.addEventListener('message',function(e){ if(e.origin===location.origin && e.data && e.data.cave==='od-ok'){ OD.clientId=localStorage.getItem('od_client')||OD.clientId; odRestore(true); toast('OneDrive connecté'); closeDrawer(); } });
window.addEventListener('storage',function(e){ if(e.key==='od_refresh' && e.newValue && !OD.token) odRestore(true); });
// Quand on revient dans l'appli (téléphone déverrouillé, retour depuis une autre appli), on relit OneDrive

document.addEventListener('visibilitychange',function(){

// Recherche tolérante : chaque mot significatif doit apparaître (sans accents, ordre libre) ; « domaine », « de », « la »… sont ignorés
var QSTOP=['domaine','le','la','les','de','du','des','d','l','et','un','une','vin','vins','bouteille','bouteilles','millesime','appellation'];
function matchQ(q,fields){
  var hay=noAcc(fields.join(' '));
  var words=noAcc(q).replace(/[’',;.!?]/g,' ').split(/\s+/).filter(function(w){ return w && QSTOP.indexOf(w)<0; });
  return words.every(function(w){ return hay.indexOf(w)>=0; });
}

    if(S.filter==='Garage') return r.qte>0&&r.zone==='garage';
    return r.qte>0&&r.couleur===S.filter;
  });
  if(S.search){ list=list.filter(function(r){ return matchQ(S.search,[r.domaine,r.region,r.appellation,r.millesime,r.cepages,r.couleur]); }); }
  list.sort(function(a,b){ return (a.domaine||'').localeCompare(b.domaine||''); });
  document.getElementById('c-count').textContent=list.length+' référence'+(list.length>1?'s':'')+' · '+qsum(list)+' bouteille'+(qsum(list)>1?'s':'');

function recoSoir(t){
  var pool=current(); if(!pool.length) return 'Votre cave est vide — commencez par ajouter quelques bouteilles !';
  var s=t.toLowerCase(); var wanted=[], notes=[];
  if(/apéro|apero|léger|leger|rafraîch|rafrw+ch|frais/.test(s)) wanted=wanted.concat(['Blanc','Rosé','Effervescent']);
  if(/rouge/.test(s)) wanted.push('Rouge');
  if(/blanc/.test(s)) wanted.push('Blanc');
  if(/rosé|rose/.test(s)) wanted.push('Rosé');
  if(/champagne|bulles|effervescent|mousseux|crémant|cremant|fête|fete/.test(s)) wanted.push('Effervescent');
  if(/viande|boeuf|bœuf|agneau|gibier|rôti|roti|veau|civet|sauce/.test(s)){ wanted.push('Rouge'); notes.push('un rouge structuré tannique accompagnera bien'); }
  if(/poisson|fruits de mer|fruit de mer|huître|huitre|sushi|crustacé|crustace/.test(s)) wanted.push('Blanc');
  if(/fromage/.test(s)) notes.push('avec du fromage, privilégiez un rouge souple ou un blanc évolué');
  if(/dessert|sucré|sucre|chocolat/.test(s)) wanted.push('Effervescent');
  REGIONS.forEach(function(rg){ var rl=rg.toLowerCase(); if(s.indexOf(rl)>=0||s.indexOf(rl.replace('ô','o'))>=0) notes.push('côté '+rg); });
  var picks=pool;
  if(wanted.length) picks=picks.filter(function(r){ return wanted.indexOf(r.couleur)>=0; });
  if(/maintenant|ce soir|prêt|pret|apogée|apogee/.test(s)) picks=picks.filter(function(r){ return inWindow(r)||!apYears(r); });
  var ready=picks.filter(inWindow);
  picks=ready.concat(picks.filter(function(r){ return !inWindow(r); })).slice(0,3);
  if(!picks.length) return 'Je n’ai rien trouvé de tel en stock. Essayez autre chose — ou consultez l’écran Ma cave !';
  var intro=notes.length? 'Très bien. Pour cette occasion, '+notes.join(', ')+' — voici mes suggestions :' : 'Voici ce que je vous propose ce soir :';
  var out=intro+'\n\n';
  picks.forEach(function(r,i){
    out+='<b>'+(i+1)+'. '+esc(r.domaine)+' '+esc(r.millesime)+'</b> — '+esc(r.appellation)+' ('+esc(r.region)+', '+esc(r.couleur)+')\n';
    out+=(inWindow(r)? '✔ À son apogée ('+esc(r.apogee)+')' : 'Apogée : '+esc(r.apogee||'n.c.'))+' · ×'+r.qte+' en stock · '+(r.zone==='garage'?'Garage':'Frigo, étagère '+r.etagere)+'\n\n';
  });
  return out+'Bonne dégustation ! 🥂';
}

/* ===== Voix (v2.2) : session qui cumule le texte, arrêt sur silence ou au toucher ===== */
var VOICE=null;
function voiceBar(on,txt){
  var vb=document.getElementById('voicebar');
  if(!on){ vb.classList.remove('show'); return; }
  vb.innerHTML='<span class="vdot"></span><span class="vtxt">'+(txt? '« '+esc(txt)+' »' : 'J’écoute…')+'</span><span class="vstop">Terminer</span>';
  vb.classList.add('show');
}
function joinResults(results){
  // Assemble les segments ; si un segment reprend le précédent (doublon fréquent sur mobile), on garde le plus long
  var parts=[];
  for(var i=0;i<results.length;i++){
    var t=String(results[i][0].transcript||'').trim(); if(!t) continue;
    var last=parts[parts.length-1];
    if(last && t.toLowerCase().indexOf(last.toLowerCase())===0) parts[parts.length-1]=t;
    else if(last && last.toLowerCase().indexOf(t.toLowerCase())===0) continue;
    else parts.push(t);
  }
  return parts.join(' ');
}
function voiceSession(opts){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ opts.onFail && opts.onFail('absent'); return null; }
  var ss={ committed:opts.prefix||'', current:'', active:true, done:false, rec:null, timer:null, restarts:0, heard:false };
  function full(){ return (ss.committed+' '+ss.current).replace(/\s+/g,' ').trim(); }
  function finish(){
    if(ss.done) return; ss.done=true; ss.active=false; clearTimeout(ss.timer);
    VOICE=null; voiceBar(false);
    // Micro de l'appli indisponible (refusé, non pris en charge…) et rien entendu → dictée par le clavier
    if(ss.failed && !ss.heard && opts.onFail){ opts.onFail(ss.failed); return; }
    opts.onDone && opts.onDone(full(), ss.heard);
  }
  function arm(ms){ clearTimeout(ss.timer); if(ms) ss.timer=setTimeout(function(){ ss.stop(); }, ms); }
  function startRec(){
    var rec=new SR(); rec.lang='fr-FR'; rec.continuous=true; rec.interimResults=true; rec.maxAlternatives=1;
    rec.onresult=function(e){
      ss.current=joinResults(e.results); ss.heard=true;
      var f=full(); voiceBar(true,f); opts.onText && opts.onText(f);
      arm(opts.silenceMs);
    };
    rec.onerror=function(e){
      if(e.error==='no-speech' || e.error==='aborted') return;
      ss.active=false; ss.failed=e.error;
    };
    rec.onend=function(){
      ss.committed=full(); ss.current='';
      if(ss.active && ss.restarts<30){ ss.restarts++; try{ startRec(); }catch(err){ finish(); } }
      else finish();
    };
    ss.rec=rec; rec.start();
  }
  ss.stop=function(){
    if(ss.done) return; ss.active=false; clearTimeout(ss.timer);
    try{ ss.rec.stop(); }catch(e){ finish(); return; }
    setTimeout(finish,1500); // filet de sécurité si le navigateur ne renvoie pas « onend »
  };
  try{ startRec(); }catch(err){ opts.onFail && opts.onFail('start'); return null; }
  voiceBar(true,opts.prefix||'');
  arm(opts.firstMs||8000); // rien entendu au bout de 8 s → arrêt
  return ss;
}
/* Mode de dictée : « auto » = micro de l'appli si le navigateur le permet, sinon clavier ; « clavier » = toujours le micro du clavier iPhone */
function voiceMode(){ try{ return localStorage.getItem('cave-voice')||'auto'; }catch(e){ return 'auto'; } }
function hasSR(){ return !!(window.SpeechRecognition||window.webkitSpeechRecognition); }
function useKeyboard(){ return voiceMode()==='clavier' || !hasSR(); }
function keyDictate(opts){
  var h='<span class="eyebrow">Dictée</span><h3 style="margin:4px 0 6px">'+esc(opts.title)+'</h3>';
  h+='<p class="hint" style="margin-bottom:10px">Touchez le <b>micro 🎙 du clavier</b> de l’iPhone (en bas à droite) et parlez.'+(opts.help? ' '+opts.help : '')+'</p>';
  h+='<textarea id="kd-text" rows="'+(opts.rows||3)+'" autocapitalize="sentences" autocorrect="off" spellcheck="false">'+esc(opts.prefix||'')+'</textarea>';
  if(opts.reason) h+='<p class="hint" style="margin-top:8px">'+esc(opts.reason)+'</p>';
  h+='<div class="formfoot"><button class="btn" id="kd-ok">'+esc(opts.ok||'Valider')+'</button><button class="btn sec" id="kd-cancel">Annuler</button></div>';
  drawerOpen(h);
  var ta=document.getElementById('kd-text');
  try{ ta.focus(); var n=ta.value.length; ta.setSelectionRange(n,n); }catch(e){}
  if(opts.live) ta.addEventListener('input',function(){ opts.live(ta.value); });
  document.getElementById('kd-cancel').onclick=closeDrawer;
  document.getElementById('kd-ok').onclick=function(){ var t=ta.value.replace(/\s+/g,' ').trim(); closeDrawer(); opts.onDone(t); };
}
function failMsg(r){
  return r==='absent'? 'Ce navigateur ne propose pas la reconnaissance vocale intégrée : on passe par la dictée du clavier.'
       : (r==='not-allowed'||r==='service-not-allowed')? 'Le micro de l’appli est refusé ou indisponible ici : on passe par la dictée du clavier.'
       : 'Le micro de l’appli n’a pas fonctionné ('+r+') : on passe par la dictée du clavier.';
}
function voiceQuery(cb){
  if(VOICE){ VOICE.stop(); return; }
  function kb(reason){ keyDictate({ title:'Rechercher', ok:'Rechercher', reason:reason, onDone:function(t){ if(t) cb(t); } }); }
  if(useKeyboard()){ kb(voiceMode()==='clavier'? '' : failMsg('absent')); return; }
  VOICE=voiceSession({ silenceMs:2200, onFail:function(r){ kb(failMsg(r)); }, onDone:function(t,heard){
    if(t){ cb(t); toast('Reçu : « '+t+' »'); } else if(!heard) toast('Rien entendu');
  }});
}
function voiceAdd(){
  if(VOICE){ VOICE.stop(); return; }
  var tr=document.getElementById('a-transcript'); tr.style.display='block';
  var prev=S.dict||'';
  if(!prev) tr.innerHTML= aiOn()
    ? '🎤 Parlez librement, dans l’ordre que vous voulez : domaine, appellation, millésime, nombre de bouteilles, où vous les rangez, prix, apogée, une remarque… L’assistant IA remplit la fiche.'
    : '🎤 Annoncez chaque champ par son nom : <b>domaine</b> …, <b>appellation</b> …, <b>millésime</b> …, <b>quantité</b> …, <b>étagère</b> … ou <b>garage</b>, <b>fenêtre d’apogée</b> … à …, <b>date d’entrée</b> …, <b>prix d’achat</b> …, et la <b>note personnelle</b> en dernier.';
  function rules(t){ S.dict=t; showDict(); extractVoice(t); toast('Champs remplis — vérifiez puis enregistrez'); }
  listen({ title:'Dicter la fiche', ok:'Remplir la fiche', rows:6, prefix:prev, silence:aiOn()?3500:5000,
    help: aiOn()? 'Parlez librement : l’assistant IA remettra chaque information à sa place.' : 'Annoncez chaque champ par son nom et la note en dernier.',
    live:function(t){ S.dict=t; showDict(); if(!aiOn()) extractVoice(t); },
    done:function(t){ S.dict=t; showDict(); if(aiOn()) aiHandle(t,'ajout',rules); else rules(t); } });
}
function showDict(){
  var tr=document.getElementById('a-transcript'); if(!tr) return;
  tr.style.display='block';
  tr.innerHTML='Transcription : « '+esc(S.dict)+' »<br><span class="hint">Vérifiez avant d’enregistrer. Retouchez 🎤 pour compléter la dictée.</span> <button type="button" class="linkbtn" id="a-dclear">Effacer la dictée</button>';
  document.getElementById('a-dclear').onclick=function(){ S.dict=''; tr.style.display='none'; };
}

/* --- Nombres dits en lettres (utilisés seulement dans les champs chiffrés) --- */
var NUMW={'zéro':0,'zero':0,'un':1,'une':1,'deux':2,'trois':3,'quatre':4,'cinq':5,'six':6,'sept':7,'huit':8,'neuf':9,'dix':10,'onze':11,'douze':12,'treize':13,'quatorze':14,'quinze':15,'seize':16,'vingt':20,'vingts':20,'trente':30,'quarante':40,'cinquante':50,'soixante':60,'cent':100,'cents':100,'mille':1000};
function frWordsToDigits(s){
  var toks=String(s||'').split(/([\s-]+)/), out=[], run=[], runRaw=[];
  function flush(){
    if(!run.length) return;
    while(run.length && run[run.length-1]==='et'){ run.pop(); }
    var total=0, cur=0, prev=null;
    run.forEach(function(w){ if(w==='et') return; var v=NUMW[w];
      if(v===1000){ total+=(cur||1)*1000; cur=0; }
      else if(v===100){ cur=(cur||1)*100; }
      else if(v===20 && prev==='quatre'){ cur=cur-4+80; }
      else cur+=v;
      prev=w; });
    var tail=[]; while(runRaw.length && /^(et|[\s-]+)$/i.test(runRaw[runRaw.length-1])){ tail.unshift(runRaw.pop()); }
    out.push(String(total+cur)); out=out.concat(tail); run=[]; runRaw=[];
  }
  toks.forEach(function(tk){
    var w=tk.toLowerCase();
    if(NUMW.hasOwnProperty(w)){ run.push(w); runRaw.push(tk); }
    else if(run.length && (/^[\s-]+$/.test(tk) || w==='et')){ if(w==='et') run.push('et'); runRaw.push(tk); }
    else { flush(); out.push(tk); }
  });
  flush();
  return out.join('');
}
function firstNum(s){ if(!s) return null; var m=/(\d+)/.exec(frWordsToDigits(s)); return m? parseInt(m[1],10) : null; }
function years(s){ if(!s) return []; var out=[], re=/(19\d{2}|20\d{2})/g, m, x=frWordsToDigits(s); while((m=re.exec(x))) out.push(m[1]); return out; }
function capFr(x){
  if(!x) return x;
  var small=['de','du','des','la','le','les','et','sur','en','au','aux','sous'];
  return x.split(/(\s+|-)/).map(function(w,i){
    if(!w || /^(\s+|-)$/.test(w)) return w;
    var lw=w.toLowerCase();
    if(i>0 && small.indexOf(lw)>=0) return lw;
    var ap=/^([dl])[’'](.+)$/i.exec(w);
    if(ap) return (i>0? ap[1].toLowerCase() : ap[1].toUpperCase())+'’'+ap[2].charAt(0).toUpperCase()+ap[2].slice(1);
    return w.charAt(0).toUpperCase()+w.slice(1);
  }).join('');
}
function noAcc(x){ return String(x||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase(); }

/* --- Découpage de la dictée par mots-clés : chaque valeur s'arrête au mot-clé suivant --- */
var VKEYS=[
  ['domaine','domaine|producteur'],
  ['appellation','appellation'],
  ['region','région|region'],
  ['couleur','couleur'],
  ['millesime','millésime|millesime'],
  ['cepages','cépages?|cepages?'],
  ['qte','nombre de bouteilles|quantité|quantite|nombre'],
  ['emplacement','emplacement'],
  ['etagere','étagère|etagere'],
  ['apogee','fenêtre d[’\']apogée|fenetre d[’\']apogee|fenêtre de garde|apogée|apogee|apogé|à boire entre|a boire entre|à boire à partir de'],
  ['date','date d[’\']entrée|date d[’\']entree|date d[’\']achat|date|entrée en cave|entré en cave|acheté en|achetée en|achetées en|achetés en'],
  ['prix','prix d[’\']achat|prix|payé|payée'],
  ['note','note personnelle|note perso|note|commentaire|remarque']
];
function segmentVoice(t){
  var low=t.toLowerCase(), hits=[];
  VKEYS.forEach(function(k){
    var re=new RegExp('(^|[\\s,;.:!?’\'])('+k[1]+')(?=$|[\\s,;.:!?])','g'), m;
    while((m=re.exec(low))){ hits.push({key:k[0], start:m.index+m[1].length, end:m.index+m[0].length}); }
  });
  // tri, puis on écarte les mots-clés inclus dans un mot-clé plus long (« apogée » dans « fenêtre d'apogée »)
  hits.sort(function(a,b){ return a.start-b.start || (b.end-b.start)-(a.end-a.start); });
  hits=hits.filter(function(h,i){ for(var j=0;j<i;j++){ if(h.start<hits[j].end && h.start>=hits[j].start) return false; } return true; });
  var seg={};
  var noteAt=-1;
  hits.forEach(function(h,i){
    if(noteAt>=0) return;                               // tout ce qui suit « note » appartient à la note
    if(seg.hasOwnProperty(h.key)) return;              // 1re occurrence retenue
    var next=hits[i+1]? hits[i+1].start : t.length;
    seg[h.key]={ val:t.slice(h.end,next).replace(/^[\s,;.:!?]+|[\s,;.:!?]+$/g,''), start:h.start, end:next };
    if(h.key==='note') noteAt=h.start;
  });
  if(seg.note){ seg.note.val=t.slice(seg.note.start).replace(/^(note personnelle|note perso|note|commentaire|remarque)[\s,;.:!?]*/i,'').replace(/[\s,;.!?]+$/,''); }
  return seg;
}
var MOIS={'janvier':1,'janv':1,'fevrier':2,'fevr':2,'fev':2,'mars':3,'avril':4,'avr':4,'mai':5,'juin':6,'juillet':7,'juil':7,'aout':8,'septembre':9,'sept':9,'octobre':10,'oct':10,'novembre':11,'nov':11,'decembre':12,'dec':12};
function parseMonthYear(s){
  if(!s) return null; var x=noAcc(frWordsToDigits(s));
  var now=new Date();
  if(/aujourd|ce mois|maintenant/.test(x)) return (now.getMonth()+1)+'/'+now.getFullYear();
  var m=/(\d{1,2})\s*[\/.-]\s*(\d{4})/.exec(x); if(m) return parseInt(m[1],10)+'/'+m[2];
  var y=/(19\d{2}|20\d{2})/.exec(x);
  var mo=null; Object.keys(MOIS).forEach(function(k){ if(mo===null && new RegExp('\\b'+k+'\\b').test(x)) mo=MOIS[k]; });
  if(mo && y) return mo+'/'+y[1];
  if(mo) return mo+'/'+now.getFullYear();
  if(y) return null;
  return null;
}
function extractVoice(t){
  var seg=segmentVoice(t), low=t.toLowerCase();
  function sv(k){ return seg[k]? seg[k].val : ''; }
  // Domaine (+ « Château … » / « Clos … » si le mot domaine n'est pas prononcé)
  var dom=sv('domaine').replace(/^(de|du|des)\s+|^d[’']\s*/i,''), domFb=null;
  if(!dom){ var cm=/(?:^|\s)((?:ch[aâ]teau|clos)\s+[^,;.]+)/i.exec(t);
    if(cm){ dom=cm[1]; var cut=segmentVoice(dom); var fk=Object.keys(cut).map(function(k){return cut[k].start;}).sort(function(a,b){return a-b;})[0];
      if(fk!=null) dom=dom.slice(0,fk);
      var ym=/\s(19\d{2}|20\d{2})\b/.exec(dom); if(ym) dom=dom.slice(0,ym.index);
      dom=dom.trim(); var st=cm.index+cm[0].indexOf(cm[1]); domFb={start:st, end:st+dom.length}; } }
  // Texte « neutre » pour les détections globales : on retire domaine et note (évite « Clos Rougeard » → Rouge)
  var neutral=low;
  function blank(a,b){ neutral=neutral.slice(0,a)+' '.repeat(b-a)+neutral.slice(b); }
  if(seg.domaine) blank(seg.domaine.start,seg.domaine.end);
  if(domFb) blank(domFb.start,domFb.end);
  if(seg.note) neutral=neutral.slice(0,seg.note.start);
  // Une couleur dite juste après l'appellation (« … villages rouge ») va dans Couleur, pas dans l'appellation
  // Domaine et appellation s'arrêtent aussi au premier élément reconnaissable non annoncé (année, couleur, « 6 bouteilles », garage…)
  function cutTail(v){ var m=/\s(?:19\d{2}|20\d{2}|\d+\s+bouteilles?|rouges?|blancs?|ros[ée]s?|effervescent|garage|frigo|en cave)\b/i.exec(' '+v); return (m? (' '+v).slice(0,m.index) : ' '+v).trim(); }
  if(dom) dom=cutTail(dom);
  var app=cutTail(sv('appellation'));
  // Région
  var reg=null, rsrc=noAcc(sv('region')||neutral);
  REGIONS.forEach(function(rg){ if(!reg && rsrc.indexOf(noAcc(rg))>=0) reg=rg; });
  // Couleur
  var csrc=noAcc(sv('couleur')||neutral), col=null;
  if(/\brouges?\b/.test(csrc)) col='Rouge'; else if(/\bblancs?\b/.test(csrc)) col='Blanc'; else if(/\brose\b/.test(csrc)) col='Rosé'; else if(/effervescent|champagne|mousseux|cremant|bulles/.test(csrc)) col='Effervescent';
  // Millésime : champ dédié, sinon première année hors apogée/prix/note
  var mil=years(sv('millesime'))[0]||null;
  if(!mil){ var tmp=low; ['apogee','prix','note','date'].forEach(function(k){ if(seg[k]) tmp=tmp.slice(0,seg[k].start)+' '.repeat(seg[k].end-seg[k].start)+tmp.slice(seg[k].end); }); if(seg.note) tmp=tmp.slice(0,seg.note.start); mil=years(tmp)[0]||null; }
  // Cépages (correction des noms connus)
  var cep=sv('cepages');
  if(cep){ var corr={ 'pinot noir':'Pinot noir','chardonnay':'Chardonnay','gamay':'Gamay','syrah':'Syrah','grenache':'Grenache','merlot':'Merlot','cabernet sauvignon':'Cabernet sauvignon','cabernet franc':'Cabernet franc','sauvignon':'Sauvignon','chenin':'Chenin','riesling':'Riesling','gewurztraminer':'Gewurztraminer','muscat':'Muscat','viognier':'Viognier','mourvèdre':'Mourvèdre','cinsault':'Cinsault','malbec':'Malbec','grolleau':'Grolleau','melon':'Melon','aligoté':'Aligoté','carignan':'Carignan','petit verdot':'Petit verdot','vermentino':'Vermentino','marsanne':'Marsanne','roussanne':'Roussanne','ugni blanc':'Ugni blanc','savagnin':'Savagnin','poulsard':'Poulsard','trousseau':'Trousseau','pineau':'Pineau d’Aunis' };
    var lc=cep.toLowerCase(), found=[];
    Object.keys(corr).sort(function(a,b){ return b.length-a.length; }).forEach(function(c){ if(lc.indexOf(c)>=0){ found.push(corr[c]); lc=lc.split(c).join(' '); } });
    cep=found.length? found.join(', ') : capFr(cep);
  }
  // Quantité : champ dédié, sinon « N bouteilles »
  var qte=firstNum(sv('qte'));
  if(qte==null){ var qm=/(\d+)\s+bouteilles?/.exec(frWordsToDigits(neutral)); if(qm) qte=parseInt(qm[1],10); }
  // Emplacement
  var zone=null, et=null;
  var esrc=noAcc(sv('emplacement')+' '+sv('etagere'));
  if(/garage/.test(esrc)||(!seg.emplacement&&!seg.etagere&&/\bgarage\b/.test(noAcc(neutral)))) zone='garage';
  var en=firstNum(sv('etagere'))||(/etagere\s*(\d)/.exec(frWordsToDigits(esrc))||[])[1];
  if(en){ en=parseInt(en,10); if(en>=1&&en<=5){ et=en; zone='frigo'; } }
  if(!zone && /frigo|cave/.test(esrc)) zone='frigo';
  // Apogée « 2026 à 2032 »
  var ay=years(sv('apogee')), ap=ay.length>1? ay[0]+' – '+ay[1] : (ay[0]||null);
  // Prix « 25 », « 25,50 », « 25 euros 50 »
  var prix=null, ps=frWordsToDigits(sv('prix'));
  var pm=/(\d+)(?:\s*(?:[,.]|euros?|€)\s*(\d{1,2}))?/.exec(ps); if(pm) prix=pm[1]+(pm[2]? ','+pm[2] : '');
  var note=sv('note');
  var dEnt=parseMonthYear(sv('date'));

  set$('f-domaine',dom?capFr(dom):null);
  set$('f-appellation',app?capFr(app):null);
  set$('f-region',reg);
  set$('f-couleur',col);
  set$('f-millesime',mil);
  set$('f-cepages',cep||null);
  set$('f-qte',qte);
  set$('f-apogee',ap);
  set$('f-prix',prix);
  set$('f-note',note? note.charAt(0).toUpperCase()+note.slice(1) : null);
  set$('f-date',dEnt);
  if(zone==='garage'){ document.getElementById('f-zone').value='garage'; document.getElementById('f-etagere').value=''; }
  else if(zone==='frigo'){ document.getElementById('f-zone').value='frigo'; if(et) document.getElementById('f-etagere').value=String(et); }
}

/* ===== Assistant IA (v2.4) : la dictée est interprétée par un modèle gratuit (Google Gemini ou Mistral) ===== */
function lsGet(k,d){ try{ var v=localStorage.getItem(k); return v==null? d : v; }catch(e){ return d; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function aiProvider(){ return lsGet('ai_provider','none'); }
function aiKey(p){ return lsGet('ai_key_'+(p||aiProvider()),''); }
function aiOn(){ var p=aiProvider(); return p!=='none' && !!aiKey(p); }

function aiSystem(){
  return [
  'Tu es l’assistant de la cave à vin de Nicolas. Tu reçois une phrase dictée (transcription automatique : fautes possibles, ponctuation absente, ordre libre) et l’inventaire actuel.',
  'Tu réponds UNIQUEMENT par un objet JSON, sans texte autour, au format :',
  '{"intention":"ajout|reassort|sortie|recherche|inconnu","fiche":{"domaine":null,"appellation":null,"region":null,"couleur":null,"millesime":null,"cepages":null,"qte":null,"zone":null,"etagere":null,"apogee":null,"prix":null,"dateEntree":null,"note":null},"deduits":[],"refId":null,"candidats":[],"qte":null,"resultats":[],"message":""}',
  'Intentions :',
  '- ajout : une nouvelle référence entre en cave (achat, cadeau reçu…).',
  '- reassort : on ajoute des bouteilles à une référence DÉJÀ dans l’inventaire (même domaine, appellation et millésime, y compris épuisée q=0). Mets son id dans refId et le nombre dans qte.',
  '- sortie : bouteille(s) bue(s), ouverte(s), offerte(s), sortie(s). refId = la référence de l’inventaire la plus probable, qte = nombre (1 par défaut). Si plusieurs références sont également possibles : refId null, leurs ids dans candidats, et une question courte dans message.',
  '- recherche : une question ou une recherche sur la cave. resultats = ids des références qui répondent (q>0 sauf si les épuisées sont demandées), les plus pertinentes d’abord ; message = réponse courte en français.',
  '- inconnu : rien de tout ça ; message = ce que tu n’as pas compris.',
  'Règles pour la fiche :',
  '- N’invente JAMAIS domaine, appellation, millésime, cépages, quantité, prix, emplacement ou note : remplis-les seulement s’ils sont dits, sinon null.',
  '- Corrige l’orthographe des noms de domaines, appellations et cépages mal transcrits (ex. « pull ligny montrachet » → « Puligny-Montrachet », « chat nœuf du pape » → « Châteauneuf-du-Pape »). Le domaine s’écrit sans le mot « Domaine » ; garde « Château » ou « Clos » s’ils font partie du nom.',
  '- Déductions autorisées quand l’information n’est pas dite, à lister dans deduits : "region" (d’après l’appellation), "couleur" (d’après l’appellation si elle est sans ambiguïté), "dateEntree" (mois courant pour un ajout), "apogee" (estimation raisonnable selon appellation, couleur et millésime). Aucune autre déduction.',
  '- region ∈ '+JSON.stringify(REGIONS)+' ; couleur ∈ '+JSON.stringify(COULEURS)+' ; zone ∈ ["frigo","garage"] (« cave », « frigo », « cave frigo » → frigo) ; etagere = entier 1 à 5 ou null (frigo seulement) ; apogee = "AAAA – AAAA" ; dateEntree = "M/AAAA" ; prix = nombre en euros ; qte et millesime en chiffres ; note = remarque personnelle dite, telle quelle.',
  '- Les nombres peuvent être dits en lettres (« six bouteilles », « deux mille dix-neuf », « vingt-cinq euros »).',
  'L’écran actuel est indiqué : sur « ajout », privilégie ajout ou reassort ; sur « cave », privilégie recherche ; sinon déduis l’intention de la phrase.'
  ].join('\n');
}
function aiUser(text,screen){
  var inv=S.refs.map(function(r){ return { id:r.id, d:r.domaine, a:r.appellation, m:r.millesime, c:r.couleur, r:r.region, q:r.qte, z:(r.zone==='garage'?'garage':'frigo'+(r.etagere?' ét.'+r.etagere:'')), ap:r.apogee||'' }; });
  var now=new Date();
  return 'Date du jour : '+(now.getMonth()+1)+'/'+now.getFullYear()+'\nÉcran : '+screen+'\nInventaire : '+JSON.stringify(inv)+'\nDictée : « '+text+' »';
}
function aiParse(txt){
  var t=String(txt||'').trim().replace(/^```(?:json)?/i,'').replace(/```$/,'').trim();
  var a=t.indexOf('{'), b=t.lastIndexOf('}'); if(a>=0&&b>a) t=t.slice(a,b+1);
  return JSON.parse(t);
}
function aiError(p,status,body){
  if(status===400 && /API key|API_KEY/i.test(body)) return 'Clé API refusée — vérifiez-la dans ⚙︎';
  if(status===401||status===403) return 'Clé API refusée ou non autorisée — vérifiez-la dans ⚙︎';
  if(status===429) return 'Quota gratuit atteint pour le moment — réessayez dans une minute';
  if(status===404) return 'Modèle introuvable — utilisez « Tester » dans ⚙︎ pour en choisir un';
  if(status===503||status===500) return 'Service '+(p==='gemini'?'Gemini':'Mistral')+' saturé pour le moment (erreur '+status+', côté serveur) — réessayez dans quelques minutes';
  return 'Erreur '+(p==='gemini'?'Gemini':'Mistral')+' ('+status+')';
}
// Liste des modèles Gemini Flash utilisables avec la clé, du plus adapté au moins adapté (stables d'abord)
function geminiModels(key){
  var cached=lsGet('ai_models_gemini',''); if(cached){ try{ var l=JSON.parse(cached); if(l.length) return Promise.resolve(l); }catch(e){} }
  return fetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=200',{ headers:{'x-goog-api-key':key} })
  .then(function(r){ if(!r.ok) return r.text().then(function(b){ throw new Error(aiError('gemini',r.status,b)); }); return r.json(); })
  .then(function(d){
    var ms=(d.models||[]).filter(function(m){ return (m.supportedGenerationMethods||[]).indexOf('generateContent')>=0 && /flash/.test(m.name) && !/(image|tts|audio|live|embedding|thinking|robotics|computer)/.test(m.name); });
    function ver(n){ var m=/gemini-(\d+(?:\.\d+)?)/.exec(n); return m? parseFloat(m[1]) : 0; }
    function score(m){ var n=m.name; return ver(n)*10 - (/lite/.test(n)?3:0) - (/(preview|exp)/.test(n)?25:0) - (/latest/.test(n)?1:0); }
    ms.sort(function(a,b){ return score(b)-score(a); });
    var names=ms.map(function(m){ return m.name.replace(/^models\//,''); });
    if(!names.length) throw new Error('Aucun modèle Gemini Flash disponible pour cette clé');
    lsSet('ai_models_gemini',JSON.stringify(names)); return names;
  });
}
function geminiTry(key,model,sys,usr){
  return fetch('https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(model)+':generateContent',{
    method:'POST', headers:{'Content-Type':'application/json','x-goog-api-key':key},
    body:JSON.stringify({ systemInstruction:{parts:[{text:sys}]}, contents:[{role:'user',parts:[{text:usr}]}], generationConfig:{ temperature:0.1, responseMimeType:'application/json' } })
  }).then(function(r){
    if(r.ok) return r.json();
    return r.text().then(function(b){ var e=new Error(aiError('gemini',r.status,b)); e.status=r.status; throw e; });
  });
}
function wait(ms){ return new Promise(function(res){ setTimeout(res,ms); }); }
function aiCall(text,screen){
  var p=aiProvider(), key=aiKey(p), sys=aiSystem(), usr=aiUser(text,screen);
  if(p==='gemini'){
    // Modèle saturé (503), quota du modèle atteint (429) ou modèle retiré (404) → nouvel essai, puis modèle suivant
    return geminiModels(key).then(function(list){
      var pref=lsGet('ai_model_gemini',''); if(pref && list.indexOf(pref)>0){ list=[pref].concat(list.filter(function(x){ return x!==pref; })); }
      list=list.slice(0,5);
      var i=0, retried=false, lastErr=null;
      function attempt(){
        if(i>=list.length) throw lastErr||new Error('Aucun modèle Gemini disponible');
        var m=list[i];
        return geminiTry(key,m,sys,usr).then(function(d){
          lsSet('ai_model_gemini',m);
          var parts=(((d.candidates||[])[0]||{}).content||{}).parts||[];
          return aiParse(parts.map(function(x){ return x.text||''; }).join(''));
        }).catch(function(e){
          lastErr=e;
          if(e.status===503||e.status===500){ if(!retried){ retried=true; return wait(1200).then(attempt); } }
          if(e.status===503||e.status===500||e.status===429||e.status===404){ i++; retried=false; if(e.status===404) lsSet('ai_models_gemini',''); return attempt(); }
          throw e;
        });
      }
      return attempt();
    });
  }
  if(p==='mistral'){
    return fetch('https://api.mistral.ai/v1/chat/completions',{
      method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},
      body:JSON.stringify({ model:lsGet('ai_model_mistral','mistral-small-latest'), temperature:0.1, response_format:{type:'json_object'}, messages:[{role:'system',content:sys},{role:'user',content:usr}] })
    }).then(function(r){
      if(!r.ok) return r.text().then(function(b){ throw new Error(aiError('mistral',r.status,b)); });
      return r.json();
    }).then(function(d){ return aiParse(((d.choices||[])[0]||{}).message.content); });
  }
  return Promise.reject(new Error('Assistant IA non configuré'));
}
function aiNetMsg(e){ return (e && e.name==='TypeError')? 'Connexion à l’IA impossible (réseau, ou service qui refuse les appels depuis une page web)' : (e&&e.message)||'Erreur IA'; }

function busy(on,txt){
  var vb=document.getElementById('voicebar');
  if(!on){ vb.classList.remove('show','busy'); return; }
  vb.innerHTML='<span class="spin"></span><span class="vtxt">'+esc(txt)+'</span>';
  vb.classList.add('show','busy');
}
function aiHandle(text,screen,fallback){
  busy(true,'Analyse : « '+text+' »');
  aiCall(text,screen).then(function(r){
    busy(false);
    var it=(r&&r.intention)||'inconnu';
    if(it==='ajout') return aiAjout(r,text);
    if(it==='reassort'){ var rr=refById(r.refId); if(rr){ restock(rr.id, Math.max(1,parseInt(r.qte,10)||1), r.message); return; } return aiAjout(r,text); }
    if(it==='sortie') return aiSortie(r);
    if(it==='recherche') return aiResults(r, text);
    toast(r.message||'Je n’ai pas compris — reformulez');
  }).catch(function(e){
    busy(false);
    if(fallback) fallback(text);
    toast(aiNetMsg(e)+(fallback?' · analyse simple utilisée à la place':''));
  });
}
function refById(id){ return id? S.refs.find(function(x){ return x.id===id; }) : null; }
var FMAP={ domaine:'f-domaine', appellation:'f-appellation', region:'f-region', couleur:'f-couleur', millesime:'f-millesime', cepages:'f-cepages', qte:'f-qte', apogee:'f-apogee', prix:'f-prix', dateEntree:'f-date', note:'f-note', zone:'f-zone', etagere:'f-etagere' };
function aiAjout(r,text){
  if(S.view!=='add' || S.editId){ S.view='add'; S.editId=null; render(); window.scrollTo(0,0); }
  S.dict=text; showDict();
  var f=r.fiche||{}, ded=(r.deduits||[]);
  document.querySelectorAll('.guess').forEach(function(g){ g.remove(); });
  document.querySelectorAll('.ai-guess').forEach(function(g){ g.classList.remove('ai-guess'); });
  Object.keys(FMAP).forEach(function(k){
    var v=f[k]; if(v===null||v===undefined||v==='') return;
    var el=document.getElementById(FMAP[k]); if(!el) return;
    if(k==='zone'){ el.value=(String(v).toLowerCase()==='garage')?'garage':'frigo'; if(el.value==='garage') document.getElementById('f-etagere').value=''; return; }
    if(k==='etagere'){ var n=parseInt(v,10); if(n>=1&&n<=5) el.value=String(n); return; }
    if(k==='region'||k==='couleur'){ var list=k==='region'?REGIONS:COULEURS; var hit=list.find(function(x){ return noAcc(x)===noAcc(v); }); if(hit) el.value=hit; else return; }
    else if(k==='prix'){ el.value=String(v).replace('.',','); }
    else el.value=String(v);
    if(ded.indexOf(k)>=0){
      el.classList.add('ai-guess');
      var lab=el.previousElementSibling; if(lab && lab.tagName==='LABEL'){ var sp=document.createElement('span'); sp.className='guess'; sp.textContent=(k==='apogee'?' · estimation IA':' · déduit'); lab.appendChild(sp); }
      el.addEventListener('input',function once(){ el.classList.remove('ai-guess'); var g=el.previousElementSibling&&el.previousElementSibling.querySelector('.guess'); if(g) g.remove(); el.removeEventListener('input',once); });
    }
  });
  var zw=document.getElementById('f-zone'); if(zw) zw.dispatchEvent(new Event('change'));
  toast(r.message || 'Fiche remplie — vérifiez puis enregistrez');
}
function aiSortie(r){
  var ref=refById(r.refId), n=Math.max(1,parseInt(r.qte,10)||1);
  if(!ref){
    var c=(r.candidats||[]).map(refById).filter(Boolean);
    if(!c.length){ toast(r.message||'Je n’ai pas trouvé cette bouteille dans la cave'); return; }
    var h='<span class="eyebrow">Sortie</span><h3 style="margin:4px 0 6px">Quelle bouteille ?</h3><p class="hint" style="margin-bottom:10px">'+esc(r.message||'Plusieurs références correspondent.')+'</p>';
    c.forEach(function(x){ h+='<div class="alert-item"><span><b>'+esc(x.domaine)+'</b> '+esc(x.millesime)+'<br><span class="hint">'+esc(x.appellation)+' · ×'+x.qte+'</span></span><button class="btn sm" data-pick="'+x.id+'">Choisir</button></div>'; });
    drawerOpen(h);
    document.querySelectorAll('[data-pick]').forEach(function(b){ b.onclick=function(){ confirmOut(refById(b.getAttribute('data-pick')), n); }; });
    return;
  }
  confirmOut(ref,n,r.message);
}
function confirmOut(ref,n,msg){
  if(!ref) return; n=Math.max(1,Math.min(n,ref.qte||1));
  var h='<span class="eyebrow">Sortie</span><h3 style="margin:4px 0 2px">'+esc(ref.domaine)+' '+esc(ref.millesime)+'</h3><p class="hint">'+esc(ref.appellation)+' · '+(ref.zone==='garage'?'Garage':'Frigo, étagère '+ref.etagere)+' · en stock : ×'+ref.qte+'</p>';
  if(msg) h+='<p class="hint" style="margin-top:6px">'+esc(msg)+'</p>';
  if(ref.qte<=0){ h+='<p class="hint" style="color:var(--red);margin-top:12px">Cette référence est déjà épuisée.</p>'; drawerOpen(h); return; }
  h+='<div class="stepper"><button type="button" id="so-m">−</button><b class="mono" id="so-n">'+n+'</b><button type="button" id="so-p">+</button></div>';
  h+='<div class="formfoot"><button class="btn" id="so-ok">Sortir</button><button class="btn sec" id="so-no">Annuler</button></div>';
  drawerOpen(h);
  function upd(){ document.getElementById('so-n').textContent=n; }
  document.getElementById('so-m').onclick=function(){ if(n>1){ n--; upd(); } };
  document.getElementById('so-p').onclick=function(){ if(n<ref.qte){ n++; upd(); } };
  document.getElementById('so-no').onclick=closeDrawer;
  document.getElementById('so-ok').onclick=function(){ ref.qte=Math.max(0,ref.qte-n); closeDrawer(); toast(ref.qte===0? 'Dernière bouteille sortie — fiche conservée (épuisée)' : n+' bouteille'+(n>1?'s':'')+' sortie'+(n>1?'s':'')+' · reste '+ref.qte); save(); };
}
function aiResults(r,text){
  var list=(r.resultats||[]).map(refById).filter(Boolean);
  var h='<span class="eyebrow">Recherche</span><h3 style="margin:4px 0 6px">« '+esc(text)+' »</h3>';
  if(r.message) h+='<p style="margin-bottom:12px;font-size:14.5px">'+esc(r.message)+'</p>';
  h+=list.length? '<div class="grid">'+list.map(refCard).join('')+'</div>' : '<p class="hint">Aucune bouteille ne correspond.</p>';
  drawerOpen(h); bindCards();
}

/* Écoute générique : micro de l'appli ou dictée du clavier, puis texte final */
function listen(o){
  if(VOICE){ VOICE.stop(); return; }
  function kb(reason){ keyDictate({ title:o.title, ok:o.ok||'Valider', rows:o.rows||4, prefix:o.prefix, reason:reason, help:o.help, onDone:function(t){ if(t) o.done(t); } }); }
  if(useKeyboard()){ kb(voiceMode()==='clavier'? '' : failMsg('absent')); return; }
  VOICE=voiceSession({ prefix:o.prefix, silenceMs:o.silence||3000, firstMs:10000, onFail:function(r){ kb(failMsg(r)); }, onText:o.live,
    onDone:function(t,heard){ if(t) o.done(t); else if(!heard) toast('Rien entendu'); } });
}
function voiceAssistant(){
  listen({ title:'Parler à la cave', ok:'Envoyer', silence:3000, rows:4,
    help:'Ex. « J’ai acheté six Leflaive Puligny 2019 à 65 euros, frigo étagère 2 », « J’ai ouvert une Huet 2020 », « Qu’est-ce que j’ai comme blanc à boire cette année ? »',
    done:function(t){
      if(!aiOn()){ toast('Activez l’assistant IA dans ⚙︎ pour cette commande'); openMenu(); return; }
      aiHandle(t, S.view==='add'?'ajout':(S.view==='cave'?'cave':'général'));
    } });
}
function aiSettingsHTML(){
  var p=aiProvider();
  var h='<label style="margin-top:4px">Assistant IA (interprétation de la dictée)</label>';
  h+='<select id="ai-prov"><option value="none"'+(p==='none'?' selected':'')+'>Désactivé (analyse simple)</option><option value="gemini"'+(p==='gemini'?' selected':'')+'>Google Gemini — gratuit</option><option value="mistral"'+(p==='mistral'?' selected':'')+'>Mistral — gratuit</option></select>';
  h+='<div id="ai-keybox" style="margin-top:8px'+(p==='none'?';display:none':'')+'"><input type="password" id="ai-key" autocomplete="off" placeholder="Clé API" value="'+esc(aiKey(p==='none'?'gemini':p))+'">';
  h+='<p class="hint" id="ai-help" style="margin:6px 0 8px"></p>';
  h+='<div class="formfoot" style="margin-top:0"><button class="btn sm" id="ai-save">Enregistrer</button><button class="btn sm sec" id="ai-test">Tester</button></div><p class="hint" id="ai-res" style="margin-top:8px"></p></div>';
  return h;
}
function aiSettingsBind(){
  var sel=document.getElementById('ai-prov'); if(!sel) return;
  function help(){
    var v=sel.value;
    document.getElementById('ai-keybox').style.display=v==='none'?'none':'block';
    if(v==='none') return;
    document.getElementById('ai-key').value=aiKey(v);
    document.getElementById('ai-help').innerHTML= v==='gemini'
      ? 'Clé gratuite sur <b>aistudio.google.com</b> (menu « Get API key »). La clé reste sur cet appareil. Votre inventaire et la phrase dictée sont envoyés à Google pour l’analyse.'
      : 'Clé gratuite sur <b>console.mistral.ai</b> (offre « Experiment », vérification par SMS). La clé reste sur cet appareil. Votre inventaire et la phrase dictée sont envoyés à Mistral pour l’analyse.';
  }
  sel.onchange=function(){ lsSet('ai_provider',sel.value); help(); if(sel.value==='none') toast('Assistant IA désactivé'); };
  help();
  document.getElementById('ai-save').onclick=function(){ lsSet('ai_provider',sel.value); lsSet('ai_key_'+sel.value, document.getElementById('ai-key').value.trim()); if(sel.value==='gemini'){ lsSet('ai_model_gemini',''); lsSet('ai_models_gemini',''); } toast('Assistant IA enregistré'); };
  document.getElementById('ai-test').onclick=function(){
    lsSet('ai_provider',sel.value); lsSet('ai_key_'+sel.value, document.getElementById('ai-key').value.trim()); if(sel.value==='gemini'){ lsSet('ai_model_gemini',''); lsSet('ai_models_gemini',''); }
    var out=document.getElementById('ai-res'); out.textContent='Test en cours…';
    aiCall('domaine leflaive pull ligny montrachet deux mille dix-neuf trois bouteilles étagère deux','ajout').then(function(r){
      var f=r.fiche||{};
      out.innerHTML='✔ Fonctionne'+(sel.value==='gemini'?' ('+esc(lsGet('ai_model_gemini',''))+')':'')+' — compris : '+esc([f.domaine,f.appellation,f.millesime,(f.qte?'×'+f.qte:''),(f.etagere?'étagère '+f.etagere:'')].filter(Boolean).join(' · '));
    }).catch(function(e){ out.textContent='✖ '+aiNetMsg(e); });
  };
}

function doExport(){
  var blob=new Blob([JSON.stringify(S.refs,null,1)],{type:'application/json'});
  var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='cave-export-'+new Date().toISOString().slice(0,10)+'.json'; a.click();
  toast('Copie exportée');
}
function doImport(input){
  var f=input.files[0]; if(!f) return;
  f.text().then(function(t){ var d=JSON.parse(t); if(Array.isArray(d)){ S.refs=d; save(); toast('Import réussi · '+d.length+' références'); } }).catch(function(){ toast('Fichier invalide'); });
}

function isStandalone(){ return window.navigator.standalone===true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches); }
if(isStandalone()) document.documentElement.classList.add('standalone');
// Clavier iPhone : on remonte le panneau du bas au-dessus du clavier et on masque la barre d'onglets
if(window.visualViewport){
  var kbSync=function(){ var vv=window.visualViewport; var off=Math.max(0, Math.round(window.innerHeight - vv.height - vv.offsetTop));
    document.documentElement.style.setProperty('--kb', off+'px'); document.documentElement.classList.toggle('kbopen', off>80); };
  visualViewport.addEventListener('resize',kbSync); visualViewport.addEventListener('scroll',kbSync);
}
localLoad();
document.getElementById('overlay').onclick=closeDrawer;
document.getElementById('voicebar').onclick=function(){ if(VOICE) VOICE.stop(); };
document.getElementById('btn-export').onclick=doExport;
document.getElementById('btn-import').onclick=function(){ document.getElementById('fileinput').click(); };
document.getElementById('fileinput').onchange=function(){ doImport(this); };
if(!OD.token) odStatus('off','OneDrive non connecté');
odHandleCode();
odRestore();
if(OD.token && !location.search) odPull().then(render);
render();
if('serviceWorker' in navigator && location.protocol==='https:'){ navigator.serviceWorker.register('./sw.js').catch(function(){}); }
</script>
