<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cave</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="./icon.svg">
<meta name="theme-color" content="#f2f1f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#150e0f" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cave">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f1f4;--card:#ffffff;--card2:#f7f6f8;--ink:#1d1719;--muted:#776e72;--line:#e2dfe4;--acc:#7b1e35;--on-acc:#ffffff;--gold:#8a6618;--green:#2e7548;--red:#c2410c;--alert-bg:#fbe9df;--ok-bg:#e3f1e8;--early:#46607f;--early-bg:#e6ecf4;--past:#8c8387;--past-bg:#efedef;--w-rouge:#7d1428;--w-blanc:#e3cf7d;--w-rose:#e89aa6;--w-eff:#eadba0;--shadow:0 1px 3px rgba(40,20,25,.07);--sys:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--serif:"Fraunces",Georgia,serif}
@media(prefers-color-scheme:dark){:root{--bg:#150e0f;--card:#211617;--card2:#2a1c1d;--ink:#f2e9dc;--muted:#a7968c;--line:#3a2729;--acc:#d47a8c;--on-acc:#1a1011;--gold:#d8b265;--green:#79c795;--red:#ff8052;--alert-bg:#3d1f16;--ok-bg:#1b2e22;--early:#9db2cf;--early-bg:#1f2633;--past:#8f8178;--past-bg:#2a2222;--w-rouge:#b0243f;--w-blanc:#e6d488;--w-rose:#eaa0ab;--w-eff:#efe2a8;--shadow:0 1px 3px rgba(0,0,0,.4)}}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
button,.chip,.card,#tabbar,.nav{-webkit-user-select:none;user-select:none;touch-action:manipulation}
input,textarea,select{touch-action:manipulation}
body{font-family:var(--sys);background:var(--bg);color:var(--ink);display:flex}
h1,h2,h3,.serif{font-family:var(--serif);font-weight:600}
.mono{font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
#app{display:flex;width:100%;min-height:100vh}
aside{width:250px;flex:0 0 250px;border-right:1px solid var(--line);padding:20px 16px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand h1{font-size:26px;line-height:1}
.brand small{color:var(--muted);font-size:12px}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;text-align:left;font-size:14.5px;color:var(--ink)}
.nav button:hover{background:var(--card)}
.nav button.on{background:var(--acc);color:var(--on-acc)}
.badge{margin-left:auto;background:var(--red);color:#fff;border-radius:99px;font-size:11px;padding:1px 7px}
.gauges{display:flex;flex-direction:column;gap:10px;font-size:12.5px}
.gbar{height:7px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:4px}
.gfill{height:100%;background:var(--acc);border-radius:99px}
.gauge.garage .gfill{background:var(--gold)}
.store{margin-top:auto;font-size:12.5px;border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:8px}
.dot{display:inline-block;width:9px;height:9px;border-radius:99px;margin-right:6px;vertical-align:middle}
.dot.ok{background:var(--green)}.dot.err{background:var(--red)}.dot.off{background:var(--muted)}
.linkbtn{color:var(--acc);text-decoration:underline;font-size:12.5px;text-align:left}
main{flex:1;padding:28px 34px;max-width:1100px}
.viewhead{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:22px;flex-wrap:wrap}
.viewhead h2{font-size:32px}
.eyebrow{color:var(--acc);font-size:12px;text-transform:uppercase;letter-spacing:.12em;font-weight:600}
.btn{background:var(--acc);color:var(--on-acc);border-radius:12px;padding:11px 18px;font-weight:600;font-size:14.5px;display:inline-flex;align-items:center;gap:8px}
.btn.sec{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:9px}
.btn.danger{background:var(--red)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:24px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.tile b{font-size:26px;display:block;font-family:inherit}
.tile span{color:var(--muted);font-size:12.5px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow);margin-bottom:20px}
.panel h3{font-size:17px;margin-bottom:12px}
details.panel{padding:0;overflow:hidden}
details.panel summary{cursor:pointer;font-size:17px;font-weight:700;padding:15px 18px;list-style:none;display:flex;align-items:center;justify-content:space-between}
details.panel summary::-webkit-details-marker{display:none}
details.panel summary::after{content:'▸';color:var(--muted);font-size:16px;line-height:1}
details.panel[open] summary::after{content:'▾'}
details.panel>*:not(summary){margin-left:18px;margin-right:18px}
details.panel>*:last-child{margin-bottom:18px}
.searchbar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
input[type=text],input[type=search],input[type=password],input[type=number],select,textarea{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;color:var(--ink);font:inherit}
.searchbar input[type=text],.searchbar input[type=search]{flex:1;min-width:200px;-webkit-appearance:none;appearance:none}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.chip{border:1px solid var(--line);border-radius:99px;padding:5px 13px;font-size:12.5px;background:var(--card)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);cursor:pointer}
.card:hover{border-color:var(--acc)}
.card .eyebrow{margin-bottom:4px}
.card h4{font-family:var(--serif);font-size:16.5px;margin-bottom:2px}
.card .meta{color:var(--muted);font-size:12.5px;margin-bottom:10px}
.tagrow{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:11px;border-radius:99px;padding:2px 9px;background:var(--bg);border:1px solid var(--line);color:var(--muted)}
.tag.q{background:var(--acc);color:var(--on-acc);border-color:var(--acc)}
.tag.dead{background:var(--muted);color:#fff;border-color:var(--muted)}
.tag.alert{background:var(--red);color:#fff;border-color:var(--red)}
form .row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
form .full{grid-column:1/-1}
label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px}
input,select,textarea{width:100%}
.formfoot{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.banner{background:var(--bg);border:1px solid var(--gold);border-radius:12px;padding:11px 14px;font-size:13px;margin-bottom:16px}
.alert-item{display:flex;justify-content:space-between;gap:10px;padding:11px 4px;border-bottom:1px solid var(--line);font-size:14px;align-items:center}
.alert-item:last-child{border:none}
.sev{font-size:11px;border-radius:99px;padding:2px 9px;white-space:nowrap}
.sev.warn{background:var(--alert-bg);color:var(--red)}.sev.crit{background:var(--red);color:#fff}.sev.ok{background:var(--ok-bg);color:var(--green)}
.aitem{display:flex;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line);align-items:flex-start;cursor:pointer}
.aitem:last-child{border-bottom:none}
.aitem .mid{flex:1;min-width:0}
.aitem .who{font-family:var(--serif);font-size:15.5px}
.aitem .meta{font-size:12.5px;color:var(--muted);margin-top:1px}
.aitem .awhy{font-size:13.5px;margin-top:5px;line-height:1.4}
.band-stock{border-left:4px solid var(--red)}
.band-zone{border-left:4px solid var(--acc)}
.band-data{border-left:4px solid var(--gold)}
.band-apo{border-left:4px solid var(--green)}
.agtitle{padding:12px 16px 6px;font-size:13.5px;font-weight:700;display:flex;justify-content:space-between;align-items:baseline}
.agtitle .acnt{color:var(--muted);font-weight:400;font-size:12px}
.csep{width:1px;background:var(--line);margin:8px 2px;flex:none}
.chip.crit.on{background:var(--red);border-color:var(--red);color:#fff}
#drawer{position:fixed;top:0;right:-440px;width:min(420px,100vw);height:100vh;background:var(--card);border-left:1px solid var(--line);transition:right .25s;z-index:50;overflow-y:auto;padding:26px;box-shadow:var(--shadow)}
#drawer.open{right:0}
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:.25s;z-index:40}
#overlay.open{opacity:1;pointer-events:auto}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
.fact b{display:block;font-size:14.5px}
.fact span{font-size:11.5px;color:var(--muted)}
.apobar{height:10px;background:var(--line);border-radius:99px;position:relative;margin:8px 0 4px}
.apobar .range{position:absolute;top:0;height:100%;background:var(--gold);border-radius:99px}
.apobar .now{position:absolute;top:-4px;width:4px;height:18px;background:var(--acc);border-radius:2px}
.chatbox{display:flex;flex-direction:column;gap:12px;max-width:720px}
.msg{padding:11px 15px;border-radius:14px;font-size:14.5px;max-width:85%;white-space:pre-wrap}
.msg.me{background:var(--acc);color:var(--on-acc);align-self:flex-end}
.msg.bot{background:var(--card);border:1px solid var(--line);align-self:flex-start}
.msg.bot b{font-family:var(--serif)}
.chatin{display:flex;gap:8px;margin-top:10px;max-width:720px}
.chatin input{flex:1}
.empty{color:var(--muted);text-align:center;padding:40px 0;font-size:14px;grid-column:1/-1}
.hint{color:var(--muted);font-size:12.5px}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 18px;font-size:13.5px;opacity:0;transition:.3s;z-index:99;pointer-events:none;max-width:90vw}
#toast.show{opacity:1}
/* --- v2.2 : éléments communs --- */
.dhead{display:flex;justify-content:flex-end;align-items:center;margin:-10px -8px 4px;position:relative;min-height:36px}
.dclose{width:40px;height:40px;border-radius:99px;font-size:18px;color:var(--muted)}
.grab{display:none}
#voicebar{position:fixed;top:calc(10px + env(safe-area-inset-top));left:50%;transform:translate(-50%,-160%);z-index:98;background:var(--ink);color:var(--bg);border-radius:16px;padding:10px 14px;display:flex;align-items:center;gap:10px;width:min(560px,calc(100vw - 24px));font-size:14px;transition:transform .25s;cursor:pointer;box-shadow:var(--shadow)}
#voicebar.show{transform:translate(-50%,0)}
.vdot{width:12px;height:12px;border-radius:99px;background:#e0543a;flex:none;animation:pulse 1.1s infinite}
.vtxt{flex:1;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.vstop{font-weight:600;font-size:13px;border:1px solid currentColor;border-radius:99px;padding:4px 10px;flex:none}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
#tabbar,.mhead,.only-m{display:none}
.flabel{display:flex;align-items:center;gap:6px;min-height:28px;flex-wrap:wrap}
.flabel>span:first-child{flex:none}
.prov{font-size:11px;border-radius:99px;padding:1px 8px;white-space:nowrap}
.prov:empty{display:none}
.prov-dicte{background:rgba(76,122,76,.12);color:var(--green)}
.prov-deduit{background:rgba(154,125,44,.14);color:var(--gold)}
.prov-ia{background:rgba(179,84,47,.12);color:var(--acc);cursor:pointer}
.prov-inao{background:rgba(60,90,150,.12);color:#3c5a96;cursor:pointer}
@media(prefers-color-scheme:dark){.prov-inao{color:#9db4e6}}
.fedit{margin-left:auto;width:32px;height:28px;border-radius:8px;font-size:14px;opacity:.75}
.fedit:hover{opacity:1;background:var(--bg)}
.flash{box-shadow:0 0 0 3px rgba(76,122,76,.35)!important;transition:box-shadow .2s}
.aistate{font-size:13px;color:var(--muted);margin:-6px 0 10px;display:flex;align-items:center;gap:8px}
.spin.sm{width:12px;height:12px;display:inline-block;vertical-align:middle}
#aisug{position:fixed;left:50%;transform:translate(-50%,-200%);top:calc(64px + env(safe-area-inset-top));z-index:97;background:var(--card);border:1px solid var(--acc);border-radius:14px;padding:8px 8px 8px 14px;display:flex;align-items:center;gap:10px;width:min(560px,calc(100vw - 24px));font-size:13.5px;box-shadow:var(--shadow);transition:transform .25s}
#aisug{visibility:hidden;pointer-events:none}
#aisug.show{transform:translate(-50%,0);visibility:visible;pointer-events:auto}
#aisug>span{flex:1}
#aisug .dclose{width:32px;height:32px}
.ai-guess{border-color:var(--gold)!important;background:rgba(154,125,44,.09)!important}
.guess{color:var(--gold);font-weight:600;font-size:11.5px}
.spin{width:16px;height:16px;border-radius:99px;border:2px solid currentColor;border-right-color:transparent;flex:none;animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
#voicebar.busy{cursor:default}
.mhead .micbtn{background:var(--acc);color:var(--on-acc);font-size:18px}
.stepper{display:flex;align-items:center;justify-content:center;gap:18px;margin:18px 0}
.stepper button{width:52px;height:52px;border-radius:99px;border:1px solid var(--line);font-size:24px;background:var(--bg)}
.stepper b{font-size:34px;min-width:60px;text-align:center}
/* ===== v2.11 : refonte (iPhone natif + cave nocturne, accent bordeaux) ===== */
.ico{width:20px;height:20px;flex:none}
.pastille{width:13px;height:13px;border-radius:50%;flex:none;display:inline-block;box-shadow:inset 0 0 0 1px rgba(0,0,0,.14)}
.p-rouge{background:var(--w-rouge)}.p-blanc{background:var(--w-blanc)}.p-rose{background:var(--w-rose)}
.p-eff{background:radial-gradient(circle at 35% 35%,#fff 0 1.3px,transparent 1.6px),radial-gradient(circle at 65% 62%,#fff 0 1px,transparent 1.3px),var(--w-eff)}
.group{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;max-width:760px}
.group>*+*{border-top:1px solid var(--line)}
.group .card{border:none;border-radius:0;box-shadow:none}
.group .card+.card{border-top:1px solid var(--line)}
.card{display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 12px 11px 14px;background:var(--card);cursor:pointer}
.card:hover{border-color:var(--line);background:var(--card2)}
.card>.pastille{align-self:start;margin-top:5px}
.cname{font-family:var(--serif);font-size:17px;font-weight:600;line-height:1.2}
.cuv{font-weight:500;color:var(--muted)}
.csub{font-size:13.5px;margin-top:2px}
.csub .reg{color:var(--muted)}
.cmeta{display:flex;gap:6px 8px;align-items:center;margin-top:6px;flex-wrap:wrap}
.loc{font-size:12px;color:var(--muted)}
.apo{font-size:11.5px;font-weight:600;border-radius:99px;padding:1px 8px;white-space:nowrap}
.apo-early{color:var(--early);background:var(--early-bg)}.apo-ok{color:var(--green);background:var(--ok-bg)}
.apo-vite{color:var(--red);background:var(--alert-bg)}.apo-past{color:var(--red);background:var(--alert-bg)}.apo-old{color:var(--past);background:var(--past-bg);text-decoration:line-through}
.apo-soon{color:var(--gold);background:var(--early-bg)}
.apo-src{font-size:12px;color:var(--muted);margin-top:4px}
.apo-warn{color:var(--red);background:var(--alert-bg)}.apo-dead{color:var(--past);background:var(--past-bg)}
.cqty{display:flex;flex-direction:column;align-items:center;gap:4px}
.cqty b{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
.minus{min-width:46px;height:34px;border-radius:10px;border:1px solid var(--acc);color:var(--acc);font-weight:700;font-size:14px}
.minus:active{background:var(--acc);color:var(--on-acc)}
.gtitle{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:20px 4px 7px;display:flex;justify-content:space-between;align-items:baseline;max-width:760px}
.gtitle.alert{color:var(--red)}
.gtitle .linkbtn{letter-spacing:0;text-transform:none;text-decoration:none;font-size:13px}
.lrow{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:11px 14px;font-size:14px;cursor:pointer;background:var(--card)}
.lrow .l{display:flex;gap:10px;align-items:center;min-width:0}
.lrow .l>span:last-child{min-width:0}
.lrow .t{font-family:var(--serif);font-weight:600;font-size:15.5px}
.lrow .s{color:var(--muted);font-size:12.5px}
.lrow .r{color:var(--red);font-weight:600;font-size:13px;white-space:nowrap}
.lrow .warnic{color:var(--red)}
.summary{display:flex;gap:6px;flex-wrap:wrap}
.summary span{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:3px 10px;font-size:12.5px;font-variant-numeric:tabular-nums}
.fmap{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;padding:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;max-width:760px}
.ftile{border-radius:8px;padding:5px 3px;text-align:center;background:var(--card2);border:1px solid var(--line);min-height:52px;display:flex;flex-direction:column;justify-content:center;gap:1px}
.ftile .n{font-size:9.5px;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ftile .c{font-size:12px;font-weight:600;display:flex;justify-content:center;gap:5px;font-variant-numeric:tabular-nums}
.ftile .c i{font-style:normal;display:inline-flex;align-items:center;gap:2px}
.ftile .c i::before{content:"";width:7px;height:7px;border-radius:50%;display:inline-block}
.ftile .c i.r::before{background:var(--w-rouge)}.ftile .c i.b::before{background:var(--w-blanc)}
.ftile.zero{background:transparent;border-style:dashed}
.ftile.zero .c{color:var(--muted);font-weight:400}
.maplegend{font-size:12px;color:var(--muted);margin:6px 4px 0;max-width:760px}
.colrecap{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;max-width:760px}
.colrecap>div{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px}
.colrecap>div+div{border-left:1px solid var(--line)}
.colrecap b{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
.colrecap span:last-child{font-size:11.5px;color:var(--muted)}
.sortseg{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:2px;margin-bottom:8px;max-width:420px}
.sortseg button{flex:1;font-size:13.5px;padding:7px 4px;border-radius:8px}
.sortseg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.18);font-weight:600}
.csec{margin-bottom:12px}
.shd{position:sticky;top:var(--hh,0px);z-index:3;background:var(--bg);padding:10px 4px 7px;font-size:13.5px;font-weight:700;display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-bottom:1px solid var(--line);margin-bottom:6px;max-width:760px;width:100%;text-align:left;color:var(--ink)}
.shd small{font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums}
.shd .chev{display:inline-block;width:16px;text-align:center;color:var(--acc);transition:transform .18s;transform-origin:50% 50%}
.csec.closed .chev{transform:rotate(-90deg)}
.csec.closed .group{display:none}
.csec.closed{margin-bottom:0}
.ccount{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:0 4px 8px;max-width:760px}
.ccount .linkbtn{white-space:nowrap;text-decoration:none;font-weight:600}

<body>
<div id="app"><aside>
 <div class="brand"><h1>Cave</h1><small>v2.18</small></div>
 <div class="mhead"><span id="msync" class="dot off" title="Synchronisation"></span><button class="mhead-set" id="mhead-set" aria-label="Réglages"></button></div>
 <nav class="nav" id="nav"></nav>

  <div id="syncstatus"></div>
  <button class="btn sec" id="btn-settings-d" style="justify-content:center"></button>
 </div>
</aside>
<main id="main"></main>
<nav id="tabbar"></nav>
<button id="fab-mic" aria-label="Parler à la cave"></button>
<div id="voicebar" role="button" aria-label="Arrêter l’écoute"></div>
<div id="aisug"></div>
<datalist id="inao-list"></datalist>
<datalist id="cep-list"></datalist>
<datalist id="dom-list"></datalist>
<datalist id="cuv-list"></datalist>
<div id="overlay"></div>
<div id="drawer"></div>

<input type="file" id="fileinput" accept=".json,application/json" hidden></div>
<script>
var APPV='v2.18';
var S = { refs: [], view: 'dash', search: '', filter: 'Tous', editId: null, chat: [], dict: '', sort: (function(){ try{ return localStorage.getItem('cave-sort')||'reg'; }catch(e){ return 'reg'; } })() };
var REGIONS = ['Bourgogne','Rhône','Loire','Beaujolais','Alsace','Bordeaux','Provence','Champagne','Languedoc','Sud-Ouest','Jura','Savoie','Corse','Normandie','Nord-Est','Île-de-France','Étranger','Autre'];
var COULEURS = ['Rouge','Blanc','Rosé','Effervescent'];

function nomVin(r){ return (r.domaine||'')+(r.cuvee? ' · '+r.cuvee : ''); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function id(){ return 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function toast(m,undo){ var t=document.getElementById('toast'); t.classList.remove('act');
  if(undo){ t.innerHTML='<span>'+esc(m)+'</span><button class="undo" type="button">Annuler</button>'; t.classList.add('act');
    t.querySelector('.undo').onclick=function(){ t.classList.remove('show','act'); clearTimeout(t._h); undo(); }; }
  else t.textContent=m;
  t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(function(){ t.classList.remove('show','act'); }, undo?5000:2800); }
function val(fid){ return document.getElementById(fid).value.trim(); }
function set$(fid,v){ var el=document.getElementById(fid); if(!el||v===null||v===undefined||v==='') return;
  if(el.tagName==='SELECT'){ for(var i=0;i<el.options.length;i++){ if(el.options[i].text.toLowerCase().indexOf(String(v).toLowerCase())>=0){ el.selectedIndex=i; break; } } }
  else el.value=v; }

// Fenêtre d'apogée : « 2026 – 2032 », « 2030 » (une seule année) ou « dès 2030 » (fin inconnue : open)
function apYears(r){
  var t=String(r.apogee||''), open=/^\s*(d[eè]s|à partir de|a partir de)\s/i.test(t) || /\d{4}\s*[–\-—]\s*(…|\.\.\.|\?)?\s*$/.test(t);
  var m = /(\d{4})\s*(?:[–\-—]|a|à|jusqu|to)?\s*(\d{4})?/.exec(t);
  if(!m) return null;
  var d = parseInt(m[1],10), f = m[2] ? parseInt(m[2],10) : (open? null : d);
  if(f!==null && f < d) f = d; return { d:d, f:f, open:f===null };
}
// Règles B (décisions du 30/09/2026) : « Bientôt prêt » = l'année précédant l'ouverture ; « À boire vite » = dernier tiers de la fenêtre, au moins 2 ans ;
// « Dépassé » en deux paliers : jusqu'à 2 ans après la fin, puis au-delà. Précision à l'année.
var APO_SOON=1, APO_VITE_MIN=2, APO_PAST_PALIER=2;
function viteFrom(a){ var n=a.f-a.d+1, len=Math.max(APO_VITE_MIN, Math.ceil(n/3)); return a.f-len+1; }
function apoState(r){ var a=apYears(r); if(!a) return 'none'; var y=new Date().getFullYear();
  if(y<a.d) return (a.d-y<=APO_SOON)? 'soon' : 'early';
  if(a.open) return 'ok';
  if(y>a.f) return (y-a.f<=APO_PAST_PALIER)? 'past' : 'old';
  if(y>=viteFrom(a)) return 'vite'; return 'ok'; }
function inWindow(r){ var s=apoState(r); return s==='ok'||s==='vite'; }
function pastWindow(r){ var s=apoState(r); return s==='past'||s==='old'; }
function isLongGarde(r){ var a=apYears(r); if(!a) return false; var y=new Date().getFullYear(); if(a.open) return true; return (a.f-a.d>8) || (a.f-y>5); }

/* ===== v2.16 : moteur d'alertes (hors apogée) =====
   Réglages dans localStorage « cave-alertes » : seuilMode ('auto'|'fixe'), seuilFixe, types {stock, zone, zonePleine, data}.
   Seuil de stock : seuil propre à la fiche (r.seuil, colonne CSV 'seuil') > seuil fixe des Réglages > règle automatique (0/1/2 selon qteInit).
   Référence entrée en pièce unique (qteInit<=1) : jamais d'alerte de stock. */
var ACFG_KEY='cave-alertes';
function alertCfg(){ try{ var c=JSON.parse(localStorage.getItem(ACFG_KEY)||'{}'); c.types=c.types||{}; return c; }catch(e){ return {types:{}}; } }
function alertCfgSave(c){ try{ localStorage.setItem(ACFG_KEY, JSON.stringify(c)); }catch(e){} }
function seuilBas(r){
  if((r.qteInit||0)<=1) return -1;
  if(r.seuil!==null && r.seuil!==undefined && r.seuil!=='' && !isNaN(parseInt(r.seuil,10))) return Math.max(0,parseInt(r.seuil,10));
  var c=alertCfg();
  if(c.seuilMode==='fixe' && !isNaN(parseInt(c.seuilFixe,10))) return Math.max(0,parseInt(c.seuilFixe,10));
  var qi=r.qteInit||0; if(qi<=2) return 0; if(qi<=5) return 1; return 2;
}
function stockAlert(r){
  var s=seuilBas(r); if(s<0 || r.qte<=0 || r.qte>s) return null;
  return r.qte===1? {sev:'crit',type:'stock',txt:'Dernière bouteille'} : {sev:'warn',type:'stock',txt:'Stock bas ('+r.qte+' restante'+(r.qte>1?'s':'')+')'};
}
function alertsFor(r){
  var out=[];
  if(r.qte<=0) return out;
  var cfg=alertCfg();
  var st=apoState(r);
  if(st==='ok'||st==='vite') out.push({sev:'ok',type:'apo',txt:'Apogée en cours ('+r.apogee+') — à boire'});
  else if(st==='past') out.push({sev:'warn',type:'apo',txt:'Apogée dépassée ('+r.apogee+') — à ouvrir vite'});
  else if(st==='old') out.push({sev:'warn',type:'apo',txt:'Apogée dépassée depuis plus de '+APO_PAST_PALIER+' ans ('+r.apogee+') — à goûter, risque de déclin'});
  if(cfg.types.zone!==false && zoneBad(r)) out.push({sev:'crit',type:'zone',txt:'Vin de garde rangé dans une zone non adaptée ('+zoneOf(r).nom+')'});
  if(cfg.types.stock!==false){ var sa=stockAlert(r); if(sa) out.push(sa); }
  return out;
}
function allAlerts(){
  var out=[], c=alertCfg(), cur=null;
  S.refs.forEach(function(r){ alertsFor(r).forEach(function(a){ if(a.sev!=='ok') out.push({ref:r,a:a}); }); });
  if(c.types.zonePleine!==false) ZONES.forEach(function(z){
    if(z.cap && z.cap>0){ cur=cur||current(); var q=qsum(cur.filter(function(r){ return zoneOf(r).id===z.id; }));
      if(q>z.cap) out.push({ref:null,a:{sev:'crit',type:'zonePleine',txt:'Zone « '+z.nom+' » pleine ('+q+'/'+z.cap+')'}});
      else if(q===z.cap) out.push({ref:null,a:{sev:'warn',type:'zonePleine',txt:'Zone « '+z.nom+' » à capacité atteinte ('+q+'/'+z.cap+')'}});
    }});
  if(c.types.data!==false) S.refs.forEach(function(r){
    if(r.qte<=0) return;
    var miss=[]; if(!r.region) miss.push('région'); if(!r.apogee) miss.push('apogée'); if(!r.cepages) miss.push('cépages');
    if(miss.length) out.push({ref:r,a:{sev:'warn',type:'data',txt:'Fiche incomplète : '+miss.join(', ')}});
    cohMemo(r).forEach(function(cc){ var fl={region:'région',couleur:'couleur'}[cc.f]||cc.f; out.push({ref:r,a:{sev:'warn',type:'data',txt:'À vérifier — '+fl+' : '+cc.why}}); });
  });
  return out;
}
function alertCount(){ return allAlerts().length; }
function current(){ return S.refs.filter(function(r){ return r.qte>0; }); }
function qsum(l){ return l.reduce(function(a,r){ return a+Math.max(0,r.qte); },0); }

var LSKEY='cave-nicolas-v2';
function localSave(){ localStorage.setItem(LSKEY, JSON.stringify(S.refs)); }
function localLoad(){ try{ S.refs = JSON.parse(localStorage.getItem(LSKEY)||'[]'); }catch(e){ S.refs=[]; } }
/* ===== v2.12 : zones configurables (partage et paramétrage) ===== */
// Chaque zone : id (fixe, sert dans les données), nom, detail (ex. « 15 °C »), cap (0 = non suivie), et (nombre d'étagères, 0 = aucune), garde (adaptée à la garde longue)
var ZDEF=[{id:'frigo',nom:'Cave frigo',detail:'15 °C',cap:75,et:5,garde:true},{id:'garage',nom:'Garage',detail:'',cap:150,et:0,garde:false}];
function zonesRead(){ try{ var z=JSON.parse(localStorage.getItem('cave-zones')||'null'); if(z&&z.length) return z; }catch(e){} return null; }
// Utilisateur déjà installé avant la v2.12 (données locales ou OneDrive déjà configuré) : on reprend sa cave telle quelle
function legacyUser(){ try{ var d=JSON.parse(localStorage.getItem(LSKEY)||'[]'); return (d&&d.length>0) || !!localStorage.getItem('od_client') || !!localStorage.getItem('od_refresh'); }catch(e){ return false; } }
var ZONES=zonesRead();
function zonesInit(){
  if(ZONES) return;
  if(legacyUser()){ ZONES=JSON.parse(JSON.stringify(ZDEF)); zonesSave(false); try{ localStorage.setItem('cave-onboard','legacy'); }catch(e){} }
  else ZONES=[{id:'cave',nom:'Ma cave',detail:'',cap:0,et:0,garde:true}];
}
function zonesSave(push){ try{ localStorage.setItem('cave-zones',JSON.stringify(ZONES)); }catch(e){} applyZones(); if(push!==false && OD.token) odPushZones(); }
function zslug(n,taken){ var s=noAcc(String(n||'')).replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'zone'; var b=s, i=2; while(taken.indexOf(s)>=0){ s=b+'-'+i; i++; } return s; }
function capWord(s){ s=String(s||''); return s.charAt(0).toUpperCase()+s.slice(1); }
function zoneById(id){ var z=ZONES.find(function(x){ return x.id===id; }); return z || (id? {id:id,nom:capWord(String(id).replace(/-/g,' ')),detail:'',cap:0,et:0,garde:true,inconnue:true} : ZONES[0]); }
function zoneOf(r){ return zoneById(r.zone||ZONES[0].id); }
// Zones présentes dans les données mais absentes de la configuration (import, autre appareil) : on les ajoute pour ne rien perdre
function zonesAdopt(){
  var added=false;
  S.refs.forEach(function(r){ if(!r.zone){ r.zone=ZONES[0].id; return; } if(!ZONES.some(function(z){ return z.id===r.zone; })){ var z=zoneById(r.zone); delete z.inconnue; ZONES.push(z); added=true; } });
  if(added) zonesSave(false);
}
function locTxt(r){ var z=zoneOf(r); return z.nom+(z.et>0 && r.etagere? ' · étag. '+r.etagere : ''); }
function zoneBad(r){ return !zoneOf(r).garde && isLongGarde(r); }
function maxEt(){ return ZONES.reduce(function(a,z){ return Math.max(a,z.et||0); },0); }
function zoneWithShelves(){ return ZONES.find(function(z){ return z.et>0; })||null; }
// Mots qui désignent une zone à l'oral : son nom complet et ses mots significatifs (+ « frigo » pour la zone historique)
var ZSTOP=['cave','vin','vins','rouge','blanc','zone','etagere','etageres','le','la','les','de','du','des','mon','ma','mes','a','au','en','dans','l','d'];
function zoneWords(z){
  var w=noAcc(z.nom).replace(/[^a-z0-9 ]+/g,' ').split(/\s+/).filter(function(x){ return x.length>=3 && ZSTOP.indexOf(x)<0; });
  if(z.id==='frigo') w.push('frigo');
  if(z.id==='garage') w.push('garage');
  return w;
}
function zoneFromText(t){
  var s=' '+noAcc(String(t||'')).replace(/[^a-z0-9 ]+/g,' ')+' ';
  var exact=ZONES.find(function(z){ return z.id===String(t).trim() || s.indexOf(' '+noAcc(z.nom).replace(/[^a-z0-9 ]+/g,' ').trim()+' ')>=0; });
  if(exact) return exact;
  var best=null;
  ZONES.forEach(function(z){ if(best) return; if(zoneWords(z).some(function(w){ return s.indexOf(' '+w+' ')>=0; })) best=z; });
  if(!best && ZONES.length===1 && /\bcave\b/.test(s)) best=ZONES[0];
  return best;
}
function zoneTailRe(){ var w=[]; ZONES.forEach(function(z){ w=w.concat(zoneWords(z)); }); return w.length? '|'+w.map(function(x){ return x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }).join('|') : ''; }
function zoneLabel(z){ return z.nom+(z.detail? ' · '+z.detail : ''); }
function applyZones(){
  if(typeof FPROMPT!=='undefined'){ var p='Emplacement : '+(zoneWithShelves()? '« étagère 3 » ou ' : '')+ZONES.map(function(z){ return '« '+z.nom.toLowerCase()+' »'; }).join(', '); FPROMPT.zone=p; FPROMPT.etagere=p; }
  if(typeof buildSysAjout==='function') SYS_AJOUT=buildSysAjout();
}

function csvCell(v){ v=String(v==null?'':v); return /[";\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; }
function toCSV(){
  var head=['domaine','cuvee','region','appellation','couleur','millesime','cepages','qte','qteInit','zone','etagere','apogee','prix','prixEstime','note','dateEntree','lots','exemple','refus','verifie','apoSrc','style','format','seuil'];
  var lines=[head.join(';')];
  S.refs.forEach(function(r){
    var lots=(r.lots||[]).map(function(l){ return l.qte+'@'+l.date; }).join(',');
    lines.push([r.domaine,r.cuvee||'',r.region,r.appellation,r.couleur,r.millesime,r.cepages,r.qte,r.qteInit,r.zone,r.etagere||'',r.apogee||'',r.prix||'',r.prixEstime?'1':'',r.note||'',r.dateEntree||'',lots,r.exemple?'1':'',(r.refus||[]).join('¦'),r.verifie||'',r.apoSrc||'',r.style||'',r.format||'',(r.seuil===null||r.seuil===undefined?'':r.seuil)].map(csvCell).join(';'));
  });
  return lines.join('\n');
}
function parseCSV(text){
  var rows=[], row=[], cell='', q=false;
  for(var i=0;i<text.length;i++){ var c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){ cell+='"'; i++; } else q=false; } else cell+=c; }
    else if(c==='"') q=true;
    else if(c===';'){ row.push(cell); cell=''; }
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; row.push(cell); if(row.some(function(x){return x!=='';})) rows.push(row); row=[]; cell=''; }
    else cell+=c;
  }
  row.push(cell); if(row.some(function(x){return x!=='';})) rows.push(row);
  if(rows.length<2) return [];
  var head=rows[0].map(function(h){ return h.trim().toLowerCase(); });
  function get(rw,n){ var i2=head.indexOf(String(n).toLowerCase()); return i2>=0?(rw[i2]||'').trim():''; }
  var map={}, order=[];
  rows.slice(1).forEach(function(rw){
    var dom=get(rw,'domaine'); if(!dom) return;
    var key=dom.toLowerCase()+'|'+get(rw,'cuvee').toLowerCase()+'|'+get(rw,'appellation').toLowerCase()+'|'+get(rw,'millesime');
    var lotsRaw=get(rw,'lots'), lots=[];
    if(lotsRaw){ lotsRaw.split(',').forEach(function(p){ var t=p.split('@'); if(t[0]) lots.push({qte:parseInt(t[0],10)||0,date:t[1]||''}); }); }
    var o=map[key];
    if(!o){ o={ id:id(), exemple:get(rw,'exemple')==='1', domaine:dom, cuvee:get(rw,'cuvee'), prixEstime:get(rw,'prixestime')==='1', region:get(rw,'region')||'Autre', appellation:get(rw,'appellation'), couleur:get(rw,'couleur')||'Rouge', millesime:get(rw,'millesime'), cepages:get(rw,'cepages'), qte:parseInt(get(rw,'qte'),10)||0, qteInit:parseInt(get(rw,'qteInit'),10)||0, zone:get(rw,'zone')||'', etagere:get(rw,'etagere')?parseInt(get(rw,'etagere'),10):null, apogee:get(rw,'apogee'), prix:get(rw,'prix')?(parseFloat(get(rw,'prix').replace(',','.'))||null):null, note:get(rw,'note'), dateEntree:get(rw,'dateEntree'), lots:lots, refus:splitRefus(get(rw,'refus')), verifie:get(rw,'verifie'), apoSrc:get(rw,'apoSrc'), style:get(rw,'style'), format:get(rw,'format'), seuil:(get(rw,'seuil')!==''&&!isNaN(parseInt(get(rw,'seuil'),10)))? Math.max(0,parseInt(get(rw,'seuil'),10)) : null }; map[key]=o; order.push(key); }
    else { o.qte+=parseInt(get(rw,'qte'),10)||0; o.qteInit+=parseInt(get(rw,'qteInit'),10)||0; if(lots.length) o.lots=o.lots.concat(lots); splitRefus(get(rw,'refus')).forEach(function(x){ o.refus=o.refus||[]; if(o.refus.indexOf(x)<0) o.refus.push(x); }); }
  });
  return order.map(function(k){ return map[k]; });
}

function odEnsureFolder(){ return graph('POST','/me/drive/root/children', JSON.stringify({name:'Cave',folder:{}}), 'application/json').then(function(){},function(){}); }
function odPull(){
  if(!OD.token) return Promise.resolve(false);
  odStatus('off','Synchronisation OneDrive…');
  return odPullZones().then(function(){ return graph('GET','/me/drive/root:'+FILE_PATH+':/content'); }).then(function(r){
    if(r.status===404) return null;   // premier branchement de ce compte : on y dépose la cave locale
    if(!r.ok) throw new Error('absent');
    return r.text();
  }).then(function(csv){
    if(csv===null){ odPush(); return true; }
    var norm=csv.replace(/\r/g,'');
    if(norm!==OD.lastSnap){ var refs=parseCSV(norm); if(refs.length||S.refs.length===0){ S.refs=refs; localSave(); zonesAdopt(); } OD.lastSnap=norm; localStorage.setItem('od_snap',norm); }
    odStatus('ok','OneDrive synchronisé · cave-data.csv');
    return true;
  }).catch(function(){ odStatus('err','OneDrive indisponible'); return false; });
}
function odPush(){
  if(!OD.token) return;
  var csv=toCSV().replace(/\n/g,'\r\n');
  odStatus('off','Mise à jour OneDrive…');
  odEnsureFolder().then(function(){ return graph('PUT','/me/drive/root:'+FILE_PATH+':/content', csv, 'text/csv'); })
  .then(function(r){ if(!r.ok) throw new Error('upload'); OD.lastSnap=csv.replace(/\r\n/g,'\n'); localStorage.setItem('od_snap',OD.lastSnap); odStatus('ok','OneDrive synchronisé · cave-data.csv'); })
  .catch(function(){ odStatus('err','Échec de mise à jour OneDrive'); });
}

function b64url(a){ return btoa(String.fromCharCode.apply(null,a)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function odConnect(){
  if(!OD.clientId) OD.clientId=OD_DEFAULT_CLIENT;
  if(!OD.clientId){ toast('Renseignez votre Client ID (Réglages OneDrive)'); openCfg(); return; }
  localStorage.setItem('od_client',OD.clientId); localStorage.setItem('od_tenant',TENANT);
  var v=b64url(crypto.getRandomValues(new Uint8Array(32)));
  sessionStorage.setItem('pkce',v); localStorage.setItem('od_pkce',v);
  // Appli écran d'accueil : la connexion se fait dans une fenêtre ouverte par l'appli, pour que le jeton revienne bien dans l'appli (et pas dans Safari)
  var pop=null;
  if(isStandalone()){ try{ pop=window.open('about:blank','odlogin'); }catch(e){ pop=null; } }
  crypto.subtle.digest('SHA-256', new TextEncoder().encode(v)).then(function(h){
    var ch=b64url(new Uint8Array(h));
    var redir=location.origin+location.pathname;
    var url='https://login.microsoftonline.com/'+TENANT+'/oauth2/v2.0/authorize?response_type=code&client_id='+encodeURIComponent(OD.clientId)+'&redirect_uri='+encodeURIComponent(redir)+'&scope='+encodeURIComponent('Files.ReadWrite User.Read offline_access')+'&code_challenge='+ch+'&code_challenge_method=S256&state='+(pop?'popup':'page');
    if(pop){ pop.location.href=url; toast('Connectez-vous dans la fenêtre Microsoft, elle se fermera ensuite'); }
    else location.href=url;
  });
}
function odToken(body){
  return fetch('https://login.microsoftonline.com/'+TENANT+'/oauth2/v2.0/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:body})
    .then(function(r){ return r.json(); });
}
function odHandleCode(){
  var p=new URLSearchParams(location.search);
  var code=p.get('code'); if(!code) return false;
  var v=sessionStorage.getItem('pkce')||localStorage.getItem('od_pkce'); var st=p.get('state');
  history.replaceState(null,'',location.pathname);
  var redir=location.origin+location.pathname;
  odToken('client_id='+encodeURIComponent(OD.clientId)+'&grant_type=authorization_code&code='+encodeURIComponent(code)+'&redirect_uri='+encodeURIComponent(redir)+'&code_verifier='+encodeURIComponent(v))
  .then(function(t){
    localStorage.removeItem('od_pkce');
    if(t.access_token){
      OD.token=t.access_token; sessionStorage.setItem('od_token',OD.token); if(t.refresh_token) localStorage.setItem('od_refresh',t.refresh_token);
      if(st==='popup' && window.opener){ try{ window.opener.postMessage({cave:'od-ok'}, location.origin); }catch(e){} setTimeout(function(){ window.close(); },300); }
      odPull().then(render);
    }
    else toast('Connexion OneDrive refusée — vérifiez le Client ID et le type de compte');
  });
  return true;
}
function odRestore(force){
  if(OD.token && !force) return;
  odRefresh().then(function(ok){ if(ok) odPull().then(render); });
}
// Retour de la fenêtre de connexion (appli écran d'accueil)
window.addEventListener('message',function(e){ if(e.origin===location.origin && e.data && e.data.cave==='od-ok'){ OD.clientId=localStorage.getItem('od_client')||OD.clientId; odRestore(true); toast('OneDrive connecté'); closeDrawer(); } });

// Recherche tolérante : chaque mot significatif doit apparaître (sans accents, ordre libre) ; « domaine », « de », « la »… sont ignorés
var QSTOP=['domaine','le','la','les','de','du','des','d','l','et','un','une','vin','vins','bouteille','bouteilles','millesime','appellation'];
function matchQ(q,fields){
  var hay=noAcc(fields.join(' '));
  var words=noAcc(q).replace(/[’',;.!?]/g,' ').split(/\s+/).filter(function(w){ return w && QSTOP.indexOf(w)<0; });
  return words.every(function(w){ return hay.indexOf(w)>=0; });
}
function caveGrid(){

    return r.qte>0&&r.couleur===S.filter;
  });
  if(S.search){ list=list.filter(function(r){ return matchQ(S.search,[r.domaine,r.cuvee||'',r.region,r.appellation,r.millesime,r.cepages,r.couleur]); }); }

  document.getElementById('c-count').textContent=list.length+' référence'+(list.length>1?'s':'')+' · '+qsum(list)+' bouteille'+(qsum(list)>1?'s':'')+(S.sort==='reg'? ' · régions de la plus fournie à la moins fournie' : S.sort==='apo'? ' · par état d’apogée, les plus urgents d’abord' : ' · du plus ancien au plus récent');

    return '<div class="csec'+(cl?' closed':'')+'" id="sec-'+i+'"><button type="button" class="shd" data-fold="'+esc(String(s.k))+'" aria-expanded="'+(cl?'false':'true')+'"><span><span class="chev" aria-hidden="true">▾</span>'+esc(s.lab)+'</span><small>'+(S.filter==='Épuisées'? s.items.length+' réf.' : q+' bouteille'+(q>1?'s':''))+'</small></button><div class="group">'+s.items.map(refCard).join('')+'</div></div>';
  }).join('') : '<p class="empty">Aucune bouteille ne correspond.</p>';
  var fb=document.getElementById('c-fold');
  if(secs.length>1 && !S.search){
    var allClosed=secs.every(function(x){ return closed.indexOf(String(x.k))>=0; });
    fb.style.display=''; fb.textContent=allClosed? 'Tout déplier' : 'Tout replier';
    fb.onclick=function(){ setClosedKeys(allClosed? [] : secs.map(function(x){ return String(x.k); })); caveGrid(); };
  } else fb.style.display='none';
  document.querySelectorAll('[data-fold]').forEach(function(b){ b.onclick=function(){
    var k=b.getAttribute('data-fold'), c=closedKeys(), ix=c.indexOf(k);

    var sid=b.parentNode.id; setClosedKeys(c); caveGrid();
    var el=document.getElementById(sid), hh=parseInt(getComputedStyle(document.documentElement).getPropertyValue('--hh'),10)||0;
    if(el && el.getBoundingClientRect().top<hh) window.scrollTo(0, el.getBoundingClientRect().top+window.pageYOffset-hh);
  }; });
  bindCards();
}

function domKey(r){ return noAcc((r.domaine||'').replace(/^(domaine|château|chateau|maison|mas|clos|vignoble)s?\s+(de la |de l’|de l'|des |du |de )?/i,'')); }
function caveSections(list){
  var sorted=list.slice(), key, lab, short, order;
  if(S.sort==='mil'){
    key=function(r){ var m=/\d{4}/.exec(String(r.millesime||'')); return m? m[0] : 'SM'; };
    sorted.sort(function(a,b){ var ka=key(a), kb=key(b); if(ka==='SM') ka='9999'; if(kb==='SM') kb='9999'; return ka.localeCompare(kb) || domKey(a).localeCompare(domKey(b)); });
    lab=function(k){ return k==='SM'? 'Sans millésime' : 'Millésime '+k; }; short=function(k){ return k==='SM'? '—' : '’'+k.slice(2); };
  } else if(S.sort==='apo'){
    order={old:0,past:1,vite:2,ok:3,soon:4,early:5,none:6};
    key=apoState;
    sorted.sort(function(a,b){ var sa=apoState(a), sb=apoState(b); if(order[sa]!==order[sb]) return order[sa]-order[sb];
      if(sa==='none') return domKey(a).localeCompare(domKey(b));
      var ya=apYears(a), yb=apYears(b); return ((sa==='early'||sa==='soon')? ya.d-yb.d : ((ya.f||9999)-(yb.f||9999))) || domKey(a).localeCompare(domKey(b)); });
    lab=function(k){ return APOL[k]; }; short=function(k){ return {old:'Déclin',past:'Passé',vite:'Vite',ok:'Boire',soon:'Bientôt',early:'Tôt',none:'—'}[k]; };
  } else {
    var tot={}, cnt={};
    key=function(r){ return r.region||'Autre'; };
    list.forEach(function(r){ var k=key(r); tot[k]=(tot[k]||0)+Math.max(0,r.qte); cnt[k]=(cnt[k]||0)+1; });
    sorted.sort(function(a,b){ var ka=key(a), kb=key(b); return (tot[kb]-tot[ka]) || (cnt[kb]-cnt[ka]) || ka.localeCompare(kb) || domKey(a).localeCompare(domKey(b)); });
    lab=function(k){ return k; }; short=function(k){ return RSHORT[k]||k.slice(0,6); };
  }
  var out=[];
  sorted.forEach(function(r){ var k=key(r); if(!out.length||out[out.length-1].k!==k) out.push({k:k,lab:lab(k),short:short(k),items:[]}); out[out.length-1].items.push(r); });
  return out;
}

/* ===== v2.17 : moteur de suggestions « Que boire ce soir ? » =====
   Analyse de la demande (couleur, plat, occasion, budget, région, envie), table d’accords mets-vins,
   scoring : apogée + accord + cépage + région + note perso + stock (préservation des bouteilles uniques de garde),
   relaxation progressive des filtres, diversité des couleurs et justification de chaque suggestion. */
function normTxt(x){ return (''+(x==null?'':x)).toLowerCase()
  .replace(/à|â|ä|á|ã/g,'a').replace(/è|é|ê|ë/g,'e').replace(/ì|í|î|ï/g,'i')
  .replace(/ò|ó|ô|ö|õ/g,'o').replace(/ù|ú|û|ü/g,'u').replace(/ç/g,'c').replace(/œ/g,'oe'); }
var ACCORDS=[
 {re:/apero|aperitif/,pref:{'Rosé':12,'Effervescent':15,'Blanc':10,'Rouge':-4},hints:['chenin','chardonnay','grolleau','grenache','cinsault'],why:'pour l’apéritif, fraîcheur et bulles avant tout'},
 {re:/roti de veau|veau|escalope|cotelette/,pref:{'Rouge':12,'Blanc':6},hints:['pinot noir','gamay','merlot','syrah'],why:'un rouge souple et fruité accompagne le veau'},
 {re:/boeuf|entrecote|agneau|gibier|chevreuil|sanglier|civet|pigeon|magret|canard|daube|carbonnade/,pref:{'Rouge':16},hints:['syrah','cabernet','malbec','tannat','mourvedre','corbieres','bandol'],why:'un rouge structuré et tannique fera le contrepoint'},
 {re:/poulet|volaille|dinde|pintade|risotto|champignon|truffe|cepe|creme/,pref:{'Blanc':10,'Rouge':8},hints:['chardonnay','chenin','pinot noir','viognier'],why:'un blanc rond ou un rouge tendre fera l’affaire'},
 {re:/poisson|cabillaud|saumon|dorade|lotte|sole/,pref:{'Blanc':14},hints:['muscadet','chablis','sauvignon','chardonnay','riesling','aligote','picpoul'],why:'un blanc sec et vif sublimera le poisson'},
 {re:/huitre|fruits? de mer|crustace|crevette|moule|coquillage|langoustine|bulot/,pref:{'Blanc':14,'Effervescent':8},hints:['muscadet','chablis','sauvignon','aligote','picpoul'],why:'fruits de mer : blanc vif ou bulles'},
 {re:/chevre/,pref:{'Blanc':12},hints:['sauvignon','chenin'],why:'le chèvre aime l’acidité d’un blanc'},
 {re:/fromage/,pref:{'Rouge':8,'Blanc':8},hints:['pinot noir','gamay','chenin','chardonnay'],why:'fromage : rouge souple ou blanc évolué'},
 {re:/bleu|roquefort|fourme/,pref:{'Blanc':10,'Effervescent':6},sweet:1,hints:['sauternes','jurancon','monbazillac','gaillac'],why:'un vin doux équilibre le salé des pâtes bleues'},
 {re:/dessert|chocolat|gateau|tarte|soupe de fruits|sucre/,pref:{'Rouge':-8},sweet:1,why:'côté dessert, on penche vers un vin doux'},
 {re:/foie gras/,pref:{'Blanc':10},sweet:1,hints:['sauternes','jurancon','monbazillac'],why:'foie gras et moelleux, un classique'},
 {re:/asiatique|indien|epice|thai|curry|chinois|ramen|cuisine du monde|wasabi/,pref:{'Blanc':10,'Rosé':8},hints:['gewurztraminer','riesling','pinot gris','muscat','arbois'],why:'les plats épicés préfèrent des blancs aromatiques'},
 {re:/pizza|pates|tomate|italien|italie|osso buco/,pref:{'Rouge':10},hints:['grenache','syrah','sangiovese','barbera','cinsault'],why:'un rouge gouleyant et fruité'},
 {re:/barbecue|grillade|merguez|saucisse|cote grillee/,pref:{'Rouge':12,'Rosé':6},hints:['syrah','grenache','malbec','cabernet'],why:'le grillé veut du fruit et de l’énergie'},
 {re:/ete|soleil|terrasse|jardin|salade|picnic|pique nique|chaleur/,pref:{'Rosé':10,'Blanc':8,'Effervescent':6},hints:['provence','grolleau','chenin'],why:'par ce temps, fraîcheur avant tout'},
 {re:/fete|noel|reveillon|anniversaire|mariage|grande occasion/,pref:{'Effervescent':16,'Blanc':6},hints:['champagne','cremant','bulle'],why:'une grande occasion, des bulles'},
 {re:/porc|andouillette|cassoulet|charcuterie|terrine/,pref:{'Rouge':10},hints:['malbec','cabernet','syrah','gamay','chenin'],why:'ces plats tolèrent un rouge solide mais sans raideur'}
];
var APOSCORE={ok:26,vite:22,soon:14,none:6,past:-22,old:-32,early:-16};
function recoSoir(t){
  var pool=current(); if(!pool.length) return 'Votre cave est vide — commencez par ajouter quelques bouteilles !';
  var s=normTxt(t);
  var wanted=[];
  if(/rouge/.test(s)) wanted.push('Rouge');
  if(/blanc/.test(s)) wanted.push('Blanc');
  if(/\brose?s?\b/.test(s)) wanted.push('Rosé');
  if(/champagne|effervescent|bulles|cremant|mousseux/.test(s)) wanted.push('Effervescent');
  var mB=s.match(/(?:moins de|en dessous de|maximum|max de|budget de)\s*(\d+)/)||s.match(/(\d+)\s*(?:€|euros?\b)/);
  var bud=mB? parseFloat(mB[1]) : null;
  var wantGarde=/de garde|garder|puissan|riche|corpulen|massif|tanique|concentre/.test(s);
  var wantLeger=/leger|legere|frais|fraicheur|gourmand|de soif|estiv/.test(s);
  var wantNow=/maintenant|ce soir|pret|apogee|a boire/.test(s);
  var isSurprise=/surprise|hasard|choisis|inspire|decide/.test(s);
  var why=[], relax=[], pref={'Rouge':0,'Blanc':0,'Rosé':0,'Effervescent':0}, sweet=0, hints=[];
  ACCORDS.forEach(function(a){ if(a.re.test(s)){ why.push(a.why); for(var k in a.pref) pref[k]+=a.pref[k]; if(a.sweet) sweet=1; hints=hints.concat(a.hints||[]); } });
  var reg=null; REGIONS.forEach(function(rg){ if(!reg && rg!=='Autre' && s.indexOf(normTxt(rg))>=0) reg=rg; });
  var picks=pool.slice();
  if(bud!=null){ var fb=picks.filter(function(r){ var p=parseFloat(r.prix); return p>0 && p<=bud; }); if(fb.length) picks=fb; else relax.push('rien sous '+bud+' € en cave, j’élargis le budget'); }
  if(wanted.length){ var fw=picks.filter(function(r){ return wanted.indexOf(r.couleur)>=0; }); if(fw.length) picks=fw; else relax.push('pas de '+wanted.join(' ni de ')+' disponible, j’élargis aux autres couleurs'); }
  if(wantNow){ var fn=picks.filter(function(r){ var st=apoState(r); return st==='ok'||st==='vite'||st==='none'; }); if(fn.length) picks=fn; else relax.push('rien à maturité parfaite, je signale les plus prêtes'); }
  var scored=picks.map(function(r){
    var st=apoState(r), sc=APOSCORE[st]||0, rs=[];
    sc+=pref[r.couleur]||0;
    if(sweet && (r.style==='moelleux'||r.style==='vdn'||r.style==='jaune'||r.style==='paille')){ sc+=14; rs.push('profil doux adapté'); }
    var hay=normTxt(r.cepages)+' '+normTxt(r.appellation);
    for(var i=0;i<hints.length;i++){ if(hints[i] && hay.indexOf(hints[i])>=0){ sc+=9; rs.push('cépage adapté ('+hints[i]+')'); break; } }
    if(reg && r.region===reg){ sc+=14; rs.push('région citée'); }
    if(wantGarde){ if(isLongGarde(r)) sc+=12; if(st==='early') sc+=12; }
    if(wantLeger && (r.couleur!=='Rouge' || !isLongGarde(r))) sc+=5;
    if(isLongGarde(r) && r.qte===1 && st!=='vite' && st!=='past' && picks.length>2) sc-=8;
    if(r.note && (''+r.note).length>2) sc+=3;
    if(r.qte>=3) sc+=4; else if(r.qte===1) sc-=1;
    if(isSurprise) sc+=Math.random()*8;
    return {r:r,sc:sc,st:st,rs:rs};
  });
  scored.sort(function(a,b){ return b.sc-a.sc; });
  var seen={}, dedup=[];
  scored.forEach(function(x){ var k=normTxt(nomVin(x.r))+'|'+x.r.millesime; if(seen[k]) return; seen[k]=1; dedup.push(x); });
  var res=[], usedCol={};
  for(var i=0;i<dedup.length && res.length<3;i++){
    var x=dedup[i];
    if(usedCol[x.r.couleur] && dedup.length-i>3-res.length) continue;
    res.push(x); usedCol[x.r.couleur]=1;
  }
  if(!res.length) return 'Je n’ai rien trouvé de tel en stock. Essayez autre chose — ou consultez l’écran Ma cave !';
  var intro=(isSurprise? 'Tirage au sort parmi les meilleures options' : (why.length? 'Très bien — '+why.slice(0,2).join(' ; ')+'. Voici mes suggestions' : 'Voici ce que je vous propose ce soir'));
  if(reg) intro+=' (côté '+reg+')';
  var out=intro+' :'+(relax.length? '\n\nℹ️ '+relax.join(' ; '):'')+'\n\n';
  res.forEach(function(x,i){
    var r=x.r;
    out+='<b>'+(i+1)+'. '+esc(nomVin(r))+(r.millesime? ' '+esc(r.millesime):'')+'</b> — '+esc(r.appellation||r.region||'')+(r.region? ' · '+esc(r.region):'')+' ('+esc(r.couleur)+')\n';
    var bits=[];
    if(x.st==='ok') bits.push('✔ à son apogée ('+esc(r.apogee)+')');
    else if(x.st==='vite') bits.push('à ouvrir sans attendre ('+esc(r.apogee)+')');
    else if(x.st==='soon') bits.push('bientôt prêt ('+esc(r.apogee)+')');
    else if(x.st==='past') bits.push('apogée dépassée — à goûter');
    else if(x.st==='old') bits.push('apogée dépassée depuis longtemps — à goûter sans tarder');
    else if(x.st==='early') bits.push('encore jeune'+(r.apogee? ' (apogée '+esc(r.apogee)+')':''));
    else bits.push('sans fenêtre d’apogée renseignée');
    if(x.rs.length) bits.push(x.rs.join(' · '));
    if(r.note) bits.push('votre note : « '+esc((''+r.note).slice(0,60))+' »');
    out+=bits.join(' · ')+'\n';
    out+='×'+r.qte+' en stock'+(r.prix? ' · '+esc(r.prix)+' €':'')+' · '+locTxt(r)+'\n\n';
  });
  return out+'Bonne dégustation ! 🥂';
}

var VOICE=null;
function voiceBar(on,txt){

function joinResults(results){
  // Assemble les segments ; si un segment reprend le précédent (doublon fréquent sur mobile), on garde le plus long
  var parts=[];
  for(var i=0;i<results.length;i++){
    var t=String(results[i][0].transcript||'').trim(); if(!t) continue;
    var last=parts[parts.length-1];
    if(last && t.toLowerCase().indexOf(last.toLowerCase())===0) parts[parts.length-1]=t;
    else if(last && last.toLowerCase().indexOf(t.toLowerCase())===0) continue;
    else parts.push(t);
  }
  return parts.join(' ');
}
function voiceSession(opts){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ opts.onFail && opts.onFail('absent'); return null; }
  var ss={ committed:opts.prefix||'', current:'', active:true, done:false, rec:null, timer:null, restarts:0, heard:false };
  function full(){ return (ss.committed+' '+ss.current).replace(/\s+/g,' ').trim(); }
  function finish(){
    if(ss.done) return; ss.done=true; ss.active=false; clearTimeout(ss.timer);
    VOICE=null; voiceBar(false);
    // Micro de l'appli indisponible (refusé, non pris en charge…) et rien entendu → dictée par le clavier
    if(ss.failed && !ss.heard && opts.onFail){ opts.onFail(ss.failed); return; }
    opts.onDone && opts.onDone(full(), ss.heard);
  }
  function arm(ms){ clearTimeout(ss.timer); if(ms) ss.timer=setTimeout(function(){ ss.stop(); }, ms); }
  function startRec(){
    var rec=new SR(); rec.lang='fr-FR'; rec.continuous=true; rec.interimResults=true; rec.maxAlternatives=1;
    rec.onresult=function(e){
      ss.current=joinResults(e.results); ss.heard=true;
      var f=full(); voiceBar(true,f); opts.onText && opts.onText(f);
      arm(opts.silenceMs);
    };
    rec.onerror=function(e){
      if(e.error==='no-speech' || e.error==='aborted') return;
      ss.active=false; ss.failed=e.error;
    };
    rec.onend=function(){
      ss.committed=full(); ss.current='';
      if(ss.active && ss.restarts<30){ ss.restarts++; try{ startRec(); }catch(err){ finish(); } }
      else finish();
    };
    ss.rec=rec; rec.start();
  }
  ss.stop=function(){
    if(ss.done) return; ss.active=false; clearTimeout(ss.timer);
    try{ ss.rec.stop(); }catch(e){ finish(); return; }
    setTimeout(finish,1500); // filet de sécurité si le navigateur ne renvoie pas « onend »
  };
  try{ startRec(); }catch(err){ opts.onFail && opts.onFail('start'); return null; }
  voiceBar(true,opts.prefix||'');
  arm(opts.firstMs||8000); // rien entendu au bout de 8 s → arrêt
  return ss;
}

/* --- Nombres dits en lettres (utilisés seulement dans les champs chiffrés) --- */
var NUMW={'zéro':0,'zero':0,'un':1,'une':1,'deux':2,'trois':3,'quatre':4,'cinq':5,'six':6,'sept':7,'huit':8,'neuf':9,'dix':10,'onze':11,'douze':12,'treize':13,'quatorze':14,'quinze':15,'seize':16,'vingt':20,'vingts':20,'trente':30,'quarante':40,'cinquante':50,'soixante':60,'cent':100,'cents':100,'mille':1000};
function frWordsToDigits(s){
  var toks=String(s||'').split(/([\s-]+)/), out=[], run=[], runRaw=[];
  function flush(){
    if(!run.length) return;
    while(run.length && run[run.length-1]==='et'){ run.pop(); }
    var total=0, cur=0, prev=null;
    run.forEach(function(w){ if(w==='et') return; var v=NUMW[w];
      if(v===1000){ total+=(cur||1)*1000; cur=0; }
      else if(v===100){ cur=(cur||1)*100; }
      else if(v===20 && prev==='quatre'){ cur=cur-4+80; }
      else cur+=v;
      prev=w; });
    var tail=[]; while(runRaw.length && /^(et|[\s-]+)$/i.test(runRaw[runRaw.length-1])){ tail.unshift(runRaw.pop()); }
    out.push(String(total+cur)); out=out.concat(tail); run=[]; runRaw=[];
  }
  toks.forEach(function(tk){
    var w=tk.toLowerCase();
    if(NUMW.hasOwnProperty(w)){ run.push(w); runRaw.push(tk); }
    else if(run.length && (/^[\s-]+$/.test(tk) || w==='et')){ if(w==='et') run.push('et'); runRaw.push(tk); }
    else { flush(); out.push(tk); }
  });
  flush();
  return out.join('');
}
function firstNum(s){ if(!s) return null; var m=/(\d+)/.exec(frWordsToDigits(s)); return m? parseInt(m[1],10) : null; }
function years(s){ if(!s) return []; var out=[], re=/(19\d{2}|20\d{2})/g, m, x=frWordsToDigits(s); while((m=re.exec(x))) out.push(m[1]); return out; }
function capFr(x){
  if(!x) return x;
  var small=['de','du','des','la','le','les','et','sur','en','au','aux','sous'];
  return x.split(/(\s+|-)/).map(function(w,i){
    if(!w || /^(\s+|-)$/.test(w)) return w;
    var lw=w.toLowerCase();
    if(i>0 && small.indexOf(lw)>=0) return lw;
    var ap=/^([dl])[’'](.+)$/i.exec(w);
    if(ap) return (i>0? ap[1].toLowerCase() : ap[1].toUpperCase())+'’'+ap[2].charAt(0).toUpperCase()+ap[2].slice(1);
    return w.charAt(0).toUpperCase()+w.slice(1);
  }).join('');
}
function noAcc(x){ return String(x||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase(); }

  var h='<span class="eyebrow">Sortie</span><h3 style="margin:4px 0 2px">'+esc(nomVin(ref))+' '+esc(ref.millesime)+'</h3><p class="hint">'+esc(ref.appellation)+' · '+esc(locTxt(ref))+' · en stock : ×'+ref.qte+'</p>';
  if(msg) h+='<p class="hint" style="margin-top:6px">'+esc(msg)+'</p>';
  if(ref.qte<=0){ h+='<p class="hint" style="color:var(--red);margin-top:12px">Cette référence est déjà épuisée.</p>'; drawerOpen(h); return; }
  h+='<div class="stepper"><button type="button" id="so-m">−</button><b class="mono" id="so-n">'+n+'</b><button type="button" id="so-p">+</button></div>';
  h+='<div class="formfoot"><button class="btn" id="so-ok">Sortir</button><button class="btn sec" id="so-no">Annuler</button></div>';
  drawerOpen(h);
  function upd(){ document.getElementById('so-n').textContent=n; }
  document.getElementById('so-m').onclick=function(){ if(n>1){ n--; upd(); } };
  document.getElementById('so-p').onclick=function(){ if(n<ref.qte){ n++; upd(); } };
  document.getElementById('so-no').onclick=closeDrawer;
  document.getElementById('so-ok').onclick=function(){ ref.qte=Math.max(0,ref.qte-n); closeDrawer(); toast(ref.qte===0? 'Dernière bouteille sortie — fiche conservée (épuisée)' : n+' bouteille'+(n>1?'s':'')+' sortie'+(n>1?'s':'')+' · reste '+ref.qte); save(); };
}
function aiResults(r,text){
  var list=(r.resultats||[]).map(refById).filter(Boolean);
  var h='<span class="eyebrow">Recherche</span><h3 style="margin:4px 0 6px">« '+esc(text)+' »</h3>';
  if(r.message) h+='<p style="margin-bottom:12px;font-size:14.5px">'+esc(r.message)+'</p>';
  h+=list.length? '<div class="group">'+list.map(refCard).join('')+'</div>' : '<p class="hint">Aucune bouteille ne correspond.</p>';
  drawerOpen(h); bindCards();
}

/* Écoute générique : micro de l'appli ou dictée du clavier, puis texte final */
function listen(o){
  if(VOICE){ VOICE.stop(); return; }
  function kb(reason){ keyDictate({ title:o.title, ok:o.ok||'Valider', rows:o.rows||4, prefix:o.prefix, reason:reason, help:o.help, onDone:function(t){ if(t) o.done(t); } }); }
  if(useKeyboard()){ kb(voiceMode()==='clavier'? '' : failMsg('absent')); return; }
  VOICE=voiceSession({ prefix:o.prefix, silenceMs:o.silence||3000, firstMs:10000, onFail:function(r){ kb(failMsg(r)); }, onText:o.live,
    onDone:function(t,heard){ if(t) o.done(t); else if(!heard) toast('Rien entendu'); } });
}

/* ===== v2.6 : dictée hybride (analyse locale immédiate + affinage IA en arrière-plan),
   origine de chaque champ, et correction champ par champ ===== */
var FIDS={ domaine:'f-domaine', cuvee:'f-cuvee', couleur:'f-couleur', region:'f-region', appellation:'f-appellation', millesime:'f-millesime', cepages:'f-cepages', qte:'f-qte', zone:'f-zone', etagere:'f-etagere', dateEntree:'f-date', apogee:'f-apogee', prix:'f-prix', note:'f-note' };
var FLABEL={ domaine:'Domaine', cuvee:'Cuvée', couleur:'Couleur', region:'Région', appellation:'Appellation', millesime:'Millésime', cepages:'Cépage(s)', qte:'Quantité', zone:'Emplacement', etagere:'Étagère', dateEntree:'Date d’entrée', apogee:'Apogée', prix:'Prix d’achat', note:'Note' };
var FPROMPT={ domaine:'Domaine : redites le nom du producteur', cuvee:'Cuvée : redites le nom de la cuvée', couleur:'Couleur : rouge, blanc, rosé ou effervescent ?', region:'Région : redites la région', appellation:'Appellation : redites-la', millesime:'Millésime : redites l’année', cepages:'Cépage(s) : redites-les', qte:'Quantité : combien de bouteilles ?', zone:'Emplacement : « étagère 3 » ou « garage »', etagere:'Emplacement : « étagère 3 » ou « garage »', dateEntree:'Date d’entrée : mois et année', apogee:'Apogée : « 2026 à 2032 »', prix:'Prix d’achat : combien ?', note:'Note personnelle : dictez-la' };
var FKEY={ domaine:'domaine', cuvee:'cuvée', couleur:'couleur', region:'région', appellation:'appellation', millesime:'millésime', cepages:'cépage', qte:'quantité', zone:'emplacement', etagere:'emplacement', dateEntree:'date d’entrée', apogee:'apogée', prix:'prix', note:'note' };
var PROV={ dicte:['✅','dicté'], deduit:['🔮','estimé par l’IA'], ia:['🤖','corrigé par l’IA'], inao:['📚','référentiel'], regle:['📖','table de garde'] };
S.prov={}; S.provOld={}; S.userEdited={}; S.aiTok=0;

function resetProv(){ S.prov={}; S.provOld={}; S.userEdited={}; S.aiMsg=''; S.aiTok++; }
function getField(k){ var el=document.getElementById(FIDS[k]); return el? el.value : ''; }
function normVal(k,v){
  if(v===null||v===undefined) return null;
  v=String(v).trim(); if(!v) return null;
  if(k==='region'){ var r=REGIONS.find(function(x){ return noAcc(x)===noAcc(v); }); return r||null; }
  if(k==='couleur'){ var c=COULEURS.find(function(x){ return noAcc(x)===noAcc(v); }); return c||null; }
  if(k==='zone'){ var zf=zoneFromText(v); return zf? zf.id : null; }
  if(k==='etagere'){ var n=parseInt(v,10); return (n>=1&&n<=maxEt())? String(n) : null; }
  if(k==='qte'){ var q=parseInt(v,10); return q>0? String(q) : null; }
  if(k==='prix') return v.replace('.',',').replace(/\s*€$/,'');
  return v;
}
function sameVal(k,a,b){ return noAcc(String(a||'')).replace(/[\s–-]+/g,' ').trim()===noAcc(String(b||'')).replace(/[\s–-]+/g,' ').trim(); }
function setField(k,v){
  var el=document.getElementById(FIDS[k]); if(!el) return false;
  v=normVal(k,v); if(v===null) return false;
  if(k==='etagere'){ var z=document.getElementById('f-zone'); if(z && !(zoneById(z.value).et>=parseInt(v,10))){ var zw=ZONES.find(function(x){ return x.et>=parseInt(v,10); }); if(zw){ z.value=zw.id; z.dispatchEvent(new Event('change')); } } }
  el.value=v;
  if(k==='zone'){ el.dispatchEvent(new Event('change')); if(!zoneById(v).et){ var et=document.getElementById('f-etagere'); if(et) et.value=''; delete S.prov.etagere; } }
  if(k==='apogee'){ el.dispatchEvent(new Event('change')); }
  return true;
}
// Remplit le formulaire avec des valeurs d'une origine donnée, sans toucher aux champs retouchés à la main
function applyVals(V,origin){
  if(!document.getElementById('f-domaine')) return 0;
  var n=0;
  Object.keys(FIDS).forEach(function(k){
    var v=V[k]; if(v===null||v===undefined||v==='') return;
    if(S.userEdited[k]) return;
    if(S.prov[k]==='ia' && S.provOld[k] && sameVal(k,normVal(k,v),normVal(k,S.provOld[k]))) return; // déjà corrigé par l'IA
    if(S.prov[k]==='ia' && sameVal(k,getField(k),normVal(k,v))) return;
    if(setField(k,v)){ S.prov[k]=origin; n++; }
  });
  renderProv(); return n;
}
// Fusion du résultat de l'IA : 🤖 si l'IA change ou ajoute une valeur dite, 🔮 si elle la déduit
function mergeAI(f,ded){
  if(!document.getElementById('f-domaine')) return 0;
  ded=ded||[]; var changes=0;
  Object.keys(FIDS).forEach(function(k){
    if(S.userEdited[k]) return;
    var v=normVal(k,f[k]); if(v===null) return;
    var cur=getField(k), isDed=ded.indexOf(k)>=0;
    if(sameVal(k,cur,v)){
      // même mot, mais accents / majuscules corrigés par l'IA (« Noels » → « Noëls »)
      if(cur!==v && /^(domaine|cuvee|appellation|cepages)$/.test(k)){ S.provOld[k]=cur; setField(k,v); S.prov[k]='ia'; changes++; return; }
      if(!S.prov[k]) S.prov[k]= isDed? 'deduit' : 'ia';   // valeur par défaut confirmée par l'IA
      return;
    }
    if(S.prov[k]==='dicte' && isDed) return;           // on ne remplace jamais du dicté par une déduction
    var old=cur;
    if(setField(k,v)){ S.prov[k]= isDed? 'deduit' : 'ia'; if(old && S.prov[k]==='ia') S.provOld[k]=old; changes++; }
  });
  renderProv(); return changes;
}
function renderProv(){
  Object.keys(FIDS).forEach(function(k){
    var b=document.getElementById('p-'+k); if(!b) return;
    var p=S.prov[k];
    if(!p){ b.innerHTML=''; b.className='prov'; b.title=''; return; }
    b.className='prov prov-'+p; b.textContent=PROV[p][0]+' '+PROV[p][1];
    b.title= p==='ia' && S.provOld[k]? 'Avant correction : « '+S.provOld[k]+' »' : PROV[p][1];
    if((p==='ia'||p==='inao') && S.provOld[k]) b.title='Avant correction : « '+S.provOld[k]+' »';
    b.onclick= ((p==='ia'||p==='inao') && S.provOld[k])? function(){ toast('Avant correction : « '+S.provOld[k]+' »'); } : null;
  });
  var lg=document.getElementById('a-legend'); if(lg) lg.style.display=Object.keys(S.prov).length? 'block':'none';
}

}

/* --- Affinage IA d'une fiche en cours --- */
function refineForm(t){
  domAssist();                                   // domaine rapproché des domaines connus (📚)
  var dejaEnCave=localReassortHint();            // même vin déjà en cave → proposition de réassort, sans IA
  if(!aiOn()){ aiState(''); enrichForm(false); return; }
  if(localComplete()){                           // domaine + appellation INAO + millésime : pas besoin de l'IA pour comprendre la phrase
    S.aiMsg='✔ Fiche comprise en local — aucun appel IA'+(dejaEnCave?' · vin déjà en cave':'');
    aiState(S.aiMsg); enrichForm(false); return;
  }
  var tok=++S.aiTok;
  aiState('<span class="spin sm"></span> 🤖 Affinage par l’IA en cours… (la fiche est déjà utilisable)');
  aiAsk('ajout',t).then(function(r){
    if(tok!==S.aiTok || !document.getElementById('f-domaine')) return;
    var it=r.intention||'ajout';
    if(it==='sortie' && refById(r.refId)){ var rf=refById(r.refId); aiState(''); suggest('🤖 L’IA a compris une <b>sortie</b> : '+esc(nomVin(rf)+' '+rf.millesime),'Sortir',function(){ confirmOut(rf,Math.max(1,parseInt(r.qte,10)||1)); }); return; }
    if(it==='reassort' && refById(r.refId)){ var rr=refById(r.refId); suggest('🤖 Déjà en cave : '+esc(nomVin(rr)+' '+rr.millesime)+' (×'+rr.qte+')','Réassort +'+(Math.max(1,parseInt(r.qte,10)||1)),function(){ restock(rr.id,Math.max(1,parseInt(r.qte,10)||1)); }); }
    var n=mergeAI(r.fiche||{}, r.deduits); inaoAssist('');
    var ded=Object.keys(S.prov).filter(function(k){ return S.prov[k]==='deduit'; }).length;
    S.aiMsg='🤖 Fiche affinée par l’IA'+(n? ' · '+n+' champ'+(n>1?'s':'')+' corrigé'+(n>1?'s':'')+' ou complété'+(n>1?'s':'') : ' · rien à corriger');
    aiState(S.aiMsg);
    enrichForm(false);   // 2e temps : compléments (apogée, prix estimé, cépages, région, couleur, appellation)
  }).catch(function(e){
    if(tok!==S.aiTok) return;
    aiState('IA indisponible ('+esc(aiNetMsg(e))+') — analyse locale conservée');
  });
}

/* --- Correction d'un seul champ --- */
function parseField(k,t){
  if(k==='domaine'){ var dd=String(t).trim().replace(/^(le |la )?producteur\s*[:,]?\s*/i,'').replace(/[.,;]+$/,''); return dd? capFr(dd) : null; }
  if(k==='cuvee'){ var cv=String(t).trim().replace(/^(la )?cuv[ée]e\s*[:,]?\s*/i,'').replace(/[.,;]+$/,''); return cv? capFr(cv) : null; }
  var clean=String(t).replace(/^\s*(le |la |l’|l')?(domaine|producteur|appellation|région|region|couleur|millésime|millesime|cépages?|cepages?|quantité|quantite|emplacement|apogée|apogee|prix( d[’']achat)?|note( personnelle)?|date( d[’']entrée)?)\s*[:,]?\s*/i,'');
  if(k==='domaine'){ var d=clean.replace(/^(de|du|des)\s+|^d[’']\s*/i,'').replace(/[.,;]+$/,''); return d? capFr(d) : null; }
  if(k==='appellation'){ var a=clean.replace(/[.,;]+$/,'').replace(/\s+(rouges?|blancs?|ros[ée]s?)$/i,''); return a? capFr(a) : null; }
  if(k==='note'){ var n=clean.replace(/[\s.]+$/,''); return n? n.charAt(0).toUpperCase()+n.slice(1) : null; }
  var V=parseDictation(FKEY[k]+' '+clean);
  if(k==='zone'||k==='etagere'){ if(V.etagere) return {zone:V.zone,etagere:V.etagere}; if(V.zone) return {zone:V.zone}; var en=firstNum(clean), zw=en? ZONES.find(function(x){ return x.et>=en; }) : null; if(zw) return {zone:zw.id,etagere:en}; return null; }
  if(k==='region' && !V.region){ var r=REGIONS.find(function(x){ return noAcc(clean).indexOf(noAcc(x))>=0; }); return r||null; }
  if(k==='cepages'){ return clean? (CEPS? cepNormalize(clean) : (V.cepages||capFr(clean))) : null; }
  if(k==='qte' && V.qte==null){ return firstNum(clean); }
  if(k==='millesime' && !V.millesime){ return years(clean)[0]||null; }
  if(k==='apogee' && !V.apogee){ var y=years(clean); return y.length>1? y[0]+' – '+y[1] : (y[0]||null); }
  if(k==='dateEntree' && !V.dateEntree){ return parseMonthYear('date '+clean); }
  return V[k];
}
function fieldDictate(k){
  if(VOICE){ VOICE.stop(); return; }
  listen({ title:FPROMPT[k], ok:'Valider', rows:2, silence:2200,
    help:'Seul ce champ sera modifié.',
    done:function(t){
      var v=parseField(k,t);
      if(v===null||v===undefined||v===''){ toast('Pas compris pour « '+FLABEL[k]+' » : « '+t+' »'); return; }
      var keys=(typeof v==='object')? v : (function(){ var o={}; o[k]=v; return o; })();
      Object.keys(keys).forEach(function(kk){ delete S.userEdited[kk]; delete S.provOld[kk]; if(setField(kk,keys[kk])) S.prov[kk]='dicte'; });
      renderProv(); if(k==='appellation') inaoAssist('');
      var el=document.getElementById(FIDS[k]); if(el){ el.classList.add('flash'); setTimeout(function(){ el.classList.remove('flash'); },900); }
      toast(FLABEL[k]+' : '+(typeof v==='object'? (zoneById(v.zone).nom+(v.etagere?' étagère '+v.etagere:'')) : v));
      // noms propres : l'IA peut corriger l'orthographe en arrière-plan
      if(aiOn() && (k==='domaine'||k==='cuvee'||k==='appellation'||k==='cepages')){
        var tok=++S.aiTok;
        aiCall(FKEY[k]+' '+t,'ajout').then(function(r){
          if(tok!==S.aiTok) return; var f=r.fiche||{}; var nv=normVal(k,f[k]); if(!nv||S.userEdited[k]) return;
          var cur=getField(k); if(sameVal(k,cur,nv)) return;
          S.provOld[k]=cur; setField(k,nv); S.prov[k]='ia'; renderProv(); toast('🤖 '+FLABEL[k]+' corrigé : '+nv);
        }).catch(function(){});
      }
    } });
}

/* --- Assistant global : action locale immédiate, IA en arrière-plan --- */
var QWORDS=['quel','quels','quelle','quelles','combien','cherche','trouve','montre','liste','affiche'];
function localIntent(t){
  var x=noAcc(t).replace(/[’']/g,' ');
  if(/\?/.test(t) || /^(quel|quels|quelle|quelles|qu est|est ce|combien|ai je|est ce que|cherche|trouve|montre|liste|affiche|y a t il|il me reste|reste t il|qu ai je)/.test(x.trim()) || /\ba boire\b/.test(x)) return 'recherche';
  if(/\b(ouvert|ouverte|ouvre|ouvrir|bu|bue|bois|sorti|sortie|sors|sortir|debouche|deboucher|offert|offre|termine|fini|entame)\b/.test(x)) return 'sortie';
  if(/\b(rajoute|rajouter|reassort|encore|en plus|supplementaires?|rachete|rachat)\b/.test(x)) return 'reassort';
  return 'ajout';
}
var RSTOP=['domaine','le','la','les','de','du','des','d','l','et','un','une','deux','trois','quatre','cinq','six','sept','huit','neuf','dix','bouteille','bouteilles','ai','j','je','viens','vient','ouvert','ouverte','ouvre','bu','bue','bois','sorti','sortie','sors','rajoute','rajouter','encore','plus','en','ce','soir','hier','midi','avec','pour','chateau','clos','vin','rouge','blanc','rose'];

/* ===== v2.8 : référentiel INAO embarqué (hors ligne), mémoire des réponses IA, compléments allégés ===== */
var INAO=null, INAO_TRI=null, CEPS=null;
function inaoNorm(x){ return noAcc(x).replace(/[’'\-]/g,' ').replace(/\b(aoc|aop|igp|appellation|d origine|controlee|protegee)\b/g,' ').replace(/\s+/g,' ').trim(); }
// Forme « phonétique » simplifiée pour rapprocher les coquilles de dictée (sira/syrah, lefleve/leflaive)
function phon(x){ return String(x||'').replace(/ph/g,'f').replace(/qu/g,'k').replace(/c(?=[aou])/g,'k').replace(/ch/g,'sh').replace(/g(?=[ei])/g,'j').replace(/h/g,'').replace(/y/g,'i')
  .replace(/eau|au/g,'o').replace(/ai|ei/g,'e').replace(/oi/g,'wa').replace(/z/g,'s').replace(/(.)\1+/g,'$1').replace(/([a-z]{3,})[estx]\b/g,'$1'); }
function simil(a,b){ var d=dice(tri(a),tri(b)), p=dice(tri(phon(a)),tri(phon(b))); return Math.max(d,p); }
function coreName(x){ return inaoNorm(x).replace(/^(domaine|chateau|clos|mas|maison|cave|cellier)\s+(de la |de l |des |du |de |d )?/,''); }
function tri(s){ s='  '+s.replace(/\s+/g,'')+' '; var o={}; for(var i=0;i<s.length-2;i++) o[s.substr(i,3)]=1; return o; }
function dice(a,b){ var n=0,la=0,lb=0,k; for(k in a){ la++; if(b[k]) n++; } for(k in b) lb++; return la+lb? 2*n/(la+lb) : 0; }
function inaoLoad(){
  if(INAO) return Promise.resolve(INAO);
  return fetch('./inao.json').then(function(r){ if(!r.ok) throw new Error('absent'); return r.json(); }).then(function(d){
    // a : appellations {n nom, c couleurs, r région, t AOC|IGP, x:0 si couleurs incomplètes, al alias}
    INAO=(d.a||[]).map(function(x){ var e=Array.isArray(x)? {n:x[0],c:x[1],r:x[2],t:x[3]} : x; e.c=e.c||[]; e.r=e.r||''; e.w=inaoNorm(e.n); e.aw=(e.al||[]).map(inaoNorm); return e; });
    INAO_TRI=INAO.map(function(e){ return [tri(e.w)].concat(e.aw.map(tri)); });
    // g : cépages [nom, couleur de baie, synonymes]
    GARDE=d.d||null;
    CEPS=(d.g||[]).map(function(g){ return { n:g[0], k:g[1], w:[g[0]].concat(g[2]||[]).map(inaoNorm) }; });
    var dl=document.getElementById('inao-list'); if(dl) dl.innerHTML=INAO.map(function(e){ return '<option value="'+esc(e.n)+'">'; }).join('');
    var dc=document.getElementById('cep-list'); if(dc) dc.innerHTML=CEPS.map(function(c){ return '<option value="'+esc(c.n)+'">'; }).join('');
    return INAO;
  }).catch(function(){ INAO=null; return null; });
}
// Appellations INAO les plus proches d'un texte (tolère les fautes de dictée)
function inaoMatch(s,n){
  if(!INAO||!s) return [];
  var q=inaoNorm(s); if(q.length<3) return [];
  var qt=tri(q), out=[];
  for(var i=0;i<INAO.length;i++){ var e=INAO[i], sc=0;
    INAO_TRI[i].forEach(function(t){ var v=dice(qt,t); if(v>sc) sc=v; });
    if(e.w===q || e.aw.indexOf(q)>=0) sc=1.01;
    out.push({e:e,sc:sc}); }
  out.sort(function(a,b){ return b.sc-a.sc; });
  return out.slice(0,n||5);
}
function inaoFind(name){ var m=inaoMatch(name,1)[0]; return (m && m.sc>=0.99)? m.e : null; }
// Appellation INAO citée telle quelle dans la phrase (sans mot-clé « appellation »)
function inaoInText(t){
  if(!INAO) return null; var x=' '+inaoNorm(t)+' ', best=null;
  INAO.forEach(function(e){ [e.w].concat(e.aw).forEach(function(w){ if(w.length>=4 && x.indexOf(' '+w+' ')>=0 && (!best || w.length>best.len)) best={e:e,len:w.length}; }); });
  return best? best.e : null;
}
// Cépages : chaque nom dicté est rapproché de la liste (synonymes compris)
function cepMatch(tok){
  if(!CEPS) return null; var q=inaoNorm(tok); if(q.length<3) return null;
  var best=null;
  CEPS.forEach(function(c){ c.w.forEach(function(w){ var sc= w===q? 1.01 : simil(q,w); if(q.length>=6 && q.indexOf(" ")<0 && w.indexOf(q)===0) sc=Math.max(sc,0.9); if(!best||sc>best.sc) best={c:c,sc:sc}; }); });
  return (best && best.sc>=0.6)? best.c.n : null;
}
function cepMatchStrict(tok){ if(!CEPS) return null; var q=inaoNorm(tok), best=null;
  CEPS.forEach(function(c){ c.w.forEach(function(w){ var sc= w===q? 1.01 : simil(q,w); if(q.length>=6 && q.indexOf(" ")<0 && w.indexOf(q)===0) sc=Math.max(sc,0.9); if(!best||sc>best.sc) best={c:c,sc:sc}; }); });
  return (best && best.sc>=0.78)? best.c.n : null; }
function cepNormalize(v){
  if(!v) return v;
  var out=[];
  String(v).split(/\s*(?:,|;|\bet\b|\+|\/)\s*/i).map(function(p){ return p.trim(); }).filter(Boolean).forEach(function(p){
    var whole=cepMatchStrict(p); if(whole){ if(out.indexOf(whole)<0) out.push(whole); return; }
    // « grenache syrah » : découpage mot à mot, fenêtres de 3, 2 puis 1 mot
    var w=p.split(/\s+/), i=0, buf=[];
    while(i<w.length){ var hit=null, len=0;
      for(var L=Math.min(3,w.length-i);L>=1;L--){ var m=cepMatchStrict(w.slice(i,i+L).join(' ')); if(m){ hit=m; len=L; break; } }
      if(hit){ if(buf.length){ var ub=cepMatch(buf.join(' '))||capFr(buf.join(' ')); if(out.indexOf(ub)<0) out.push(ub); buf=[]; } if(out.indexOf(hit)<0) out.push(hit); i+=len; }
      else { buf.push(w[i]); i++; } }
    if(buf.length){ var ub2=cepMatch(buf.join(' '))||capFr(buf.join(' ')); if(out.indexOf(ub2)<0) out.push(ub2); }
  });
  return out.join(', ');
}
// Après l'analyse locale : correction de l'appellation et région / couleur tirées du référentiel (badge 📚)
function inaoAssist(t){

/* --- Mémoire des réponses IA : une même demande n'est jamais envoyée deux fois --- */
function cacheGet(k){ try{ var c=JSON.parse(localStorage.getItem('ai_cache')||'{}'); return c[k]? c[k].v : null; }catch(e){ return null; } }
function cacheSet(k,v){ try{ var c=JSON.parse(localStorage.getItem('ai_cache')||'{}'); c[k]={t:Date.now(),v:v}; var ks=Object.keys(c); if(ks.length>300){ ks.sort(function(a,b){ return c[a].t-c[b].t; }).slice(0,ks.length-300).forEach(function(x){ delete c[x]; }); } localStorage.setItem('ai_cache',JSON.stringify(c)); }catch(e){} }
function cachedAI(key,sys,usr){
  var hit=key? cacheGet(key) : null;
  if(hit) return Promise.resolve(Object.assign({_cache:true},hit));
  return aiCallRaw(sys,usr).then(function(r){ if(key) cacheSet(key,r); return r; });
}
