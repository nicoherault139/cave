<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cave — Nicolas</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="./icon.svg">
<meta name="theme-color" content="#b3542f">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="./icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600&family=Archivo:wght@400;600&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf8f3;--card:#fffdf8;--ink:#2b2620;--muted:#8a8073;--line:#e8e2d5;--acc:#b3542f;--gold:#9a7d2c;--green:#4c7a4c;--red:#a8402e;--shadow:0 10px 30px rgba(60,45,30,.08)}
@media(prefers-color-scheme:dark){:root{--bg:#1c1916;--card:#26221d;--ink:#efe9dd;--muted:#a09786;--line:#3a342c;--shadow:0 10px 30px rgba(0,0,0,.35)}}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:Archivo,system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex}
h1,h2,h3,.serif{font-family:Fraunces,Georgia,serif}
.mono{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
#app{display:flex;width:100%;min-height:100vh}
aside{width:250px;flex:0 0 250px;border-right:1px solid var(--line);padding:20px 16px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand h1{font-size:26px;line-height:1}
.brand small{color:var(--muted);font-size:12px}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;text-align:left;font-size:14.5px;color:var(--ink)}
.nav button:hover{background:var(--card)}
.nav button.on{background:var(--acc);color:#fff}
.badge{margin-left:auto;background:var(--red);color:#fff;border-radius:99px;font-size:11px;padding:1px 7px}
.gauges{display:flex;flex-direction:column;gap:10px;font-size:12.5px}
.gbar{height:7px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:4px}
.gfill{height:100%;background:var(--acc);border-radius:99px}
.gauge.garage .gfill{background:var(--gold)}
.store{margin-top:auto;font-size:12.5px;border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:8px}
.dot{display:inline-block;width:9px;height:9px;border-radius:99px;margin-right:6px;vertical-align:middle}
.dot.ok{background:var(--green)}.dot.err{background:var(--red)}.dot.off{background:var(--muted)}
.linkbtn{color:var(--acc);text-decoration:underline;font-size:12.5px}
main{flex:1;padding:28px 34px;max-width:1100px;overflow-y:auto}
.viewhead{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:22px;flex-wrap:wrap}
.viewhead h2{font-size:32px}
.eyebrow{color:var(--acc);font-size:12px;text-transform:uppercase;letter-spacing:.12em;font-weight:600}
.btn{background:var(--acc);color:#fff;border-radius:12px;padding:11px 18px;font-weight:600;font-size:14.5px;display:inline-flex;align-items:center;gap:8px}
.btn.sec{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:9px}
.btn.danger{background:var(--red)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:24px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.tile b{font-size:26px;display:block;font-family:"IBM Plex Mono",monospace}
.tile span{color:var(--muted);font-size:12.5px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow);margin-bottom:20px}
.panel h3{font-size:17px;margin-bottom:12px}
.searchbar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.searchbar input[type=text],input[type=number],select,textarea{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;color:var(--ink);font:inherit}
.searchbar input[type=text]{flex:1;min-width:200px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.chip{border:1px solid var(--line);border-radius:99px;padding:5px 13px;font-size:12.5px;background:var(--card)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);cursor:pointer;position:relative}
.card:hover{border-color:var(--acc)}
.card .eyebrow{margin-bottom:4px}
.card h4{font-family:Fraunces,serif;font-size:16.5px;margin-bottom:2px}
.card .meta{color:var(--muted);font-size:12.5px;margin-bottom:10px}
.tagrow{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:11px;border-radius:99px;padding:2px 9px;background:var(--bg);border:1px solid var(--line);color:var(--muted)}
.tag.q{background:var(--acc);color:#fff;border-color:var(--acc)}
.tag.dead{background:var(--muted);color:#fff;border-color:var(--muted)}
.tag.alert{background:var(--red);color:#fff;border-color:var(--red)}
form .row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
form .full{grid-column:1/-1}
label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px}
input,select,textarea{width:100%}
.formfoot{display:flex;gap:10px;margin-top:18px}
.banner{background:var(--bg);border:1px solid var(--gold);border-radius:12px;padding:11px 14px;font-size:13px;margin-bottom:16px}
.alert-item{display:flex;justify-content:space-between;gap:10px;padding:11px 4px;border-bottom:1px solid var(--line);font-size:14px;align-items:center}
.alert-item:last-child{border:none}
.sev{font-size:11px;border-radius:99px;padding:2px 9px;white-space:nowrap}
.sev.warn{background:#f3e3c8;color:#8a6414}.sev.crit{background:#f0d3cc;color:var(--red)}
.sev.ok{background:#d9e7d9;color:var(--green)}
#drawer{position:fixed;top:0;right:-440px;width:min(420px,100vw);height:100vh;background:var(--card);border-left:1px solid var(--line);transition:right .25s;z-index:50;overflow-y:auto;padding:26px;box-shadow:var(--shadow)}
#drawer.open{right:0}
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:.25s;z-index:40}
#overlay.open{opacity:1;pointer-events:auto}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
.fact b{display:block;font-size:14.5px}
.fact span{font-size:11.5px;color:var(--muted)}
.apobar{height:10px;background:var(--line);border-radius:99px;position:relative;margin:8px 0 4px}
.apobar .range{position:absolute;top:0;height:100%;background:var(--gold);border-radius:99px}
.apobar .now{position:absolute;top:-4px;width:4px;height:18px;background:var(--acc);border-radius:2px}
.chatbox{display:flex;flex-direction:column;gap:12px;max-width:720px}
.msg{padding:11px 15px;border-radius:14px;font-size:14.5px;max-width:85%;white-space:pre-wrap}
.msg.me{background:var(--acc);color:#fff;align-self:flex-end}
.msg.bot{background:var(--card);border:1px solid var(--line);align-self:flex-start}
.msg.bot b{font-family:Fraunces,serif}
.chatin{display:flex;gap:8px;margin-top:10px;max-width:720px}
.chatin input{flex:1}
.empty{color:var(--muted);text-align:center;padding:40px 0;font-size:14px}
.hint{font-size:12.5px;color:var(--muted)}
.micro{font-size:17px}
.micro.rec{background:var(--red);color:#fff;border-radius:99px;width:38px;height:38px;flex:0 0 38px}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 18px;font-size:13.5px;opacity:0;transition:.3s;z-index:99;pointer-events:none;max-width:90vw}
#toast.show{opacity:1}
details.cfg summary{cursor:pointer;font-weight:600;font-size:13px;color:var(--acc);margin-bottom:8px}
details.cfg input{margin:4px 0 8px}
@media(max-width:820px){
body{flex-direction:column}
aside{width:100%;flex:none;height:auto;position:static;border-right:none;border-bottom:1px solid var(--line);padding:14px}
.nav{flex-direction:row;overflow-x:auto;gap:6px}
.nav button{white-space:nowrap;font-size:13px;padding:7px 10px}
.gauges{flex-direction:row;gap:18px}
.gauge{flex:1}
.store{margin-top:6px;padding-top:10px}
main{padding:18px 14px}
form .row{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="app">
<aside>
 <div class="brand"><h1>Cave</h1><small>Nicolas · v2 PWA</small></div>
 <nav class="nav" id="nav"></nav>
 <div class="gauges" id="gauges"></div>
 <div class="store" id="store">
  <div id="syncstatus"></div>
  <button class="linkbtn" id="btn-export">Exporter une copie (.json)</button>
  <button class="linkbtn" id="btn-import">Importer un fichier .json</button>
  <button class="linkbtn" id="btn-cfg">Réglages OneDrive…</button>
 </div>
</aside>
<main id="main"></main>
<div id="overlay"></div>
<div id="drawer"></div>
<div id="toast"></div>
<input type="file" id="fileinput" accept=".json,application/json" hidden>
</div>
<script>
var S = { refs: [], view: 'dash', search: '', filter: 'Tous', drawer: null, editId: null, mode: null, chat: [], lots: null };
var REGIONS = ['Bourgogne','Rhône','Loire','Beaujolais','Alsace','Bordeaux','Provence','Champagne','Languedoc','Sud-Ouest','Jura','Savoie','Autre'];
var COULEURS = ['Rouge','Blanc','Rosé','Effervescent'];
var CAPS = { 'pessac-léognan':'Pessac-Léognan','sancerre':'Sancerre','chablis':'Chablis','châteauneuf-du-pape':'Châteauneuf-du-Pape','saint-joseph':'Saint-Joseph','cornas':'Cornas','condrieu':'Condrieu','côte-rôtie':'Côte-Rôtie','hermitage':'Hermitage','crozes-hermitage':'Crozes-Hermitage','chinon':'Chinon','vouvray':'Vouvray','morgon':'Morgon','fleurie':'Fleurie','juliénas':'Juliénas','saint-amour':'Saint-Amour','chénas':'Chénas','moulin-à-vent':'Moulin-à-Vent','pouilly-fuissé':'Pouilly-Fuissé','pouilly-fumé':'Pouilly-Fumé','meursault':'Meursault','pommard':'Pommard','gevrey-chambertin':'Gevrey-Chambertin','morey-saint-denis':'Morey-Saint-Denis','chambolle-musigny':'Chambolle-Musigny','vosne-romanée':'Vosne-Romanée','nuits-saint-georges':'Nuits-Saint-Georges','saint-émilion':'Saint-Émilion','pomerol':'Pomerol','margaux':'Margaux','pauillac':'Pauillac','saint-julien':'Saint-Julien','listrac-médoc':'Listrac-Médoc','moulis':'Moulis','fitou':'Fitou','minervois':'Minervois','corbières':'Corbières','pic-saint-loup':'Pic Saint-Loup','vacqueyras':'Vacqueyras','gigondas':'Gigondas','rasteau':'Rasteau','cairanne':'Cairanne','bandol':'Bandol','cassis':'Cassis','bellet':'Bellet','arbois':'Arbois','château-chalon':'Château-Chalon','savennières':'Savennières','anjou':'Anjou','saumur':'Saumur','montlouis':'Montlouis','menetou-salon':'Menetou-Salon','reedu-quincy':'Reuilly','quincy':'Quincy','sancerre':'Sancerre' };
var CEPAGES = ['gamay','pinot noir','chardonnay','syrah','grenache','mourvèdre','cinsault','carignan','cabernet sauvignon','cabernet franc','merlot','malbec','petit verdot','sauvignon blanc','chenin','riesling','gewurztraminer','muscat','viognier','roussanne','marsanne','grolleau','pineau d\'aunis','melon de bourgogne','aligote','ugni blanc','terret','nielluccio','sciaccarellu','vermentino','grenache blanc','clarette','arbois','poulsard','trousseau','savagnin'];

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function id(){ return 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function toast(m){ var t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); setTimeout(function(){ t.classList.remove('show'); },2600); }

/* ---------- apogée ---------- */
function apYears(r){
  var m = /(d{4})s*(?:[–\-—]|a|à|jusqu\'au|jusqu\'à|jusqu'a|to)?s*(d{4})?/.exec(String(r.apogee||''));
  if(!m) return null;
  var d = parseInt(m[1],10), f = m[2] ? parseInt(m[2],10) : d;
  if(f < d) f = d; return { d:d, f:f };
}
function inWindow(r){ var a=apYears(r); if(!a) return false; var y=new Date().getFullYear(); return y>=a.d && y<=a.f; }
function soonWindow(r){ var a=apYears(r); if(!a) return false; var y=new Date().getFullYear(); return a.d>0 && a.d-y<=2 && y<=a.f; }
function isLongGarde(r){ var a=apYears(r); if(!a) return false; var y=new Date().getFullYear(); return (a.f-a.d>8) || (a.f-y>5); }

/* ---------- règles métier ---------- */
function seuilBas(qi){ qi=qi||0; if(qi<=2) return 0; if(qi<=5) return 1; return 2; }
function alertsFor(r){
  var out=[];
  if(r.qte<=0) return out;
  if(inWindow(r)) out.push({sev:'ok',txt:'Apogée en cours ('+r.apogee+') — à boire'});
  else if(soonWindow(r)) out.push({sev:'warn',txt:'Apogée proche ('+r.apogee+')'});
  if(r.zone==='garage' && isLongGarde(r)) out.push({sev:'crit',txt:'Vin de garde stocké au garage'});
  if(r.qte<=seuilBas(r.qteInit)) out.push({sev:'warn',txt:'Stock bas ('+r.qte+' restante'+(r.qte>1?'s':'')+')'});
  return out;
}
function allAlerts(){ var out=[]; S.refs.forEach(function(r){ alertsFor(r).forEach(function(a){ if(a.sev!=='ok') out.push({ref:r,a:a}); }); }); return out; }
function alertCount(){ return allAlerts().length; }

/* ---------- persistance ---------- */
var LSKEY='cave-nicolas-v2';
function localSave(){ localStorage.setItem(LSKEY, JSON.stringify(S.refs)); }
function localLoad(){ try{ S.refs = JSON.parse(localStorage.getItem(LSKEY)||'[]'); }catch(e){ S.refs=[]; } }

/* ---------- CSV ---------- */
function csvCell(v){ v=String(v==null?'':v); return /[";\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; }
function toCSV(){
  var head=['domaine','region','appellation','couleur','millesime','cepages','qte','qteInit','zone','etagere','apogee','prix','note','dateEntree','lots'];
  var lines=[head.join(';')];
  S.refs.forEach(function(r){
    var lots=(r.lots||[]).map(function(l){ return l.qte+'@'+l.date; }).join(',');
    lines.push([r.domaine,r.region,r.appellation,r.couleur,r.millesime,r.cepages,r.qte,r.qteInit,r.zone,r.etagere||'',r.apogee,r.prix||'',r.note||'',r.dateEntree||'',lots].map(csvCell).join(';'));
  });
  return lines.join('\n');
}
function parseCSV(text){
  var rows=[]; var row=[]; var cell=''; var q=false;
  for(var i=0;i<text.length;i++){ var c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){ cell+='"'; i++; } else q=false; } else cell+=c; }
    else if(c==='"') q=true;
    else if(c===';'){ row.push(cell); cell=''; }
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; row.push(cell); if(row.some(function(x){return x!=='';})) rows.push(row); row=[]; cell=''; }
    else cell+=c;
  }
  row.push(cell); if(row.some(function(x){return x!=='';})) rows.push(row);
  if(!rows.length) return [];
  var head=rows[0].map(function(h){return h.trim().toLowerCase();});
  function get(r,name){ var i=head.indexOf(name); return i>=0?(r[i]||'').trim():''; }
  var map={};
  rows.slice(1).forEach(function(rw){
    var dom=get(rw,'domaine'); if(!dom) return;
    var mil=get(rw,'millesime');
    var key=dom.toLowerCase()+'|'+get(rw,'appellation').toLowerCase()+'|'+mil;
    var lotsRaw=get(rw,'lots'); var lots=[];
    if(lotsRaw){ lotsRaw.split(',').forEach(function(p){ var t=p.split('@'); if(t[0]) lots.push({qte:parseInt(t[0],10)||0,date:t[1]||''}); }); }
    var o=map[key];
    if(!o){ o={ id:id(), domaine:dom, region:get(rw,'region')||'Autre', appellation:get(rw,'appellation'), couleur:get(rw,'couleur')||'Rouge', millesime:mil||'', cepages:get(rw,'cepages'), qte:parseInt(get(rw,'qte'),10)||0, qteInit:parseInt(get(rw,'qteInit'),10)||0, zone:(get(rw,'zone')==='garage'?'garage':'frigo'), etagere:get(rw,'etagere')?parseInt(get(rw,'etagere'),10):null, apogee:get(rw,'apogee'), prix:get(rw,'prix')?parseFloat(get(rw,'prix').replace(',','.'))||null:null, note:get(rw,'note'), dateEntree:get(rw,'dateEntree'), lots:lots }; map[key]=o; }
    else{ o.qte += parseInt(get(rw,'qte'),10)||0; o.qteInit += parseInt(get(rw,'qteInit'),10)||0; if(lots.length) o.lots=(o.lots||[]).concat(lots); }
  });
  return Object.keys(map).map(function(k){ return map[k]; });
}

/* ---------- OneDrive (Microsoft Graph) ---------- */
var OD = { token: sessionStorage.getItem('od_token')||'', lastSnap: localStorage.getItem('od_snap')||'', clientId: localStorage.getItem('od_client')||'' };
var FILE_PATH='/Cave/cave-data.csv';
var GRAPH='https://graph.microsoft.com/v1.0';
function graph(method,path,body,mime){
  return fetch(GRAPH+path,{ method:method, headers:Object.assign({'Authorization':'Bearer '+OD.token}, body?{'Content-Type':mime||'text/plain'}:{}), body:body||undefined });
}
function odStatus(kind,label){ var el=document.getElementById('syncstatus'); el.innerHTML='<span class="dot '+kind+'"></span>'+esc(label); }
function odEnsureFolder(){ return graph('POST','/me/drive/root/children', JSON.stringify({name:'Cave',folder:{}, '@microsoft.graph.conflictBehavior':'fail'}), 'application/json').then(function(){},function(){}); }
function odPull(){
  if(!OD.token) return Promise.resolve(false);
  odStatus('off','Synchronisation OneDrive…');
  return graph('GET','/me/drive/root:'+FILE_PATH+':/content').then(function(r){
    if(!r.ok) throw new Error('fichier absent');
    return r.text();
  }).then(function(csv){
    var norm=csv.replace(/\r/g,'');
    if(norm!==OD.lastSnap){ var refs=parseCSV(norm); if(refs.length||S.refs.length===0){ S.refs=refs; localSave(); } OD.lastSnap=norm; }
    odStatus('ok','OneDrive synchronisé');
    return true;
  }).catch(function(e){ odStatus('err','OneDrive indisponible'); return false; });
}
function odPush(){
  if(!OD.token) return;
  var csv=toCSV().replace(/\n/g,'\r\n');
  odEnsureFolder().then(function(){
    return graph('PUT','/me/drive/root:'+FILE_PATH+':/content', csv, 'text/csv');
  }).then(function(r){ if(!r.ok) throw new Error('upload'); return r.json(); }).then(function(){ OD.lastSnap=csv.replace(/\r\n/g,'\n'); localStorage.setItem('od_snap',OD.lastSnap); odStatus('ok','OneDrive synchronisé'); }).catch(function(){ odStatus('err','Échec de mise à jour OneDrive'); });
}
function save(push){ localSave(); if(push!==false && OD.token) odPush(); render(); }

/* ---------- OAuth ---------- */
function odConnect(){
  if(!OD.clientId){ toast('Renseignez d\'abord votre Client ID (Réglages OneDrive)'); openCfg(); return; }
  localStorage.setItem('od_client',OD.clientId);
  var verifier=b64url(randArr(32)); var challenge=b64url(sha256verifier(verifier));
  sessionStorage.setItem('pkce',verifier);
  var redir=location.origin+location.pathname;
  var url='https://login.microsoftonline.com/consumers/oauth2/v2.0/authorize?response_type=code&client_id='+encodeURIComponent(OD.clientId)+'&redirect_uri='+encodeURIComponent(redir)+'&scope='+encodeURIComponent('Files.ReadWrite User.Read offline_access')+'&code_challenge='+challenge+'&code_challenge_method=S256';
  location.href=url;
}
function b64url(a){ return btoa(String.fromCharCode.apply(null,a)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function randArr(n){ var a=new Uint8Array(n); crypto.getRandomValues(a); return a; }
function sha256verifier(v){ // SHA-256 via subtle
  return crypto.subtle.digest('SHA-256', new TextEncoder().encode(v)).then(function(h){ return b64url(new Uint8Array(h)); });
}
function odHandleCode(){
  var p=new URLSearchParams(location.search);
  var code=p.get('code'); if(!code) return false;
  var v=sessionStorage.getItem('pkce'); history.replaceState(null,'',location.pathname);
  var redir=location.origin+location.pathname;
  fetch('https://login.microsoftonline.com/consumers/oauth2/v2.0/token',{ method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body:'client_id='+encodeURIComponent(OD.clientId)+'&grant_type=authorization_code&code='+encodeURIComponent(code)+'&redirect_uri='+encodeURIComponent(redir)+'&code_verifier='+encodeURIComponent(v) })
    .then(function(r){ return r.json(); }).then(function(t){
      if(t.access_token){ OD.token=t.access_token; sessionStorage.setItem('od_token',OD.token); if(t.refresh_token) localStorage.setItem('od_refresh',t.refresh_token); odPull().then(render); }
      else toast('Connexion OneDrive refusée');
    });
  return true;
}
function odRestore(){ // refresh token flow

    var i=document.getElementById('chat-in'); var t=i.value.trim(); if(!t) return;

  document.getElementById('chat-send').onclick=send;

  document.querySelectorAll('[data-sug]').forEach(function(b){ b.onclick=function(){ S.chat.push({me:true,txt:esc(b.getAttribute('data-sug'))}); S.chat.push({me:false,txt:recoSoir(b.getAttribute('data-sug'))}); vSoir(); }; });
}
function recoSoir(t){
  var pool=current(); if(!pool.length) return 'Votre cave est vide — commencez par ajouter quelques bouteilles !';
  var s=t.toLowerCase(); var wanted=[]; var notes=[];
  if(/apéro|apero|léger|leger|rafraîch|frais|franche/.test(s)) wanted=wanted.concat(['Blanc','Rosé','Effervescent']);
  if(/rouge/.test(s)) wanted.push('Rouge');
  if(/blanc/.test(s)) wanted.push('Blanc');
  if(/ros/.test(s)) wanted.push('Rosé');
  if(/champagne|bulles|effervescent|mousseux|fête|fete/.test(s)) wanted.push('Effervescent');
  if(/viande|boeuf|bœuf|agneau|gibier|rôti|roti|veau|civet|sauce/.test(s)){ wanted.push('Rouge'); notes.push('un rouge structuré tannique accompagnera bien'); }
  if(/poisson|fruits de mer|fruit de mer|huître|huitre|sushi|crustacé/.test(s)) wanted.push('Blanc');
  if(/fromage/.test(s)) notes.push('avec du fromage, privilégiez un rouge souple ou un blanc évolué');
  if(/dessert|sucré|sucre|chocolat/.test(s)) wanted.push('Effervescent');
  REGIONS.forEach(function(rg){ if(s.indexOf(rg.toLowerCase().replace('ô','o'))>=0||s.indexOf(rg.toLowerCase())>=0) notes.push('côté '+rg); });
  var picks=pool;
  if(wanted.length) picks=picks.filter(function(r){ return wanted.indexOf(r.couleur)>=0; });
  if(/maintenant|ce soir|prêt|pret|apogée|apogee/.test(s)) picks=picks.filter(function(r){ return inWindow(r)||!apYears(r); });
  var ready=picks.filter(inWindow), rest=picks.filter(function(r){ return !inWindow(r); });
  picks=ready.concat(rest).slice(0,3);
  if(!picks.length) return 'Je n\'ai rien trouvé de tel en stock. Essayez autre chose — ou consultez l\'écran Ma cave !';
  var intro = notes.length? 'Très bien. Pour cette occasion, '+notes.join(', ')+' — voici mes suggestions :' : 'Voici ce que je vous propose ce soir :';
  return intro+'\n\n'+picks.map(function(r,i){
    return '<b>'+(i+1)+'. '+esc(r.domaine)+' '+esc(r.millesime)+'</b> — '+esc(r.appellation)+' ('+esc(r.region)+', '+esc(r.couleur)+')\n'+(inWindow(r)? '✔ À son apogée ('+esc(r.apogee)+')' : 'Apogée : '+esc(r.apogee||'n.c.'))+' · <span class="mono">×'+r.qte+'</span> en stock · '+(r.zone==='garage'?'Garage':'Frigo, étagère '+r.etagere);
  }).join('\n\n')+'\n\nBonne dégustation ! 🥂';
}

/* ---------- tiroir de détail ---------- */
function openRef(rid){
  var r=S.refs.find(function(x){ return x.id===rid; }); if(!r) return;
  var a=apYears(r); var y=new Date().getFullYear();
  var apbar='';
  if(a&&a.f>a.d){ var tot=a.f-a.d+1; var pos=Math.max(0,Math.min(100,(y-a.d)/tot*100));
    apbar='<label style="margin-top:16px">Fenêtre d\'apogée · '+esc(r.apogee)+'</label><div class="apobar"><div class="range" style="left:0;width:100%"></div><div class="now" style="left:'+pos+'%"></div></div><div class="hint">Le curseur indique où nous en sommes ('+y+').</div>';
  } else if(a){ apbar='<p class="hint" style="margin-top:14px">Apogée : '+esc(r.apogee)+'</p>'; }
  var lots=(r.lots||[]).length>1? '<label style="margin-top:18px">Historique des entrées</label>'+(r.lots||[]).map(function(l){ return '<div class="alert-item"><span class="hint">Lot</span><span><span class="mono">'+l.qte+' b.</span> entrées le '+esc(l.date)+'</span></div>'; }).join('') : '';
  drawerOpen('\
   <span class="eyebrow">'+esc(r.region)+'</span>\
   <h2 style="margin:4px 0 2px">'+esc(r.domaine)+'</h2>\
   <p class="hint">'+esc(r.appellation)+' · '+esc(r.couleur)+'</p>\
   <div class="facts">\
     <div class="fact"><span>Millésime</span><b class="mono">'+esc(r.millesime)+'</b></div>\
     <div class="fact"><span>Quantité</span><b class="mono">×'+r.qte+' <span class="hint">(init. '+r.qteInit+')</span></b></div>\
     <div class="fact"><span>Emplacement</span><b>'+(r.zone==='garage'?'Garage':'Frigo · étagère '+r.etagere)+'</b></div>\
     <div class="fact"><span>Entrée en cave</span><b class="mono">'+esc(r.dateEntree||'—')+'</b></div>\
     <div class="fact"><span>Cépages</span><b>'+esc(r.cepages||'—')+'</b></div>\
     <div class="fact"><span>Prix d\'achat</span><b class="mono">'+(r.prix? r.prix+' €':'—')+'</b></div>\
   </div>'+apbar+lots+\
   (r.note?'<p class="hint" style="margin-top:14px">📝 '+esc(r.note)+'</p>':'')+\
   (r.qte<=0?'<p class="hint" style="color:var(--red);margin-top:12px">Référence épuisée — réactivable au réassort.</p>':'')+\
   '<div class="formfoot" style="margin-top:22px">\
     <button class="btn" id="d-out">Sortir une bouteille</button>\
     <button class="btn sec" id="d-edit">Modifier la fiche</button>\
     <button class="btn danger" id="d-del">Supprimer</button>\
   </div>');
  document.getElementById('d-out').onclick=function(){
    if(r.qte<=0){ toast('Référence déjà épuisée'); return; }
    r.qte--; if(r.qte===0) toast('Dernière bouteille ! La fiche est conservée (épuisée) — réactivable au réassort.'); else toast('Une bouteille sortie · reste '+r.qte);
    save(); openRef(rid);
  };
  document.getElementById('d-edit').onclick=function(){ S.editId=rid; S.view='add'; closeDrawer(); render(); };
  document.getElementById('d-del').onclick=function(){ if(confirm('Supprimer définitivement la fiche « '+r.domaine+' '+r.millesime+' » ?')){ S.refs=S.refs.filter(function(x){ return x.id!==rid; }); closeDrawer(); save(); toast('Fiche supprimée'); } };
}
function drawerOpen(html){ document.getElementById('drawer').innerHTML=html; document.getElementById('drawer').classList.add('open'); document.getElementById('overlay').classList.add('open'); }
function closeDrawer(){ document.getElementById('drawer').classList.remove('open'); document.getElementById('overlay').classList.remove('open'); }

/* ---------- saisie vocale ---------- */
function recStart(cb, onEnd){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ toast('Reconnaissance vocale non supportée par ce navigateur'); return null; }
  var rec=new SR(); rec.lang='fr-FR'; rec.continuous=true; rec.interimResults=true;
  rec.onresult=function(e){ var t=''; for(var i=0;i<e.results.length;i++) t+=e.results[i][0].transcript; cb(t); };
  rec.onerror=function(){};
  rec.onend=function(){ if(S.listening){ try{ rec.start(); }catch(e){} } else if(onEnd) onEnd(); };
  try{ rec.start(); }catch(e){}
  return rec;
}
var REC=null;
function voiceQuery(cb){
  if(REC&&S.listening){ S.listening=false; REC.stop(); REC=null; toast('Micro arrêté'); return; }
  S.listening=true; toast('Parlez… (recliquez pour arrêter)');
  REC=recStart(function(t){ cb(t.trim()); S.listening=false; try{REC.stop();}catch(e){} REC=null; toast('Reçu : « '+t.trim()+' »'); });
}
function voiceAdd(){
  if(REC&&S.listening){ S.listening=false; REC.stop(); REC=null; return; }
  S.listening=true;
  var tr=document.getElementById('a-transcript'); tr.style.display='block'; tr.textContent='🎤 Dictez la fiche en annonçant chaque champ : domaine, appellation, région, couleur, millésime, cépage, quantité, emplacement, apogée, prix, note…';
  REC=recStart(function(t){
    tr.innerHTML='Transcription : « '+esc(t)+' »<br><span class="hint">Vérifiez avant d\'enregistrer — l\'extraction peut se tromper sur les noms rares.</span>';
    extractVoice(t);
  }, function(){});
}
function extractVoice(t){
  var s=' '+t.toLowerCase()+' ';
  function grab(re){ var m=re.exec(s); return m? m[1].trim():null; }
  var dom=grab(/domaine\s+(?:de\s+|du\s+|des\s+|d['\u2019]?)([^,;.]+)/)||grab(/ch(?:â|a)teau\s+([^,;.]+)/)||grab(/clos\s+([^,;.]+)/);
  var app=grab(/appellation\s+([^,;.]+)/);
  var reg=null; REGIONS.forEach(function(rg){ if(s.indexOf(rg.toLowerCase())>=0) reg=rg; });
  if(/beaujolais/.test(s)&&/villages?/.test(s)) reg='Beaujolais';
  var col=null; if(/rouge/.test(s)) col='Rouge'; else if(/blanc/.test(s)) col='Blanc'; else if(/ros(é|e)/.test(s)) col='Rosé'; else if(/effervescent|champagne|mousseux|crémant/.test(s)) col='Effervescent';
  var mil=grab(/mill(?:é|e)sime\s+(\d{4})/)||grab(/mill(?:é|e)sime\s+([^,;.]+)/)||grab(/(\d{4})/);
  var cep=grab(/c(?:é|e)page[s]?\s+([^,;.]+)/);
  var qte=grab(/quantit(?:é|e)\s+(\d+)/)||grab(/(\d+)\s+bouteilles?/);
  var et=null,zone='frigo';
  if(/garage/.test(s)) zone='garage';
  var em=grab(/(?:é|e)tag(?:è|e)re\s+(\d)/); if(em) et=parseInt(em[1]||em,10); if(et){ zone='frigo'; }
  var ap=grab(/apog(?:é|e)e\s+([^,;.]+)/);
  var prix=grab(/prix\s+([^,;.]+)/);
  var note=grab(/note\s+([^,;.]+)/);
  // normalisations
  if(dom){ dom=dom.replace(/\s+(millésime|cépage|quantité|appellation|région|couleur|emplacement|apogée|prix|note).*$/,''); }
  if(cep){ var found=[]; CEPAGES.forEach(function(c){ if(cep.indexOf(c)>=0) found.push(c); }); var corr={ 'pinot noir':'Pinot noir','chardonnay':'Chardonnay','gamay':'Gamay','syrah':'Syrah','grenache':'Grenache','merlot':'Merlot','cabernet sauvignon':'Cabernet sauvignon','cabernet franc':'Cabernet franc','sauvignon blanc':'Sauvignon blanc','chenin':'Chenin','riesling':'Riesling','gewurztraminer':'Gewurztraminer','muscat':'Muscat','viognier':'Viognier','mourvèdre':'Mourvèdre','cinsault':'Cinsault','malbec':'Malbec','grolleau':'Grolleau','melon de bourgogne':'Melon de Bourgogne','pinot meunier':'Pinot meunier' };
    cep=found.length? found.map(function(c){ return corr[c]||c.charAt(0).toUpperCase()+c.slice(1); }).join(', ') : cep;
  }
  if(app){ var k=app.toLowerCase(); if(CAPS[k]) app=CAPS[k]; }
  var set=function(fid,v){ if(v!==null&&v!==undefined&&v!==''){ var el=document.getElementById(fid); if(el){ if(el.tagName==='SELECT'){ for(var i=0;i<el.options.length;i++){ if(el.options[i].text.toLowerCase().indexOf(String(v).toLowerCase())>=0){ el.selectedIndex=i; break; } } } else el.value=el.tagName==='SELECT'?el.value:v; } } };
  set('f-domaine',dom?dom.replace(/\b\w/g,function(c){return c.toUpperCase();}):null);
  set('f-appellation',app);
  set('f-region',reg);
  set('f-couleur',col);
  set('f-millesime',mil);
  set('f-cepages',cep);
  set('f-qte',qte);
  set('f-apogee',ap);
  if(zone==='garage'){ document.getElementById('f-zone').value='garage'; } else { document.getElementById('f-zone').value='frigo'; if(et) document.getElementById('f-etagere').value=String(et); }
  set('f-prix',prix?prix.replace(/[^0-9,.]/g,''):null);
  set('f-note',note);
  toast('Champs extraits — vérifiez la transcription puis enregistrez');
}

/* ---------- export / import ---------- */
function doExport(){
  var blob=new Blob([JSON.stringify(S.refs,null,1)],{type:'application/json'});
  var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='cave-export-'+new Date().toISOString().slice(0,10)+'.json'; a.click(); toast('Copie exportée');
}
function doImport(input){
  var f=input.files[0]; if(!f) return;
  f.text().then(function(t){ var d=JSON.parse(t); if(Array.isArray(d)){ S.refs=d; save(); toast('Import réussi · '+d.length+' références'); } }).catch(function(){ toast('Fichier invalide'); });
}

/* ---------- init ---------- */
localLoad();
document.getElementById('overlay').onclick=closeDrawer;
document.getElementById('btn-export').onclick=doExport;
document.getElementById('btn-import').onclick=function(){ document.getElementById('fileinput').click(); };
document.getElementById('fileinput').onchange=function(){ doImport(this); };
if(!OD.token) odStatus('off','OneDrive non connecté');
odHandleCode();
odRestore();
if(OD.token && !location.search) odPull().then(render);
render();
if('serviceWorker' in navigator && location.protocol==='https:'){ navigator.serviceWorker.register('./sw.js').catch(function(){}); }
</script>
